// ─── STATE ──────────────────────────────────────────────
var S = {
  mode: 'toddler',
  xp: parseInt(localStorage.getItem('sdg_xp') || '0'),
  streak: parseInt(localStorage.getItem('sdg_str') || '1'),
  done: JSON.parse(localStorage.getItem('sdg_done') || '[]'),
  bdgs: JSON.parse(localStorage.getItem('sdg_bdgs') || '[]'),
  curWorld: null,
  curLesson: null,
  step: 0,
  qScore: 0,
  qIdx: 0
};

function save() {
  localStorage.setItem('sdg_xp', S.xp);
  localStorage.setItem('sdg_str', S.streak);
  localStorage.setItem('sdg_done', JSON.stringify(S.done));
  localStorage.setItem('sdg_bdgs', JSON.stringify(S.bdgs));
}

var LVLS = [{n:'🥚 Egg',x:0},{n:'🐣 Hatchling',x:100},{n:'🐥 Chick',x:250},{n:'🐦 Bird',x:500},{n:'🦅 Eagle',x:900},{n:'🚀 Astronaut',x:1500},{n:'⭐ Star',x:2500},{n:'🌌 Galaxy Brain',x:4000}];
function getLevel(xp) { var l = LVLS[0]; for (var i = 0; i < LVLS.length; i++) { if (xp >= LVLS[i].x) l = LVLS[i]; } return l; }
function getNext(xp)  { for (var i = 0; i < LVLS.length; i++) { if (xp < LVLS[i].x) return LVLS[i]; } return {n:'👑 Legend',x:99999}; }

var tipOpen = -1, GS = {}, dragIdx = null;

// ─── MODE ───────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  document.querySelectorAll('.mc').forEach(function(b){ b.classList.remove('on'); });
  document.querySelector('.mc[onclick="setMode(\'' + m + '\')"]').classList.add('on');
}

// ─── NAVIGATION ─────────────────────────────────────────
function nav(v) {
  if (v === 'wins') renderWins();
  if (v === 'profile') renderProfile();
  if (v === 'map') renderMap();
  document.querySelectorAll('.view').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.nb').forEach(function(e){ e.classList.remove('on'); });
  var view = document.getElementById('v-' + v);
  if (view) view.classList.add('active');
  var nb = document.getElementById('nb-' + v);
  if (nb) nb.classList.add('on');
  window.scrollTo(0, 0);
}

// ─── UPDATE XP BAR ──────────────────────────────────────
function updateXP() {
  var x = S.xp, l = getLevel(x), nl = getNext(x);
  var pct = Math.min(100, ((x - l.x) / (nl.x - l.x)) * 100);
  document.getElementById('st-xp').textContent = x;
  document.getElementById('st-streak').textContent = S.streak;
  document.getElementById('xp-cur').textContent = x;
  document.getElementById('xp-nxt').textContent = nl.x;
  document.getElementById('level-name').textContent = l.n;
  document.getElementById('xp-bar').style.width = pct + '%';
}

function addXP(n) { S.xp += n; updateXP(); save(); showToast('+' + n + ' XP ⭐'); }

// ─── RENDER MAP ─────────────────────────────────────────
function renderMap() {
  var g = document.getElementById('worlds-grid');
  g.innerHTML = '';
  W.forEach(function(w) {
    var done = w.lessons.filter(function(l){ return S.done.indexOf(l.id) > -1; }).length;
    var total = w.lessons.length;
    var full = done === total;
    var dots = w.lessons.map(function(l){
      return '<div class="wdot' + (S.done.indexOf(l.id) > -1 ? ' done' : '') + '"></div>';
    }).join('');
    var c = document.createElement('div');
    c.className = 'wcard ' + w.cls;
    c.innerHTML = '<span class="wpl">' + w.emoji + '</span>' +
      '<div class="wnm">' + w.name + '</div>' +
      '<div class="wsb">' + w.sub + '</div>' +
      '<div class="wpr"><div class="wdts">' + dots + '</div><span class="wct">' + done + '/' + total + '</span></div>' +
      (full ? '<div class="wbg">✅</div>' : '');
    c.onclick = function(){ openWorld(w); };
    g.appendChild(c);
  });
  updateXP();
}

// ─── OPEN WORLD ─────────────────────────────────────────
function openWorld(w) {
  S.curWorld = w;
  var card = document.getElementById('wh-card');
  card.className = 'whero ' + w.cls;
  card.style.borderColor = w.col;
  card.style.background = w.lcol;
  document.getElementById('wh-emoji').textContent = w.emoji;
  document.getElementById('wh-title').textContent = w.name;
  document.getElementById('wh-desc').textContent = w.desc;
  document.getElementById('wh-mascot').textContent = '💬 ' + w.say;
  document.getElementById('wh-ltitle').textContent = w.emoji + ' Lessons';
  var list = document.getElementById('lessons-list');
  list.innerHTML = '';
  w.lessons.forEach(function(l) {
    var done = S.done.indexOf(l.id) > -1;
    var row = document.createElement('div');
    row.className = 'lrow' + (done ? ' done' : '');
    row.innerHTML = '<div class="lic" style="background:' + w.lcol + ';border-color:' + w.col + '">' + (done ? '✅' : l.emoji) + '</div>' +
      '<div class="ltt"><div class="ltl">' + l.title + '</div><div class="lts">' + l.sub + '</div></div>' +
      '<div class="lri">' + (done ? '⭐⭐⭐' : '▶️') + '</div>';
    row.onclick = function(){ openLesson(l, w); };
    list.appendChild(row);
  });
  nav('world');
}

// ─── OPEN LESSON ────────────────────────────────────────
function openLesson(l, w) {
  S.curLesson = l; S.curWorld = w; S.step = 0; S.qScore = 0; S.qIdx = 0;
  document.getElementById('ll-title').textContent = l.title;
  document.getElementById('ll-sub').textContent = w.name + ' · ' + l.sub;
  renderStep();
  nav('lesson');
}

function renderStep() {
  var l = S.curLesson, s = S.step;
  tipOpen = -1;
  var pips = ['📖','🎨','🎮','❓'];
  var track = document.getElementById('step-track');
  track.innerHTML = pips.map(function(_, i){
    return '<div class="spip' + (i < s ? ' dn' : i === s ? ' act' : '') + '"></div>';
  }).join('');
  var body = document.getElementById('lesson-body');
  if (s === 0) body.innerHTML = buildStory(l);
  else if (s === 1) body.innerHTML = buildDiagram(l);
  else if (s === 2) { body.innerHTML = buildGame(l); initGame(l); }
  else body.innerHTML = buildQuiz(l, 0);
}

// ─── STORY ──────────────────────────────────────────────
function buildStory(l) {
  var s = l.story, w = S.curWorld;
  var txt = s.text[S.mode] || s.text.toddler;
  var fl = s.parts.map(function(p, i){
    return '<span class="flt" style="top:' + (15 + i*20) + '%;left:' + (8 + i*22) + '%;animation-delay:' + (i*0.6) + 's">' + p + '</span>';
  }).join('');
  return '<div class="scard">' +
    '<div class="sscene" style="background:linear-gradient(135deg,' + w.col + '33,' + w.col + '11)">' +
    fl + '<div class="smain">' + s.scene + '</div></div>' +
    '<div class="sbdy"><div class="mrow"><div class="mav">' + s.mascot.split(' ').pop() + '</div>' +
    '<div class="mnm">' + s.mascot + ' says:</div></div>' +
    '<div class="stxt">' + txt + '</div>' +
    '<div class="sfct">💡 <span>' + s.fact + '</span></div></div></div>' +
    '<button class="bbtn pur" onclick="S.step=1;renderStep()">Explore the Diagram! 🎨 →</button>';
}

// ─── DIAGRAM ────────────────────────────────────────────
function buildDiagram(l) {
  var d = l.diag;
  var nodes = d.nodes.map(function(n, i){
    return '<div class="dnd" id="dn' + i + '" onclick="showTip(' + i + ',' + d.nodes.length + ')">' +
      '<div class="dico">' + n.icon + '</div><div class="dtxt">' + n.text + '</div></div>' +
      '<div class="dtip" id="dt' + i + '">' + n.tip + '</div>' +
      (i < d.nodes.length - 1 ? '<div class="darr">↓</div>' : '');
  }).join('');
  return '<div class="dcard"><div class="dtit">' + d.title + '</div>' + nodes +
    '<div class="dhnt">👆 Tap each box to learn more!</div></div>' +
    '<button class="bbtn pur" onclick="S.step=2;renderStep()">Play the Game! 🎮 →</button>';
}

function showTip(i, total) {
  if (tipOpen === i) {
    var el = document.getElementById('dt' + i); if(el) el.classList.remove('show');
    var nd = document.getElementById('dn' + i); if(nd) nd.classList.remove('lit');
    tipOpen = -1;
  } else {
    if (tipOpen >= 0) {
      var oel = document.getElementById('dt' + tipOpen); if(oel) oel.classList.remove('show');
      var ond = document.getElementById('dn' + tipOpen); if(ond) ond.classList.remove('lit');
    }
    var nel = document.getElementById('dt' + i); if(nel) nel.classList.add('show');
    var nnd = document.getElementById('dn' + i); if(nnd) nnd.classList.add('lit');
    tipOpen = i;
  }
}

// ─── GAMES ──────────────────────────────────────────────
function buildGame(l) {
  var g = l.game, w = S.curWorld;
  if (g === 'bee')   return buildBee(w);
  if (g === 'cache') return buildCache(w);
  if (g === 'mail')  return buildMail(w);
  if (g === 'robot') return buildRobot(w);
  return buildTaco(w);
}
function initGame(l) {
  var g = l.game;
  if (g === 'bee')   initBee();
  else if (g === 'cache') initCache();
  else if (g === 'mail')  initMail();
  else if (g === 'robot') initRobot();
  else initTaco();
}
function unlockNext() { var nb = document.getElementById('game-next'); if (nb) nb.classList.remove('dis'); }

// TACO GAME
var FOODS = ['🌮','🍕','🍔','🌯','🍣','🥗','🍜','🥪'];
function buildTaco(w) {
  return '<div class="gcard"><div class="gtit">' + S.curLesson.emoji + ' Send the Requests!</div>' +
    '<div class="gsb">Tap SEND to deliver orders! Fill the bar!</div>' +
    '<div class="scrow"><div class="scbx"><div class="scn" id="tg-sc" style="color:' + w.col + '">0</div><div class="scl">Sent ✅</div></div>' +
    '<div class="scbx"><div class="scn" style="color:#22c55e">5</div><div class="scl">Goal 🎯</div></div></div>' +
    '<div class="olist" id="olist"></div>' +
    '<div class="ptrk"><div class="pfl" id="tg-pg" style="width:0%"></div></div></div>' +
    '<button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>';
}
function initTaco() { GS = {s:0, t:5}; spawnO(); spawnO(); spawnO(); }
function spawnO() {
  var list = document.getElementById('olist');
  if (!list || list.children.length >= 3) return;
  var f = FOODS[Math.floor(Math.random() * FOODS.length)];
  var w = S.curWorld;
  var d = document.createElement('div'); d.className = 'orow';
  d.innerHTML = '<span style="font-size:24px">' + f + '</span><span style="flex:1">Order for ' + f + '!</span>' +
    '<button class="sbtn" style="background:' + w.col + ';box-shadow:0 3px 0 ' + w.bdcol + '" onclick="sendO(this)">SEND ⚡</button>';
  list.appendChild(d);
}
function sendO(btn) {
  var row = btn.closest('.orow');
  row.style.opacity = '.4'; row.style.transform = 'translateX(28px)'; row.style.transition = 'all .3s';
  btn.disabled = true; btn.textContent = '✅';
  GS.s++;
  var pct = Math.min(100, (GS.s / GS.t) * 100);
  var sc = document.getElementById('tg-sc'); if(sc) sc.textContent = GS.s;
  var pg = document.getElementById('tg-pg'); if(pg) pg.style.width = pct + '%';
  setTimeout(function(){ row.remove(); spawnO(); }, 500);
  if (GS.s >= GS.t) { unlockNext(); showToast('🎉 Game done! Quiz time!'); }
}

// BEE GAME
function buildBee(w) {
  var lanes = [0,1,2].map(function(i){
    return '<div class="bln" onclick="dirBee(' + i + ')">' +
      '<div class="blnm">🌺 Server ' + (i+1) + '</div>' +
      '<div class="blc" style="color:' + w.col + '" id="bc' + i + '">0</div>' +
      '<div class="blf" id="bf' + i + '">😊</div>' +
      '<div class="blb"><div class="blbf" id="bh' + i + '" style="width:100%"></div></div></div>';
  }).join('');
  return '<div class="gcard"><div class="gtit">🐝 Buzz Balancer!</div>' +
    '<div class="gsb">Tap servers to redirect bees! Keep each under 5!</div>' +
    '<div class="scrow"><div class="scbx"><div class="scn" id="bg-sc" style="color:' + w.col + '">0</div><div class="scl">Balanced 🐝</div></div>' +
    '<div class="scbx"><div class="scn" id="bg-ov" style="color:#ef4444">0</div><div class="scl">Overflow 😱</div></div></div>' +
    '<div class="blns">' + lanes + '</div>' +
    '<div style="text-align:center;font-size:12px;font-weight:800;color:#6b7280">Keep each server under 5 bees!</div></div>' +
    '<button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>';
}
function initBee() {
  GS = {lanes:[0,0,0], s:0, ov:0, t:10, iv:null};
  GS.iv = setInterval(function(){
    if (!document.getElementById('bc0')) { clearInterval(GS.iv); return; }
    var mx = Math.max.apply(null, GS.lanes);
    if (mx >= 5) {
      GS.ov++;
      var mi = GS.lanes.indexOf(mx);
      GS.lanes[mi] = Math.max(0, GS.lanes[mi] - 1);
      updBees();
      var el = document.getElementById('bg-ov'); if(el) el.textContent = GS.ov;
    }
  }, 1800);
}
function dirBee(i) {
  GS.lanes[i]++; GS.s++;
  var el = document.getElementById('bg-sc'); if(el) el.textContent = GS.s;
  updBees();
  setTimeout(function(){ GS.lanes[i] = Math.max(0, GS.lanes[i] - 1); updBees(); }, 1100);
  if (GS.s >= GS.t) { clearInterval(GS.iv); unlockNext(); showToast('🐝 Great balancing!'); }
}
function updBees() {
  for (var i = 0; i < 3; i++) {
    var c = GS.lanes[i];
    var bc = document.getElementById('bc' + i);
    var bh = document.getElementById('bh' + i);
    var bf = document.getElementById('bf' + i);
    if (bc) bc.textContent = c;
    if (bh) { var p = Math.max(0, 100 - c*20); bh.style.width = p + '%'; bh.style.background = p < 40 ? '#ef4444' : '#22c55e'; }
    if (bf) bf.textContent = c >= 5 ? '😫' : c >= 3 ? '😅' : '😊';
  }
}

// CACHE GAME
var CITEMS = ['🍪','🍕','🌮','🍔','🍣','🥗'];
function buildCache(w) {
  var slots = Array(6).fill(0).map(function(_, i){
    return '<div class="cslt" id="cs' + i + '" onclick="fillSlot(' + i + ')"><div class="csic">📭</div><div>Empty</div></div>';
  }).join('');
  return '<div class="gcard"><div class="gtit">🍪 Cookie Cache!</div>' +
    '<div class="gsb">Tap slots to fill your cache!</div>' +
    '<div class="scrow"><div class="scbx"><div class="scn" id="ch-ht" style="color:#22c55e">0</div><div class="scl">Hits ⚡</div></div>' +
    '<div class="scbx"><div class="scn" id="ch-ms" style="color:#ef4444">0</div><div class="scl">Miss 🐌</div></div></div>' +
    '<div style="font-size:13px;font-weight:800;margin-bottom:7px">Your Cache Counter (tap to fill!):</div>' +
    '<div class="cslts">' + slots + '</div>' +
    '<div class="rqbx" id="cache-req">Waiting for a customer... 👀</div></div>' +
    '<button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>';
}
function initCache() { GS = {cache:Array(6).fill(null), hits:0, miss:0, total:0, t:8, iv:null}; GS.iv = setInterval(makeReq, 2200); setTimeout(makeReq, 400); }
function fillSlot(i) {
  var item = CITEMS[Math.floor(Math.random() * CITEMS.length)];
  GS.cache[i] = item;
  var el = document.getElementById('cs' + i);
  if (el) { el.className = 'cslt full'; el.innerHTML = '<div class="csic">' + item + '</div><div>Cached!</div>'; }
}
function makeReq() {
  if (!document.getElementById('cache-req')) { clearInterval(GS.iv); return; }
  var want = CITEMS[Math.floor(Math.random() * CITEMS.length)];
  var req = document.getElementById('cache-req');
  if (req) req.textContent = '🤔 Customer wants: ' + want;
  setTimeout(function(){
    if (!document.getElementById('cache-req')) { clearInterval(GS.iv); return; }
    var hit = GS.cache.indexOf(want) > -1;
    GS.total++;
    if (hit) { GS.hits++; var e = document.getElementById('ch-ht'); if(e) e.textContent = GS.hits; showToast('⚡ Cache HIT!'); }
    else { GS.miss++; var e2 = document.getElementById('ch-ms'); if(e2) e2.textContent = GS.miss; showToast('🐌 Cache MISS!'); }
    if (GS.total >= GS.t) { clearInterval(GS.iv); unlockNext(); }
  }, 700);
}

// MAIL GAME
var MAILS = [{e:'📧',l:'Order'},{e:'🔔',l:'Notif'},{e:'📦',l:'Ship'},{e:'💳',l:'Pay'},{e:'📊',l:'Stats'}];
function buildMail(w) {
  var chips = MAILS.map(function(m, i){
    return '<div class="mchp" draggable="true" id="mc' + i + '" ondragstart="dragIdx=' + i + '">' + m.e + ' ' + m.l + '</div>';
  }).join('');
  return '<div class="gcard"><div class="gtit">📬 Queue Manager!</div>' +
    '<div class="gsb">Drag mail to the queue, then process it!</div>' +
    '<div class="scrow"><div class="scbx"><div class="scn" id="mg-pr" style="color:#22c55e">0</div><div class="scl">Processed ✅</div></div>' +
    '<div class="scbx"><div class="scn" id="mg-q" style="color:' + w.col + '">0</div><div class="scl">In Queue 📥</div></div></div>' +
    '<div class="minc">' + chips + '</div>' +
    '<div class="dropz" id="dropz" ondragover="event.preventDefault();this.classList.add(\'over\')" ondrop="dropMail(event)">' +
    '<span style="color:#6b7280;font-size:12px;font-weight:800;margin:auto">📥 Drop mail here!</span></div>' +
    '<button class="pbtn" onclick="processQ()">⚡ Process Queue!</button></div>' +
    '<button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>';
}
function initMail() { GS = {q:0, proc:0, t:3}; }
function dropMail(e) {
  e.preventDefault();
  var dz = document.getElementById('dropz'); if (!dz) return;
  dz.classList.remove('over');
  if (dragIdx === null) return;
  var m = MAILS[dragIdx];
  var orig = document.getElementById('mc' + dragIdx); if (orig) orig.style.opacity = '.3';
  var chip = document.createElement('div'); chip.className = 'mchp';
  chip.textContent = m.e + ' ' + m.l; dz.appendChild(chip);
  GS.q = (GS.q || 0) + 1;
  var el = document.getElementById('mg-q'); if (el) el.textContent = GS.q;
  dragIdx = null;
}
function processQ() {
  var dz = document.getElementById('dropz'); if (!dz) return;
  var chips = Array.from(dz.querySelectorAll('.mchp'));
  if (!chips.length) { showToast('Add mail to queue first!'); return; }
  chips.forEach(function(c, i){
    setTimeout(function(){ c.style.background = '#d1fae5'; c.style.borderColor = '#22c55e'; c.textContent = '✅ ' + c.textContent; setTimeout(function(){ c.remove(); }, 700); }, i * 300);
  });
  GS.proc = (GS.proc || 0) + chips.length;
  var el = document.getElementById('mg-pr'); if (el) el.textContent = GS.proc;
  showToast('⚡ Processed ' + chips.length + ' messages!');
  if (GS.proc >= GS.t) unlockNext();
}

// ROBOT GAME
var ROBOTS = [{e:'👨‍🍳',r:'Chef'},{e:'📬',r:'Mailer'},{e:'🛡️',r:'Guard'},{e:'💾',r:'Storage'},{e:'🔍',r:'Search'},{e:'📊',r:'Stats'}];
function buildRobot(w) {
  var tiles = ROBOTS.map(function(r, i){
    return '<div class="rtl" id="rt' + i + '" onclick="togRobot(' + i + ')">' +
      '<span class="rem">' + r.e + '</span><div class="rrl">' + r.r + '</div>' +
      '<div class="rst" id="rs' + i + '" style="color:#6b7280">OFFLINE</div></div>';
  }).join('');
  return '<div class="gcard"><div class="gtit">🤖 Build Robot Town!</div>' +
    '<div class="gsb">Tap robots to activate! Get at least 4 online!</div>' +
    '<div class="scrow"><div class="scbx"><div class="scn" id="rg-on" style="color:#22c55e">0</div><div class="scl">Online 🟢</div></div>' +
    '<div class="scbx"><div class="scn" id="rg-hp" style="color:' + w.col + '">0%</div><div class="scl">Health 💪</div></div></div>' +
    '<div class="rgrd">' + tiles + '</div>' +
    '<div style="text-align:center;font-size:12px;font-weight:800;color:#6b7280" id="rg-msg">Tap robots to activate! 🤖</div></div>' +
    '<button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>';
}
function initRobot() { GS = {on:0, t:4, done:false}; }
function togRobot(i) {
  var tile = document.getElementById('rt' + i), st = document.getElementById('rs' + i);
  if (!tile || !st) return;
  if (tile.classList.contains('on')) {
    tile.classList.remove('on'); tile.classList.add('brk');
    st.textContent = '🔴 DOWN'; st.style.color = '#ef4444'; GS.on = Math.max(0, GS.on - 1);
  } else if (tile.classList.contains('brk')) {
    tile.classList.remove('brk'); st.textContent = 'OFFLINE'; st.style.color = '#6b7280';
  } else {
    tile.classList.add('on'); st.textContent = '🟢 ONLINE'; st.style.color = '#22c55e'; GS.on++;
  }
  var on = document.getElementById('rg-on'); if(on) on.textContent = GS.on;
  var hp = document.getElementById('rg-hp'); if(hp) hp.textContent = Math.round((GS.on/6)*100) + '%';
  if (GS.on >= GS.t && !GS.done) {
    GS.done = true;
    var msg = document.getElementById('rg-msg'); if(msg){ msg.textContent = '🤖 Robot Town is running!'; msg.style.color = '#22c55e'; }
    unlockNext(); showToast('🤖 Robot Town is alive!');
  }
}

// ─── QUIZ ────────────────────────────────────────────────
function buildQuiz(l, qi) {
  var q = l.quiz[qi], total = l.quiz.length;
  var letters = ['A','B','C','D'];
  var opts = q.opts.map(function(o, i){
    return '<div class="qopt" id="qo' + i + '" onclick="pickAns(' + i + ',' + q.ans + ',' + qi + ')">' +
      '<div class="qltr">' + letters[i] + '</div>' + o + '</div>';
  }).join('');
  return '<div class="qcard"><div class="qqn">Question ' + (qi+1) + ' of ' + total + '</div>' +
    '<div class="qq">' + q.q + '</div>' +
    '<div class="qopts">' + opts + '</div>' +
    '<div class="qfb" id="qfb"></div></div>' +
    '<button class="bbtn pur" id="qnext" onclick="nextQ(' + qi + ',' + total + ')" style="display:none">' +
    (qi < total-1 ? 'Next Question →' : '🎉 Finish Lesson!') + '</button>';
}
function pickAns(chosen, correct, qi) {
  var opt = document.getElementById('qo' + chosen);
  if (opt && opt.classList.contains('off')) return;
  var expl = S.curLesson.quiz[qi].expl;
  document.querySelectorAll('.qopt').forEach(function(o, i){
    o.classList.add('off');
    if (i === correct) o.classList.add('right');
    else if (i === chosen && chosen !== correct) o.classList.add('wrong');
  });
  var fb = document.getElementById('qfb');
  if (chosen === correct) { fb.className = 'qfb right'; fb.textContent = '🎉 ' + expl; S.qScore++; addXP(10); }
  else { fb.className = 'qfb wrong'; fb.textContent = '💡 ' + expl; }
  var nxt = document.getElementById('qnext'); if(nxt) nxt.style.display = 'flex';
}
function nextQ(cur, total) {
  if (cur < total - 1) { document.getElementById('lesson-body').innerHTML = buildQuiz(S.curLesson, cur + 1); }
  else completeLesson();
}
function completeLesson() {
  var l = S.curLesson;
  if (S.done.indexOf(l.id) === -1) { S.done.push(l.id); addXP(50); checkBadges(); save(); }
  var stars = S.qScore >= 3 ? '⭐⭐⭐' : S.qScore >= 2 ? '⭐⭐' : '⭐';
  document.getElementById('lesson-body').innerHTML =
    '<div class="comp"><div class="cstars">' + stars + '</div>' +
    '<div class="ctit">Amazing! 🎉</div>' +
    '<div class="csub">You finished "' + l.title + '"!</div>' +
    '<div class="cxp">+50 XP ⭐</div>' +
    '<button class="bbtn grn" onclick="openWorld(S.curWorld)">Back to Lessons 🏡</button>' +
    '<button class="bbtn gho" onclick="nav(\'map\')" style="margin-top:8px">🗺️ Galaxy Map</button></div>';
  document.getElementById('step-track').innerHTML = ['','','',''].map(function(){ return '<div class="spip dn"></div>'; }).join('');
  confetti(); save();
}

// ─── BADGES ─────────────────────────────────────────────
function checkBadges() {
  W.forEach(function(w){
    var allDone = w.lessons.every(function(l){ return S.done.indexOf(l.id) > -1; });
    if (allDone && S.bdgs.indexOf(w.badge) === -1) {
      S.bdgs.push(w.badge); showToast('🏅 Badge: ' + w.bname + '!'); addXP(200);
    }
  });
}

// ─── WINS & PROFILE ─────────────────────────────────────
function renderWins() {
  document.getElementById('ws-lessons').textContent = S.done.length;
  document.getElementById('ws-stars').textContent = S.done.length * 2;
  document.getElementById('ws-streak').textContent = S.streak;
  document.getElementById('ws-worlds').textContent = W.filter(function(w){ return w.lessons.every(function(l){ return S.done.indexOf(l.id) > -1; }); }).length;
  var bg = document.getElementById('badges-grid'); bg.innerHTML = '';
  W.forEach(function(w){
    var e = S.bdgs.indexOf(w.badge) > -1;
    var d = document.createElement('div'); d.className = 'btl ' + (e ? 'earn' : 'lock');
    d.innerHTML = '<span class="bic">' + w.badge + '</span><div class="bnm">' + w.bname + '</div>';
    bg.appendChild(d);
  });
}
function renderProfile() {
  var l = getLevel(S.xp);
  document.getElementById('prof-lvl').textContent = l.n + ' · ' + S.xp + ' XP';
  var avs = ['🚀','🤖','🦸','🧙','👨‍🚀','🦊','🐉','⭐'];
  document.getElementById('prof-av').textContent = avs[Math.floor(S.xp / 200) % 8];
  var cards = [{i:'⭐',t:'Total XP',s:'Experience',v:S.xp},{i:'🔥',t:'Day Streak',s:'Days in a row',v:S.streak},{i:'📚',t:'Lessons Done',s:'Out of ' + W.reduce(function(a,w){ return a + w.lessons.length; }, 0),v:S.done.length},{i:'🏅',t:'Badges',s:'Out of ' + W.length,v:S.bdgs.length}];
  var container = document.getElementById('prof-cards'); container.innerHTML = '';
  cards.forEach(function(c){
    var d = document.createElement('div'); d.className = 'pcrd';
    d.innerHTML = '<div class="pcl"><div class="pci">' + c.i + '</div><div><div class="pct">' + c.t + '</div><div class="pcs">' + c.s + '</div></div></div><div class="pcv">' + c.v + '</div>';
    container.appendChild(d);
  });
}

// ─── DAILY CHALLENGE ────────────────────────────────────
var DQ = [
  {q:'Internet magic phone book?',opts:['GPS','DNS!','HTTPS','CDN'],ans:1,expl:'DNS turns website names into IP numbers!'},
  {q:'Load balancer is like a...?',opts:['Slow server','Crossing guard!','Password','Database'],ans:1,expl:'Crossing guard sends visitors to different servers!'},
  {q:'Caching = snacks on your...?',opts:['Supermarket','Database','Counter!','Moon'],ans:2,expl:'Counter is closest and fastest — just like cache!'},
  {q:'TCP is like...?',opts:['Shouting','Certified mail!','A rocket','A snail'],ans:1,expl:'Certified mail — every packet guaranteed!'},
  {q:'WebSockets are like...?',opts:['Regular mail','Timer','Walkie-talkies!','Filing cabinet'],ans:2,expl:'Always connected — both sides talk anytime!'},
  {q:'Database INDEX is like...?',opts:['A key','Book index — find things fast!','A password','A cache'],ans:1,expl:'Book index points you to the right page instantly!'},
  {q:'Microservices = ?',opts:['One giant robot','Team of specialist robots!','A database','A cache'],ans:1,expl:'Each robot does one thing. One breaks, others keep going!'},
  {q:'Back pressure means...?',opts:['Very fast','Pushing buttons','System overloaded, slow down!','A cache'],ans:2,expl:'Slow down signal — prevents overflow and crashes!'}
];
function openDaily() {
  var q = DQ[new Date().getDate() % DQ.length];
  var letters = ['A','B','C','D'];
  var opts = q.opts.map(function(o, i){
    return '<div class="qopt" id="do' + i + '" onclick="ansDaily(' + i + ',' + q.ans + ',\'' + q.expl.replace(/'/g,"\\'") + '\')" style="margin-bottom:9px">' +
      '<div class="qltr">' + letters[i] + '</div>' + o + '</div>';
  }).join('');
  document.getElementById('daily-body').innerHTML =
    '<div style="text-align:center;font-size:44px;margin-bottom:11px">🧩</div>' +
    '<div style="font-size:17px;font-weight:900;color:#f97316;margin-bottom:5px">Today\'s Challenge!</div>' +
    '<div style="font-size:19px;font-weight:900;line-height:1.3;margin-bottom:16px;color:#1a1a2e">' + q.q + '</div>' +
    opts +
    '<div id="dfb" style="display:none;border-radius:12px;padding:10px;margin-top:9px;font-weight:800;font-size:13px;border:2px solid"></div>' +
    '<button onclick="document.getElementById(\'daily-modal\').classList.remove(\'open\')" style="width:100%;margin-top:13px;padding:11px;border:none;border-radius:14px;background:#f3f4f6;font-size:15px;font-weight:800;cursor:pointer">Close</button>';
  document.getElementById('daily-modal').classList.add('open');
}
function ansDaily(chosen, correct, expl) {
  document.querySelectorAll('[id^="do"]').forEach(function(o, i){
    o.style.pointerEvents = 'none';
    if (i === correct) o.classList.add('right');
    else if (i === chosen && chosen !== correct) o.classList.add('wrong');
  });
  var fb = document.getElementById('dfb');
  if (chosen === correct) {
    fb.style.cssText = 'display:block;background:#f0fdf4;border-color:#86efac;color:#166534;border:2px solid #86efac;border-radius:12px;padding:10px;font-weight:800;font-size:13px';
    fb.textContent = '🎉 Correct! +100 XP!'; addXP(100); confetti();
  } else {
    fb.style.cssText = 'display:block;background:#fff1f2;border-color:#fca5a5;color:#991b1b;border:2px solid #fca5a5;border-radius:12px;padding:10px;font-weight:800;font-size:13px';
    fb.textContent = '💡 ' + expl;
  }
}
document.getElementById('daily-modal').addEventListener('click', function(e){ if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

// ─── FX ─────────────────────────────────────────────────
function confetti() {
  var el = document.getElementById('confetti');
  var cols = ['#ff6b6b','#4ecdc4','#ffd93d','#6bcb77','#ff9f43','#a29bfe','#74b9ff','#fd79a8'];
  for (var i = 0; i < 42; i++) {
    (function(){
      var p = document.createElement('div'); p.className = 'cf';
      p.style.cssText = 'left:' + (Math.random()*100) + '%;background:' + cols[Math.floor(Math.random()*cols.length)] + ';width:' + (6+Math.random()*9) + 'px;height:' + (6+Math.random()*9) + 'px;border-radius:' + (Math.random()>.5?'50%':'3px') + ';animation-delay:' + Math.random() + 's;animation-duration:' + (2+Math.random()*2) + 's';
      el.appendChild(p); setTimeout(function(){ p.remove(); }, 4000);
    })();
  }
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// ─── BOOT ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function(){ renderMap(); });
</script>
