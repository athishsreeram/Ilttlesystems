diag:{title:‘DNS Magic!’,nodes:[{icon:‘👦’,text:‘You type: google.com’,tip:‘A friendly name humans can remember. Computers prefer numbers!’},{icon:‘📖’,text:‘DNS looks it up!’,tip:‘Like a phone book! Finds the IP for the name. Takes under 1ms!’},{icon:‘✅’,text:‘Gets: 142.250.80.46’,tip:‘Now the browser knows the IP and connects to Google's servers!’}]},
quiz:[{q:‘What does DNS do?’,opts:[‘Makes websites pretty’,‘Turns names into IP numbers!’,‘Stores pictures’,‘Plays music’],ans:1,expl:‘DNS translates website names into IP numbers — the internet's phone book!’},{q:‘DNS stands for…?’,opts:[‘Daily Nap System’,‘Domain Name System!’,‘Dinosaur Name Server’,‘Data Number Store’],ans:1,expl:‘Domain Name System! The giant phone book everyone on the internet uses!’},{q:‘Without DNS you'd need to type…?’,opts:[‘google.com’,‘A password’,‘142.250.80.46!’,‘Nothing’],ans:2,expl:‘Without DNS you'd need to memorize long numbers! DNS lets us use friendly names!’}]},
{id:‘2.3’,emoji:‘✉️’,title:‘Certified Mail vs Shouting’,sub:‘TCP vs UDP’,game:‘taco’,story:{scene:‘📡’,parts:[‘✉️’,‘📡’,‘✅’,‘❌’],mascot:‘Postie the Penguin 🐧’,text:{toddler:‘TCP is like certified mail — every letter arrives and Postie gets a signature! ✅ Takes a bit longer but ALWAYS works! UDP is like shouting across the playground 📣 — SUPER FAST but maybe nobody hears! Games use UDP (speed!), file downloads use TCP (safe!).’,kids:‘TCP = reliable. Every packet checked, resent if lost, arrives in order. Used for websites, email, file downloads. UDP = fast but no guarantee. Lost packets? Move on! Used for games, video calls, live streams where speed beats perfection.’},fact:‘🎮 Video games use UDP! A few lost packets in a game = fine. Missing bytes in a downloaded file = corrupted file!’},
diag:{title:‘TCP vs UDP!’,nodes:[{icon:‘✉️’,text:‘TCP — Certified Mail’,tip:‘Guaranteed delivery! Every byte in order. Slower but perfect. For websites, files!’},{icon:‘📣’,text:‘UDP — Shouting Fast!’,tip:‘Super fast but no guarantee! Used for games, video calls, live streaming!’}]},
quiz:[{q:‘Video games usually use…?’,opts:[‘TCP (slow but safe)’,‘UDP (fast!)’,‘Neither’,‘Both equally’],ans:1,expl:‘Games use UDP for speed! A tiny lost packet is fine — you want low latency!’},{q:‘Downloading a file should use…?’,opts:[‘UDP (might lose bits!)’,‘TCP (every byte counts!)’,‘Neither’,‘Shouting’],ans:1,expl:‘Files need TCP! Every single byte must arrive or the file is corrupted!’},{q:‘TCP is like…?’,opts:[‘Shouting across a field’,‘📣 A loudspeaker’,‘✉️ Certified mail!’,‘A whisper’],ans:2,expl:‘Certified mail! Confirmation that every packet arrived safely!’}]},
{id:‘2.4’,emoji:‘🕵️’,title:‘The Helper in the Middle’,sub:‘Proxy Servers’,game:‘taco’,story:{scene:‘🤝’,parts:[‘🕵️’,‘🔄’,‘🛡️’,‘🌐’],mascot:‘Postie the Penguin 🐧’,text:{toddler:‘Imagine asking your friend to order pizza FOR you! The pizza shop only knows your friend's address — not yours! A PROXY is a helper computer that goes to websites FOR you! Website only sees the proxy, not you! 🛡️’,kids:‘Forward proxy sits in front of you. Requests go: you → proxy → internet. Website sees proxy's IP, not yours! Companies block sites via proxies. VPNs work like this — hides your identity and location!’},fact:‘🌍 VPNs are proxies! When using a VPN, websites think you're in a completely different country!’},
diag:{title:‘Proxy Helper!’,nodes:[{icon:‘👦’,text:‘You — want privacy!’,tip:‘You want to visit a website but stay anonymous!’},{icon:‘🕵️’,text:‘Proxy — goes for you!’,tip:‘Visits website FOR you. Site only knows the proxy's address!’},{icon:‘🌐’,text:‘Website — sees proxy only!’,tip:‘Site answers the proxy, which brings the content back to you!’}]},
quiz:[{q:‘What does a PROXY do?’,opts:[‘Makes websites’,‘Goes to internet on your behalf!’,‘Stores passwords’,‘Sends emails’],ans:1,expl:‘Proxy is your helper! Visits websites FOR you, keeping your identity private!’},{q:‘VPNs are a type of…?’,opts:[‘Database’,‘Game’,‘Proxy!’,‘Taco’],ans:2,expl:‘VPNs route your traffic through another server — just like a proxy!’},{q:‘Why use a proxy?’,opts:[‘For privacy!’,‘To make internet slower’,‘To use more data’,‘No reason’],ans:0,expl:‘Privacy! The website sees the proxy, not YOU!’}]},
{id:‘2.5’,emoji:‘🏢’,title:‘The Building Front Desk’,sub:‘Reverse Proxy’,game:‘taco’,story:{scene:‘🏢’,parts:[‘🏢’,‘👔’,‘📋’,‘🔀’],mascot:‘Postie the Penguin 🐧’,text:{toddler:‘A big office has MANY workers! The FRONT DESK asks “Who are you here to see?” and sends you to the right department! A REVERSE PROXY is the internet's front desk — it stands in front of many servers and routes each visitor to the right one!’,kids:‘Reverse proxy sits in front of your SERVERS. All visitors talk to the proxy, which routes to the right server. Benefits: hides real servers, adds security, load balancing, caching. Nginx and Cloudflare work this way!’},fact:‘☁️ When you visit Netflix, you're talking to a reverse proxy first. It protects their thousands of actual servers!’},
diag:{title:‘Reverse Proxy!’,nodes:[{icon:‘👥’,text:‘Millions of Visitors’,tip:‘All users want to visit the same website at once!’},{icon:‘🏢’,text:‘Reverse Proxy (Front Desk)’,tip:‘Routes each visitor to the right server. Hides and protects real servers!’},{icon:‘🖥️’,text:‘Servers 1, 2, 3…’,tip:‘The actual servers safely hidden behind the proxy!’}]},
quiz:[{q:‘Reverse proxy sits in front of…?’,opts:[‘Users’,‘Your servers!’,‘The internet’,‘Your phone’],ans:1,expl:‘Reverse proxy protects your servers! Sits between the internet and your actual servers!’},{q:‘A great use of reverse proxy?’,opts:[‘Playing games’,‘Hiding and protecting servers!’,‘Storing files’,‘Sending emails’],ans:1,expl:‘Reverse proxies protect servers — users never directly access your actual servers!’},{q:‘Forward proxy protects the ___, reverse proxy protects the ___?’,opts:[‘Server / Client’,‘Client / Server!’,‘Both same’,‘Neither’],ans:1,expl:‘Forward = protects the CLIENT. Reverse = protects the SERVERS!’}]}
]},
{id:3,emoji:‘🐝’,name:‘Busy Bee Boulevard’,sub:‘Load Balancing & Scaling’,cls:‘wc3’,col:’#ffd93d’,lcol:’#fffce8’,bdcol:’#c9a800’,badge:‘🐝’,bname:‘Load Master’,desc:‘When TONS of bees visit at once, Bella knows exactly how to handle it all!’,say:‘When too many bees try one flower, we need MORE flowers — or a crossing guard! 🚦’,
lessons:[
{id:‘3.1’,emoji:‘🚦’,title:‘The Crossing Guard’,sub:‘Load Balancing’,game:‘bee’,story:{scene:‘🚦’,parts:[‘🐝’,‘🌺’,‘⚖️’,‘🔀’],mascot:‘Bella the Bee 🐝’,text:{toddler:‘1000 bees want to use ONE flower! WAY TOO MANY! 😰 So Bella becomes the CROSSING GUARD 🚦 — she sends some bees to Flower 1, some to Flower 2, some to Flower 3! Nobody waits too long! That's LOAD BALANCING!’,kids:‘A load balancer sits in front of multiple servers, distributing requests evenly. Algorithms: Round Robin (1,2,3,1,2,3), Least Connections (send to least busy), IP Hash (same user → same server). If one server crashes, load balancer stops sending to it!’},fact:‘⚖️ Google handles 8.5 BILLION searches per day. Without load balancers, one computer would melt!’},
diag:{title:‘Spread the Load!’,nodes:[{icon:‘📥’,text:‘Requests flood in!’,tip:‘Millions of users clicking at once. One server would collapse!’},{icon:‘⚖️’,text:‘Load Balancer’,tip:‘The crossing guard! Spreads visitors evenly so no server gets overwhelmed!’},{icon:‘🖥️’,text:‘Servers 1, 2, 3’,tip:‘Each server gets some visitors. Everyone gets served quickly!’}]},
quiz:[{q:‘What does a load balancer do?’,opts:[‘Makes sites pretty’,‘Spreads requests across servers!’,‘Stores data’,‘Sends emails’],ans:1,expl:‘Spreads the work! Instead of one server collapsing, many servers share the load!’},{q:‘Load balancing is like a…?’,opts:[‘Sleeping guard’,‘Crossing guard sending people to different doors!’,‘A locked door’,‘An empty room’],ans:1,expl:‘Crossing guard sends each visitor to a different server — spread it out!’},{q:‘Server 2 crashes. Load balancer…?’,opts:[‘Crashes too’,‘Stops working’,‘Routes traffic to Server 1 and 3!’,‘Calls for help’],ans:2,expl:‘Smart! Load balancers detect failures and route around them automatically!’}]},
{id:‘3.2’,emoji:‘💪’,title:‘Stronger vs More Bees’,sub:‘Vertical vs Horizontal Scaling’,game:‘bee’,story:{scene:‘💪’,parts:[‘💪’,‘🐝’,‘⬆️’,‘➡️’],mascot:‘Bella the Bee 🐝’,text:{toddler:‘Bella can GROW into a SUPER BIG bee ⬆️ (Vertical Scaling — going UP!) OR she can call ALL HER FRIENDS ➡️ (Horizontal Scaling — more bees!). Getting more friends is usually BETTER because there's a limit to how big one bee can grow!’,kids:‘Vertical scaling (Scale Up) = give ONE server more power. More CPU, more RAM. Simple but has limits! Horizontal scaling (Scale Out) = add MORE servers. Can scale almost infinitely! Netflix, Instagram all use horizontal scaling for massive growth!’},fact:‘🏗️ Netflix runs on thousands of servers. Adding more servers is always the answer for massive growth!’},
diag:{title:‘Scale Up vs Scale Out!’,nodes:[{icon:‘⬆️’,text:‘Scale UP — Bigger Server’,tip:‘Make ONE computer more powerful. Has a physical limit though!’},{icon:‘➡️’,text:‘Scale OUT — More Servers’,tip:‘Add MORE computers! Can keep adding almost forever!’}]},
quiz:[{q:‘Scale UP means…?’,opts:[‘Add more servers’,‘Make one server MORE powerful!’,‘Remove servers’,‘Do nothing’],ans:1,expl:‘Scale UP = one stronger server. More CPU, more RAM!’},{q:‘Scale OUT means…?’,opts:[‘Make one server bigger’,‘Add MORE servers!’,‘Turn servers off’,‘Make servers smaller’],ans:1,expl:‘Scale OUT = add more servers! Usually better for massive growth!’},{q:‘Which is better for HUGE growth?’,opts:[‘Scale UP (has limits!)’,‘Scale OUT (endless!)’,‘Neither’,‘Delete everything’],ans:1,expl:‘Scale OUT wins! You can always add more servers. One server has physical limits!’}]},
{id:‘3.3’,emoji:‘😴’,title:‘The Backup Bee’,sub:‘Failover’,game:‘bee’,story:{scene:‘😴’,parts:[‘😴’,‘🔄’,‘❤️’,‘✅’],mascot:‘Bella the Bee 🐝’,text:{toddler:‘Bella works SO hard she sometimes needs a rest! 😴 But flowers still need tending! So there's always a BACKUP BEE waiting. The MOMENT Bella rests, the backup wakes up INSTANTLY and keeps working! Nobody notices! That's FAILOVER — always have a backup ready!’,kids:‘Failover = automatically switching to a backup when the main system fails. Active-Passive: one main, one backup sleeping. Main fails → passive wakes up instantly! Active-Active: both working. One fails → other handles everything. Banks have multiple failover layers!’},fact:‘🏦 Banks have multiple failover systems. If one data center burns down, another takes over in seconds!’},
diag:{title:‘Failover Safety Net!’,nodes:[{icon:‘🐝’,text:‘Active Server (Working!)’,tip:‘The main server handling all requests. The star of the show!’},{icon:‘😴’,text:‘Passive Backup (Sleeping…)’,tip:‘Watching, ready to wake up instantly if the main server fails!’},{icon:‘⚡’,text:‘Failover happens!’,tip:‘Main server dies → backup wakes up in seconds → users never notice!’}]},
quiz:[{q:‘What is FAILOVER?’,opts:[‘A type of food’,‘Switching to backup when something fails!’,‘A dance move’,‘Making servers faster’],ans:1,expl:‘Failover = automatic backup activation! Main fails → backup takes over instantly!’},{q:‘Active-Passive means…?’,opts:[‘Both work all time’,‘One works, one sleeps as backup!’,‘Both sleep’,‘Both fail’],ans:1,expl:‘Active = working. Passive = sleeping backup. If active fails, passive WAKES UP!’},{q:‘Why is failover important?’,opts:[‘For fun’,‘So systems NEVER go down!’,‘To save electricity’,‘To save money’],ans:1,expl:‘No downtime = happy users! Systems stay up even when hardware fails!’}]},
{id:‘3.4’,emoji:‘🛑’,title:‘Only 10 Bees at Once!’,sub:‘Rate Limiting’,game:‘bee’,story:{scene:‘🌺’,parts:[‘🛑’,‘10️⃣’,‘⏱️’,‘🚫’],mascot:‘Bella the Bee 🐝’,text:{toddler:‘The flower garden is beautiful but fragile! 🌸 If 1000 bees all land at once, they'd squish everything! 😱 So there's a rule: only 10 bees per minute! More than that? Wait your turn! That's RATE LIMITING — protecting the system from being overwhelmed!’,kids:‘Rate limiting controls requests per time window. 100 requests/minute? Exceed that → “429 Too Many Requests” error. Protects from: accidental infinite loops, malicious bots, DDoS attacks. Twitter, GitHub, all APIs use rate limiting!’},fact:‘🔒 Twitter limits API calls to 300 per 15 minutes. Without limits, one bad actor could crash everything!’},
diag:{title:‘Rate Limiting!’,nodes:[{icon:‘🌊’,text:‘Flood of Requests!’,tip:‘Could be real users OR a hacker attack sending millions per second!’},{icon:‘🛑’,text:‘Rate Limiter’,tip:‘Only X requests allowed per second. Extras declined politely. System stays safe!’},{icon:‘✅’,text:‘Server stays healthy!’,tip:‘Controlled flow means the server is never overwhelmed. Fair access for all!’}]},
quiz:[{q:‘What is RATE LIMITING?’,opts:[‘Making things faster’,‘Controlling how many requests are allowed!’,‘A database type’,‘A password’],ans:1,expl:‘Rate limiting controls the flow! Only a set number of requests get through per time period!’},{q:’“429 Too Many Requests” means…?’,opts:[‘Server broke’,‘Sending too fast! Rate limited!’,‘Wrong password’,‘Bad internet’],ans:1,expl:‘429 = rate limited! You're sending requests too quickly. Slow down!’},{q:‘Why is rate limiting important?’,opts:[‘To be mean’,‘Protect servers from being overwhelmed!’,‘To confuse people’,‘No reason’],ans:1,expl:‘Protects servers! One bad actor can't crash everything for everyone else!’}]},
{id:‘3.5’,emoji:‘🗺️’,title:‘The Magic Locker Room’,sub:‘Consistent Hashing’,game:‘bee’,story:{scene:‘🗺️’,parts:[‘🗺️’,‘🔑’,‘🎯’,‘💡’],mascot:‘Bella the Bee 🐝’,text:{toddler:‘100 kids, 100 lockers! Each kid ALWAYS goes to THEIR locker — they never mix up! 🎯 Even if we ADD more lockers, each kid still knows exactly where to go! That's consistent hashing — a magic formula that always sends the same data to the same server!’,kids:‘Consistent hashing: imagine a circle (ring). Each server and data item gets a position on the ring. Data goes to the nearest server clockwise. Add a server? Only nearby data moves! Normal hashing = add one server → ALL data must move. Consistent hashing = add server → very little moves!’},fact:‘🌐 Discord uses consistent hashing to route 850 million messages per day across thousands of servers!’},
diag:{title:‘Consistent Hashing!’,nodes:[{icon:‘🔵’,text:‘Normal Hashing’,tip:‘Add one new server → ALL data must relocate. Extremely expensive!’},{icon:‘⭕’,text:‘Consistent Hashing Ring’,tip:‘Data and servers on a ring. Add server → only NEARBY data moves. Brilliant!’},{icon:‘✅’,text:‘Only tiny bit moves!’,tip:‘Much more efficient! Perfect for distributed systems!’}]},
quiz:[{q:‘What is consistent hashing?’,opts:[‘A cooking recipe’,‘Smart way to assign data to servers minimally!’,‘A password type’,‘A game’],ans:1,expl:‘Consistent hashing ensures data goes to the right server — barely moves when servers change!’},{q:‘Add a server with consistent hashing…?’,opts:[‘All data moves’,‘Only nearby data moves!’,‘Nothing changes’,‘System breaks’],ans:1,expl:‘Only the data closest to the new server on the ring moves. Everything else stays!’},{q:‘Normal hashing adds a server. What happens?’,opts:[‘Nothing changes’,‘Nearby data moves’,‘ALL data must move! Very expensive!’,‘Server explodes’],ans:2,expl:‘Normal hashing = ALL data must be rehashed. Consistent hashing is much smarter!’}]}
]},
{id:4,emoji:‘📚’,name:‘The Great Library’,sub:‘Databases’,cls:‘wc4’,col:’#6bcb77’,lcol:’#edfff0’,bdcol:’#3d9b4a’,badge:‘📚’,bname:‘Data Keeper’,desc:‘How do computers remember EVERYTHING? Libby the Owl knows all the secrets!’,say:‘Every piece of information needs the perfect home! I find it in milliseconds! 🔍’,
lessons:[
{id:‘4.1’,emoji:‘🗂️’,title:‘The Perfect Filing Cabinet’,sub:‘SQL Databases’,game:‘taco’,story:{scene:‘🗂️’,parts:[‘📁’,‘🗂️’,‘📋’,‘✅’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘Libby has the MOST organized filing cabinet! Every drawer labeled. Every folder named. Every paper in exactly the RIGHT spot! Ask “Find all red books from 2020” — she finds them instantly! That's what SQL databases do — perfectly organized data you can search any way!’,kids:‘SQL databases store data in tables like spreadsheets! Rows and columns. JOIN tables. Query with SQL: “SELECT * FROM users WHERE age > 18” finds all adult users. ACID transactions keep data safe. Examples: MySQL, PostgreSQL, SQLite!’},fact:‘🗂️ SQL was invented in 1974 and is STILL one of the most-used technologies 50 years later!’},
diag:{title:‘SQL = Organized!’,nodes:[{icon:‘📊’,text:‘Tables (like spreadsheets!)’,tip:‘Data in rows and columns. Name, Age, Email — each in its own neat column!’},{icon:‘🔗’,text:‘Tables link together!’,tip:‘Users table connects to Orders connects to Products! All related data linked!’},{icon:‘🔍’,text:‘SQL finds anything!’,tip:‘Tell the database exactly what you want. Gets it in milliseconds!’}]},
quiz:[{q:‘SQL databases store data in…?’,opts:[‘Random places’,‘Tables (rows and columns)!’,‘Sticky notes’,‘Boxes’],ans:1,expl:‘SQL = organized tables! Data in rows and columns like a spreadsheet!’},{q:‘SQL is great for…?’,opts:[‘Random flexible data’,‘Organized data with relationships!’,‘Huge unstructured data’,‘Storing videos’],ans:1,expl:‘SQL shines for structured relational data — users, orders, products!’},{q:’“SELECT * FROM users” means…?’,opts:[‘Delete all users’,‘Update users’,‘Get ALL users from the table!’,‘Count users’],ans:2,expl:‘SELECT * = get everything! FROM users = from the users table. Classic SQL!’}]},
{id:‘4.2’,emoji:‘🗒️’,title:‘Sticky Notes Everywhere!’,sub:‘NoSQL Databases’,game:‘taco’,story:{scene:‘🗒️’,parts:[‘🗒️’,‘🔄’,‘⚡’,‘🎨’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘Libby's friend NOODLE uses STICKY NOTES on a giant wall! Each note can look COMPLETELY different — one has a name, another has 100 things, another has a picture! Super flexible and SUPER fast! That's NoSQL!’,kids:‘NoSQL = Not Only SQL. 4 types: Key-Value (dictionary — Redis), Document (JSON objects — MongoDB), Wide Column (huge flexible tables — Cassandra), Graph (connections — Neo4j). Great for massive, fast-changing, flexible data!’},fact:‘💾 MongoDB, Cassandra, Redis — NoSQL databases power some of the biggest apps you use daily!’},
diag:{title:‘4 Types of NoSQL!’,nodes:[{icon:‘🔑’,text:‘Key-Value: “key” → data’,tip:‘Like a dictionary! User123 → {data}. Super fast lookups. Redis uses this!’},{icon:‘📄’,text:‘Document: JSON objects’,tip:‘Flexible documents. MongoDB — each item can have different fields!’},{icon:‘📊’,text:‘Wide Column: huge tables’,tip:‘Cassandra handles billions of rows. Instagram uses it!’},{icon:‘🕸️’,text:‘Graph: connected things’,tip:‘Shows relationships between things. Social networks — who follows who?’}]},
quiz:[{q:‘NoSQL is great for…?’,opts:[‘Only organized data’,‘Flexible, fast, huge datasets!’,‘Tiny data only’,‘Never use it’],ans:1,expl:‘NoSQL shines for huge, fast-changing, flexible data!’},{q:‘Which NoSQL uses “key → value”?’,opts:[‘Graph’,‘Document’,‘Key-Value!’,‘Wide Column’],ans:2,expl:‘Key-Value stores are dictionaries! Give a key, instantly get the value. Redis!’},{q:‘Social networks use ___ to show who follows who?’,opts:[‘SQL tables’,‘Key-Value’,‘Graph!’,‘Wide Column’],ans:2,expl:‘Graph databases show CONNECTIONS between things — perfect for social networks!’}]},
{id:‘4.3’,emoji:‘🤔’,title:‘Cabinet or Wall?’,sub:‘SQL vs NoSQL’,game:‘taco’,story:{scene:‘⚖️’,parts:[‘🗂️’,‘🗒️’,‘⚖️’,‘🤔’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘SQL (the cabinet) is PERFECT for perfect organization — like a bank tracking every penny! 💰 NoSQL (the sticky-note wall) is PERFECT when things change a lot — like social media posts! 🎨 Choosing the right one = choosing the right tool!’,kids:‘Use SQL when: clear structure, need complex queries/JOINs, need ACID transactions (banking!). Use NoSQL when: massive scale, data structure varies, need super fast simple lookups. Many big apps use BOTH! (Polyglot persistence — right tool for each job!)’},fact:‘🏦 Banks use SQL (money needs ACID!). Instagram uses both — SQL for accounts, Cassandra for posts!’},
diag:{title:‘Choose Wisely!’,nodes:[{icon:‘🏦’,text:‘Bank → SQL!’,tip:‘Money needs perfect accuracy. ACID transactions ensure every penny is correct!’},{icon:‘📸’,text:‘Instagram posts → NoSQL!’,tip:‘Billions of flexible posts. NoSQL handles scale and flexibility!’},{icon:‘🛒’,text:‘Amazon → BOTH!’,tip:‘Product catalog in NoSQL, orders in SQL. Right tool for each job!’}]},
quiz:[{q:‘A banking app should use…?’,opts:[‘NoSQL only’,‘SQL! (ACID transactions!)’,‘Neither’,‘Sticky notes’],ans:1,expl:‘Banks need SQL! ACID guarantees every transaction is perfect!’},{q:‘Billions of social media posts — use…?’,opts:[‘SQL only’,‘NoSQL! (flexible and huge!)’,‘Paper’,‘Nothing’],ans:1,expl:‘NoSQL for huge flexible data! Posts are all different and there are billions!’},{q:‘Can you use BOTH SQL and NoSQL in one app?’,opts:[‘Never!’,‘Only if confused’,‘Yes! Most big apps do!’,‘Pick one forever’],ans:2,expl:‘Yes! SQL for some data, NoSQL for others. Best tool for each job!’}]},
{id:‘4.4’,emoji:‘📷’,title:‘Making Backup Copies!’,sub:‘Replication’,game:‘taco’,story:{scene:‘📷’,parts:[‘📷’,‘📄’,‘🔄’,‘🛡️’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘Libby has ONE super important book — the Book of All Knowledge! She's scared it might get lost! 😨 So she makes BACKUP COPIES and keeps them in different buildings! If one building burns down, the copies are safe! That's REPLICATION!’,kids:‘Replication = copies of your database on multiple servers. Primary handles writes. Replicas copy everything and handle reads. Benefits: no data loss if primary dies, reads faster (use nearest replica), always available. Netflix stores your history on dozens of servers worldwide!’},fact:‘🛡️ Netflix stores data in multiple data centers. If one disappears, your watch history is safe!’},
diag:{title:‘Always Have Copies!’,nodes:[{icon:‘👑’,text:‘Primary (Master)’,tip:‘The main database! All new writes go here first. Source of truth!’},{icon:‘📄’,text:‘Replicas 1, 2, 3…’,tip:‘Copies of the primary! Stay updated automatically. Handle read requests!’},{icon:‘⚡’,text:‘Primary fails → Replica promoted!’,tip:‘If primary fails, a replica becomes the new primary. Zero data loss!’}]},
quiz:[{q:‘What is REPLICATION?’,opts:[‘Deleting old data’,‘Keeping copies on multiple servers!’,‘Searching the database’,‘Making tables’],ans:1,expl:‘Replication = copies! Multiple servers store the same data for safety and speed!’},{q:‘WRITES go to…?’,opts:[‘Any replica’,‘The primary!’,‘All of them simultaneously’,‘None’],ans:1,expl:‘Writes go to primary first! Then primary copies changes to all replicas!’},{q:‘Primary crashes. What happens?’,opts:[‘All data lost!’,‘A replica gets promoted to primary!’,‘Nothing happens’,‘Start over’],ans:1,expl:‘A replica gets promoted! Data stays safe, system keeps running!’}]},
{id:‘4.5’,emoji:‘🏛️’,title:‘Split the Library!’,sub:‘Sharding’,game:‘taco’,story:{scene:‘🏛️’,parts:[‘🏛️’,‘✂️’,‘🅰️’,‘🅱️’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘Libby's library has SO many books it takes forever to find anything! 😫 So she SPLITS into two buildings: A has books A–M, B has books N–Z! Now each building is smaller and FASTER! That's SHARDING — splitting one giant database into smaller, faster pieces!’,kids:‘Sharding = horizontal partitioning. Split data across multiple databases. Users 1–1M in Shard 1, 1M–2M in Shard 2, etc. Each shard is a separate database! Pros: infinite storage, faster queries. Cons: complex joins across shards. Facebook shards MySQL across thousands!’},fact:‘📊 Facebook's MySQL is sharded into THOUSANDS of pieces. Without sharding, one DB couldn't hold all of Facebook!’},
diag:{title:‘Sharding!’,nodes:[{icon:‘😫’,text:‘One HUGE database’,tip:‘Too big! Slow queries, hard to manage, can't grow further!’},{icon:‘✂️’,text:‘Shard it!’,tip:‘Split into smaller pieces by user ID, geography, alphabet — many ways!’},{icon:‘⚡’,text:‘Many fast shards!’,tip:‘Each shard is smaller and faster. Queries go directly to the right shard!’}]},
quiz:[{q:‘What is SHARDING?’,opts:[‘Making backups’,‘Splitting one database into multiple smaller ones!’,‘Combining databases’,‘Deleting data’],ans:1,expl:‘Sharding splits one huge database into smaller shards! Each handles part of the data!’},{q:‘Users 1–1M in Shard 1. Where is user 500,000?’,opts:[‘Shard 2’,‘Random shard’,‘Shard 1!’,‘Not stored’],ans:2,expl:‘500,000 is between 1 and 1M — Shard 1! Sharding rules determine where each piece lives!’},{q:‘Why is sharding needed?’,opts:[‘For fun’,‘One database has limits! Sharding enables infinite scaling!’,‘To delete data’,‘For security’],ans:1,expl:‘Sharding = infinite growth! One server has limits, but thousands of shards have almost none!’}]},
{id:‘4.6’,emoji:‘🔖’,title:‘The Book Index!’,sub:‘Database Indexing’,game:‘taco’,story:{scene:‘🔖’,parts:[‘🔖’,‘📖’,‘🔍’,‘⚡’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘Finding “elephant” without an index = READ EVERY PAGE! 😭 Finding “elephant” WITH an index = go straight to page 47! ⚡ Database indexes work the same way — instead of checking EVERY row, the index points straight to the answer!’,kids:‘Without index: full table scan (read every row). With index: jump directly to matching rows. B-tree indexes are most common. Trade-off: indexes make reads faster BUT writes slightly slower (must update index too) and use more storage.’},fact:‘⚡ The right index can make a query go from 30 seconds to 0.001 seconds — a 30,000x speedup!’},
diag:{title:‘Indexes = Speed!’,nodes:[{icon:‘🐌’,text:‘No Index: Check every row!’,tip:‘Without index, reads EVERY SINGLE ROW. Like checking every page of a book!’},{icon:‘🔖’,text:‘WITH Index: Jump directly!’,tip:‘Index points straight to matching rows. Like a book's index finding the right page!’},{icon:‘⚡’,text:‘1000x Faster!’,tip:‘The right index makes queries thousands of times faster. Essential for big tables!’}]},
quiz:[{q:‘A database index makes…?’,opts:[‘Writes faster’,‘Reads MUCH faster!’,‘Deletes easier’,‘Database bigger (only)’],ans:1,expl:‘Indexes speed up reads enormously! Like a book index pointing to the right page!’},{q:‘Trade-off of adding an index?’,opts:[‘No trade-offs!’,‘Reads faster, writes slightly slower!’,‘Everything slows’,‘Uses no space’],ans:1,expl:‘Indexes cost a tiny bit in write speed and storage — but read gains are massive!’},{q:‘Without an index in a billion rows, worst case…?’,opts:[‘Instant!’,‘Check maybe ALL billion rows!’,‘Check 10 rows’,‘Not possible’],ans:1,expl:‘Full table scan = potentially check EVERY row! That's why indexes are critical!’}]},
{id:‘4.7’,emoji:‘✅’,title:‘All or Nothing!’,sub:‘ACID Transactions’,game:‘taco’,story:{scene:‘💰’,parts:[‘💰’,‘✅’,‘❌’,‘🔄’],mascot:‘Libby the Owl 🦉’,text:{toddler:‘You're trading stickers with your friend! You give a dinosaur sticker. They give a rainbow sticker. What if you give yours but the game CRASHES before they give theirs? 😱 ACID means either BOTH trades happen OR NEITHER does! Your sticker never disappears!’,kids:‘ACID = 4 guarantees: Atomicity (all or nothing), Consistency (data always follows rules), Isolation (transactions don't interfere), Durability (once committed, saved forever even if server crashes). Banks NEED ACID!’},fact:‘🏦 ACID was invented in 1983 specifically for banking. No more money disappearing due to crashes!’},
diag:{title:‘ACID = Safe!’,nodes:[{icon:‘⚛️’,text:‘Atomic: All or Nothing!’,tip:‘Either ALL steps complete, or if ANY fail, ALL roll back. No half-done transactions!’},{icon:‘✅’,text:‘Consistent: Rules always apply!’,tip:‘Data always follows rules. Can't have negative balance. Can't have duplicate emails!’},{icon:‘🔒’,text:‘Isolated: No interference!’,tip:‘Two people buying the last item? Only one succeeds!’},{icon:‘💾’,text:‘Durable: Saved forever!’,tip:‘Once committed, data survives even if server crashes 1ms later!’}]},
quiz:[{q:‘ATOMIC means…?’,opts:[‘About atoms’,‘All or nothing — all succeed or all roll back!’,‘Very fast’,‘Stored forever’],ans:1,expl:‘Atomic = all or nothing! Every step must succeed, or nothing happens at all!’},{q:‘ACID most important for…?’,opts:[‘Social media posts’,‘Banking and financial transactions!’,‘Profile pictures’,‘Game scores’],ans:1,expl:‘Banks NEED ACID! Money can't disappear or appear due to a computer crash!’},{q:‘DURABLE means…?’,opts:[‘Fast queries’,‘Saved permanently even after crashes!’,‘Flexible structure’,‘Fast writes’],ans:1,expl:‘Durable = permanent! Once committed, data survives server crashes, power cuts, anything!’}]}
]},
{id:5,emoji:‘⚡’,name:‘Speedy Squirrel's Kitchen’,sub:‘Caching’,cls:‘wc5’,col:’#ff9f43’,lcol:’#fff4e8’,bdcol:’#cc6f00’,badge:‘⚡’,bname:‘Cache Champion’,desc:‘Why fetch from far away every time? Speedy keeps the best stuff close by!’,say:‘Going to the database every time is SLOW! Keep popular stuff on the counter — instant access! 🍪’,
lessons:[
{id:‘5.1’,emoji:‘🍪’,title:‘Snacks on the Counter!’,sub:‘What is Caching?’,game:‘cache’,story:{scene:‘🍪’,parts:[‘🍪’,‘⚡’,‘🏪’,‘⏱️’],mascot:‘Speedy the Squirrel ⚡’,text:{toddler:‘Every time you want a cookie, do you go all the way to the SUPERMARKET? No! You keep cookies on your COUNTER! 🍪 Counter = FAST ⚡. Supermarket = SLOW 🐌. Caching = keeping things you use a lot in a FAST place!’,kids:‘Caching stores frequently-used data in fast storage. Database = slow (10–100ms). Cache (Redis) = lightning fast (microseconds!). 100x to 10,000x faster! Cache HIT = found in cache (fast!). Cache MISS = not in cache, must fetch from database.’},fact:‘⚡ Redis handles 1 MILLION operations per second. A database handles ~10,000. Cache is 100x faster!’},
diag:{title:‘Counter vs Supermarket!’,nodes:[{icon:‘🍪’,text:‘Counter (Cache) — Instant!’,tip:‘Just reach and grab. Super fast! Redis can do this in microseconds!’},{icon:‘🧊’,text:‘Fridge (Server Memory)’,tip:‘A bit slower than counter. Still fast. Like RAM in your computer!’},{icon:‘🏪’,text:‘Supermarket (Database) — Slow’,tip:‘Much slower but stores EVERYTHING. The original source of truth!’}]},
quiz:[{q:‘What is a CACHE?’,opts:[‘A type of money’,‘Fast storage for frequently-used data!’,‘A slow database’,‘A network’],ans:1,expl:‘Cache = FAST storage! Keep popular data there to avoid slow database trips!’},{q:‘Cache HIT means…?’,opts:[‘Cache crashed’,‘Found in cache — super fast!’,‘Not in cache’,‘Cache is full’],ans:1,expl:‘Cache hit = data found in cache! Fast response, no database needed!’},{q:‘Cache MISS means…?’,opts:[‘Cache is perfect’,‘NOT in cache — must check database!’,‘Cache is fast’,‘Cache exploded’],ans:1,expl:‘Cache miss = not found! Must go to the slower database. Sad squirrel! 🐿️’}]},
{id:‘5.2’,emoji:‘📍’,title:‘Counter, Fridge, or Store?’,sub:‘Cache Layers’,game:‘cache’,story:{scene:‘🏠’,parts:[‘📱’,‘💻’,‘🌐’,‘🏪’],mascot:‘Speedy the Squirrel ⚡’,text:{toddler:‘There are DIFFERENT levels of caching! Your PHONE stores some things (browser cache) 📱. A helper near you stores more (CDN) 🌐. The main server stores even more (server cache) 💻. The database is the big store with EVERYTHING 🏪.’,kids:‘Cache layers: Browser cache (your device — fastest!), CDN edge (near you geographically — very fast), Server/App cache (fast), Database. Each layer tries to serve before hitting the next. Great caching = serve from fastest possible layer!’},fact:‘🌍 Cloudflare has 310+ edge locations globally. Any user on Earth is within 20ms of a Cloudflare server!’},
diag:{title:‘Cache Layers!’,nodes:[{icon:‘📱’,text:‘Browser Cache (Your device!)’,tip:‘Fastest! Images, CSS on YOUR device. Repeat visits feel instant!’},{icon:‘🌐’,text:‘CDN Edge (Near you!)’,tip:‘Very fast! Content cached in a nearby city. No trip to far origin server!’},{icon:‘💾’,text:‘Server/App Cache’,tip:‘Fast. Redis, Memcached. Server remembers popular results!’},{icon:‘🗄️’,text:‘Database (Slowest source)’,tip:‘Has everything. Only hit when all caches miss!’}]},
quiz:[{q:‘Which cache is FASTEST?’,opts:[‘Database’,‘CDN’,‘Server cache’,‘Browser cache (your device)!’],ans:3,expl:‘Browser cache is fastest! Data is already on your device. No network needed!’},{q:‘CDN caches content…?’,opts:[‘Only at origin’,‘Far from users’,‘Near users geographically!’,‘On your device’],ans:2,expl:‘CDN = Content Delivery Network. Caches content in many worldwide locations near you!’},{q:‘On a total cache miss, request goes to…?’,opts:[‘Error!’,‘The original database!’,‘Nothing happens’,‘Request is ignored’],ans:1,expl:‘All caches missed → hits the original database. Slowest but most complete!’}]},
{id:‘5.3’,emoji:‘🔄’,title:‘When Do We Refill?’,sub:‘Cache Strategies’,game:‘cache’,story:{scene:‘🔄’,parts:[‘👀’,‘🏃’,‘🔄’,‘✅’],mascot:‘Speedy the Squirrel ⚡’,text:{toddler:‘Speedy has rules for refilling the cookie counter! RULE 1 (Cache-Aside): Check counter first. Empty? Go get more and put them there! RULE 2 (Write-Through): Bake cookies → put on counter AND in jar AT THE SAME TIME! RULE 3 (Write-Behind): Put on counter NOW, save in jar LATER!’,kids:‘Cache-Aside (Lazy Loading): Check cache → miss → load from DB → save to cache → return. Most popular! Write-Through: Write to cache AND database simultaneously. Always consistent, writes slower. Write-Behind: Write to cache instantly, DB updated async. Fastest writes!’},fact:‘💡 Cache-Aside is the most popular strategy! Simple, effective, and used by most web apps!’},
diag:{title:‘3 Cache Strategies!’,nodes:[{icon:‘👀’,text:‘Cache-Aside: Check first!’,tip:‘Miss? Load from DB, save to cache, return. Most popular strategy!’},{icon:‘✅’,text:‘Write-Through: Update both!’,tip:‘Write to cache AND database at same time. Always in sync. Writes are slightly slower!’},{icon:‘⚡’,text:‘Write-Behind: Cache now, DB later!’,tip:‘Write to cache instantly. DB updated in background. Fastest writes!’}]},
quiz:[{q:‘Cache-Aside means…?’,opts:[‘Always use cache’,‘Check cache first, load from DB on miss!’,‘Ignore cache’,‘Only write to DB’],ans:1,expl:‘Cache-Aside = lazy loading! Only cache data when actually requested. Simple!’},{q:‘Write-Through writes to…?’,opts:[‘Only cache’,‘Only database’,‘Cache AND database simultaneously!’,‘Neither’],ans:2,expl:‘Write-Through keeps both in sync! Always write to both. Safe but writes slightly slower!’},{q:‘Write-Behind is fastest for…?’,opts:[‘Reads’,‘Writes! (cache first, DB later)’,‘Both equally’,‘Neither’],ans:1,expl:‘Write-Behind writes to cache instantly, DB updated in background. Blazing fast writes!’}]},
{id:‘5.4’,emoji:‘🗑️’,title:‘Throw Out Old Snacks!’,sub:‘Cache Eviction’,game:‘cache’,story:{scene:‘🗑️’,parts:[‘🗑️’,‘🔄’,‘📊’,‘⚖️’],mascot:‘Speedy the Squirrel ⚡’,text:{toddler:‘Speedy's counter only holds 10 cookies! When a new one arrives and it's FULL — throw one out! Which one? The one not touched longest (LRU)? The least popular overall (LFU)? The very first one put there (FIFO)? Different rules for different kitchens!’,kids:‘Cache eviction = what to remove when cache is full. LRU (Least Recently Used): remove oldest unused — most popular! LFU (Least Frequently Used): remove least-accessed overall. FIFO (First In First Out): remove oldest added. LRU works best for most web apps!’},fact:‘🧠 Your own brain works like LRU! Memories you haven't thought about in years get “evicted” to make room!’},
diag:{title:‘Eviction Policies!’,nodes:[{icon:‘🕐’,text:‘LRU: Oldest unused goes!’,tip:‘Least Recently Used. Item not accessed longest gets evicted. Most popular policy!’},{icon:‘📊’,text:‘LFU: Least popular goes!’,tip:‘Least Frequently Used. Item accessed least often overall gets removed!’},{icon:‘1️⃣’,text:‘FIFO: First in, first out!’,tip:‘First item added gets evicted first, regardless of how popular it is!’}]},
quiz:[{q:‘LRU stands for…?’,opts:[‘Last Remaining Unit’,‘Least Recently Used!’,‘Largest Recent Upload’,‘Long Running Update’],ans:1,expl:‘Least Recently Used! Item not accessed longest gets evicted first!’},{q:‘Cache is full, new item arrives. What happens?’,opts:[‘New item rejected’,‘Something gets evicted to make room!’,‘Cache crashes’,‘Nothing happens’],ans:1,expl:‘Eviction policy kicks out an item to make room for the new one!’},{q:‘Which eviction policy is most POPULAR?’,opts:[‘FIFO’,‘Random’,‘LFU’,‘LRU!’],ans:3,expl:‘LRU is most popular! Evict what you haven't used recently — probably not needed!’}]},
{id:‘5.5’,emoji:‘🌍’,title:‘Mini Kitchens Everywhere!’,sub:‘CDN’,game:‘cache’,story:{scene:‘🌍’,parts:[‘🌍’,‘🏪’,‘⚡’,‘📍’],mascot:‘Speedy the Squirrel ⚡’,text:{toddler:‘Speedy's cookie factory is in New York! A kid in Japan wants cookies — that's 7,000 miles away! 😱 So Speedy opens MINI KITCHENS all over the world — one in Tokyo, one in London, one in Sydney! Everyone gets cookies from their NEAREST kitchen! Super fast! 🌍’,kids:‘CDN = Content Delivery Network. A global network of servers. Your content (images, videos, CSS) is COPIED to hundreds of locations. User in Japan gets served from Japan server — not USA! Cloudflare, Fastly, AWS CloudFront are popular CDNs!’},fact:‘🌐 Cloudflare has 310 data centers in 100+ countries. Any user is within 20ms of a Cloudflare server!’},
diag:{title:‘CDN = Global Speed!’,nodes:[{icon:‘🏭’,text:‘Origin Server (one place)’,tip:‘Your website lives here. Serving everyone from one place = slow for far-away users!’},{icon:‘🌍’,text:‘CDN Edge Servers (everywhere!)’,tip:‘Copies of your content around the world. Users get served from nearest location!’},{icon:‘⚡’,text:‘Near you = Fast!’,tip:‘Tokyo user gets Tokyo server. London user gets London server. Everyone wins!’}]},
quiz:[{q:‘What is a CDN?’,opts:[‘A database type’,‘Network of servers caching content near users!’,‘A language’,‘A VPN type’],ans:1,expl:‘CDN = Content Delivery Network! Servers worldwide cache content near users!’},{q:‘CDN is most useful for…?’,opts:[‘Database queries’,‘Static content — images, videos, CSS!’,‘Real-time chat’,‘Secret passwords’],ans:1,expl:‘CDN is perfect for static content! Images, videos, stylesheets — content that rarely changes!’},{q:‘Australia user visits US website WITH CDN. Served from…?’,opts:[‘From USA (slow!)’,‘Nearest CDN edge (Australia or Asia)!’,‘The moon’,‘Random location’],ans:1,expl:‘CDN serves from nearest edge! Australia user gets content from nearby — not from USA!’}]}
]},
{id:6,emoji:‘📬’,name:‘The Busy Mailroom’,sub:‘Async, Queues & Events’,cls:‘wc6’,col:’#a29bfe’,lcol:’#f3f0ff’,bdcol:’#6c5ce7’,badge:‘📬’,bname:‘Queue Queen’,desc:‘Nobody likes waiting on hold! Learn the smarter, asyncronous way!’,say:‘Leave a voicemail and go play! I'll call back when ready. No more waiting on hold! 📞’,
lessons:[
{id:‘6.1’,emoji:‘📞’,title:‘Waiting vs Voicemail’,sub:‘Sync vs Async’,game:‘mail’,story:{scene:‘📞’,parts:[‘📞’,‘💤’,‘🎮’,‘✅’],mascot:‘Queenie the Bee 👸’,text:{toddler:‘SYNC: You call Tommy, wait on hold for 20 minutes… 😴 ASYNC: You leave a voicemail, GO PLAY 🎮, Tommy calls back when ready! 📲 Websites work the same way! Send a request, keep doing other things, get the answer when it's done!’,kids:‘Synchronous: wait for each step to finish before moving on. Blocks everything! Asynchronous: send request, continue other work, get notified when done. Node.js, Python async are built async. Don't wait — do 10 other things while waiting for a slow database!’},fact:‘⚡ Node.js handles THOUSANDS of connections simultaneously with ONE thread using async!’},
diag:{title:‘Sync vs Async!’,nodes:[{icon:‘📞’,text:‘Sync: Wait on hold!’,tip:‘Stuck waiting for every step. Simple but blocks everything until finished!’},{icon:‘📬’,text:‘Async: Leave a voicemail!’,tip:‘Send request, keep working! Get notified when done. Much more efficient!’}]},
quiz:[{q:‘SYNCHRONOUS means…?’,opts:[‘Very fast’,‘Wait for each step before continuing!’,‘Do many things at once’,‘No waiting’],ans:1,expl:‘Synchronous = wait! Like being on hold. Simple but blocks everything!’},{q:‘ASYNCHRONOUS means…?’,opts:[‘Very slow’,‘Wait for everything’,‘Send request, keep going — get notified when done!’,‘Only for games’],ans:2,expl:‘Async = keep going! Like a voicemail. Don't wait — do other things and get response later!’},{q:‘A slow database query should be…?’,opts:[‘Sync (block everything!)’,‘Async! (keep app running!)’,‘Ignored’,‘Deleted’],ans:1,expl:‘Slow operations should be async! Don't freeze the whole app while waiting!’}]},
{id:‘6.2’,emoji:‘📥’,title:‘The Magic To-Do Tray’,sub:‘Message Queues’,game:‘mail’,story:{scene:‘📥’,parts:[‘📥’,‘📋’,‘👷’,‘✅’],mascot:‘Queenie the Bee 👸’,text:{toddler:‘Queenie's mailroom has a magic TO-DO TRAY! Letters arrive in the tray. Workers pick them up ONE BY ONE. Even if 1000 letters arrive at once — nobody panics! The tray holds them all. Workers go at their own pace. No letters lost!’,kids:‘Message queues decouple producers from consumers. Producer adds to queue (instant!). Consumer processes at its own speed. Benefits: no message loss if consumer is slow/down, add more consumers to scale, producers never block. RabbitMQ, AWS SQS, Kafka are the big ones!’},fact:‘📧 When you send Gmail, Google puts it in a QUEUE. Email processing happens separately — that's why Send is instant!’},
diag:{title:‘Message Queue!’,nodes:[{icon:‘📤’,text:‘Producer (sends messages)’,tip:‘Adds to queue instantly. Doesn't wait for processing!’},{icon:‘📥’,text:‘Queue (stores messages)’,tip:‘Messages wait safely. Handles any volume no matter how fast they arrive!’},{icon:‘👷’,text:‘Consumer (processes them)’,tip:‘Workers pick from queue at their own pace. Add more workers to go faster!’}]},
quiz:[{q:‘What does a message QUEUE do?’,opts:[‘Deletes messages’,‘Stores messages between producer and consumer!’,‘Makes faster’,‘Encrypts’],ans:1,expl:‘Queue stores messages safely between sender and receiver!’},{q:‘Why use a message queue?’,opts:[‘No reason’,‘Decouple systems — producer doesn't wait for consumer!’,‘To delete messages’,‘For complexity’],ans:1,expl:‘Queues decouple! Producer sends instantly. Consumer processes when ready. No blocking!’},{q:‘1000 messages arrive, worker is slow. WITH queue…?’,opts:[‘1000 messages lost!’,‘System crashes’,‘Messages wait safely until processed!’,‘Worker magically speeds up’],ans:2,expl:‘Queue saves everything! Messages wait safely until the worker can process them!’}]},
{id:‘6.3’,emoji:‘📰’,title:‘Subscribe to the Newsletter!’,sub:‘Pub/Sub’,game:‘mail’,story:{scene:‘📰’,parts:[‘📰’,‘📧’,‘👥’,‘🔔’],mascot:‘Queenie the Bee 👸’,text:{toddler:‘When the teacher posts a newsletter, ALL subscribed parents get it! 📰 The teacher doesn't know who reads it — she just PUBLISHES and everyone subscribed AUTOMATICALLY gets it! That's PUB/SUB! One person publishes, MANY people receive!’,kids:‘Pub/Sub = Publisher/Subscriber. Publishers send to a “topic” without knowing who receives. Subscribers listen to topics they care about. Publisher sends → ALL subscribers get it instantly! Completely decoupled! Used by Instagram notifications, stock price updates, IoT sensors. Kafka is king!’},fact:‘🔔 When you post on Instagram, ALL followers get notified via Pub/Sub! One post fans out to millions!’},
diag:{title:‘Pub/Sub!’,nodes:[{icon:‘📢’,text:‘Publisher (one sender)’,tip:‘Sends to a topic. Doesn't know or care who receives it!’},{icon:‘📋’,text:‘Topic (like a channel)’,tip:‘Named channel. Subscribe to “sports” — get all sports updates!’},{icon:‘👥’,text:‘Subscribers (many receivers!)’,tip:‘Everyone subscribed gets the message. Could be 1 or 1 MILLION people!’}]},
quiz:[{q:‘In Pub/Sub, the PUBLISHER is…?’,opts:[‘One receiving messages’,‘One SENDING to a topic!’,‘The storage system’,‘A subscriber’],ans:1,expl:‘Publisher sends messages to topics! They don't care who's listening!’},{q:‘Can ONE message reach MANY subscribers?’,opts:[‘No, only one’,‘Only two’,‘Yes! All subscribers get it!’,‘Only if they ask’],ans:2,expl:‘Yes! That's the beauty of Pub/Sub! One message fans out to every subscriber!’},{q:‘Pub/Sub is most like…?’,opts:[‘A direct phone call’,‘A newsletter — publish once, all subscribers get it!’,‘A private message’,‘A voicemail’],ans:1,expl:‘Newsletter! Publish once → every subscriber gets a copy automatically!’}]},
{id:‘6.4’,emoji:‘🌊’,title:‘The Mailbox is Full!’,sub:‘Back Pressure’,game:‘mail’,story:{scene:‘🌊’,parts:[‘🌊’,‘🛑’,‘📬’,‘⚡’],mascot:‘Queenie the Bee 👸’,text:{toddler:‘Queenie's mailbox has 100 slots. Someone keeps stuffing letters faster than workers can empty it! Soon it's TOTALLY FULL! 😱 Smart solution: put a “FULL — STOP SENDING!” sign! The sender slows down until workers catch up! That's BACK PRESSURE!’,kids:‘Back pressure = flow control. When consumers can't keep up with producers, they push back — signal to slow down. Like a highway on-ramp traffic light. Prevents: queue overflow, memory crashes, message loss. TCP has built-in back pressure. Kafka and reactive frameworks support it explicitly!’},fact:‘🚦 Highway on-ramp traffic lights ARE physical back pressure! They control flow to prevent highway jams!’},
diag:{title:‘Back Pressure!’,nodes:[{icon:‘🏭’,text:‘Producer (too fast!)’,tip:‘Sending thousands of messages per second! Consumer can't keep up!’},{icon:‘📬’,text:‘Queue (filling up!)’,tip:‘Queue getting full! If it overflows, messages will be LOST!’},{icon:‘🛑’,text:‘Back Pressure: Slow Down!’,tip:‘Consumer signals: I'm overwhelmed! Producer slows down. Queue stabilizes. System saved!’}]},
quiz:[{q:‘What is BACK PRESSURE?’,opts:[‘A type of massage’,‘Signal to producers to slow down!’,‘A database trick’,‘Making things faster’],ans:1,expl:‘Back pressure says SLOW DOWN! Prevents queue overflow and system crashes!’},{q:‘Without back pressure, a full queue means…?’,opts:[‘Gets faster’,‘Messages LOST or system crashes!’,‘Fixes itself’,‘Nothing bad’],ans:1,expl:‘Full queue = messages lost or crash! Back pressure prevents this by controlling flow!’},{q:‘Back pressure is like…?’,opts:[‘A gas pedal’,‘A highway on-ramp traffic light!’,‘Broken brakes’,‘A turbo boost’],ans:1,expl:‘Traffic lights control car flow! Back pressure does the same for data!’}]},
{id:‘6.5’,emoji:‘💡’,title:‘Motion Sensor Magic!’,sub:‘Event-Driven Design’,game:‘mail’,story:{scene:‘💡’,parts:[‘💡’,‘🚶’,‘⚡’,‘🔔’],mascot:‘Queenie the Bee 👸’,text:{toddler:‘The hallway light only turns ON when someone WALKS IN! 💡 It doesn't run all day wasting electricity. It WAITS for an EVENT (someone walking!) and then REACTS! That's event-driven! Apps work the same way — wait for something to happen, then react!’,kids:‘Event-Driven Architecture: components communicate through events. Event = something happened (user ordered, button clicked). Event published → multiple services react (send email, update inventory, charge card). Services are loosely coupled! Easy to add new reactions without touching existing code. Uber, Netflix, Amazon use EDA!’},fact:‘📦 One Amazon order triggers dozens of events: warehouse alert, inventory update, shipping queue, confirmation email — all from one event!’},
diag:{title:‘Event-Driven!’,nodes:[{icon:‘🚶’,text:‘Event happens! (user orders)’,tip:‘Something occurs. Order placed, button clicked — that's the trigger event!’},{icon:‘📢’,text:‘Event published!’,tip:‘The event is announced. Multiple services listen and react independently!’},{icon:‘⚡’,text:‘Many reactions! (email, ship, charge)’,tip:‘Each service reacts independently. Add new reactions without changing old code!’}]},
quiz:[{q:‘What triggers things in Event-Driven Design?’,opts:[‘A timer only’,‘An EVENT — something that happens!’,‘A random signal’,‘Nothing’],ans:1,expl:‘Events trigger everything! User actions, sensor readings — events make things happen!’},{q:‘Event-driven is like a…?’,opts:[‘Always-on engine’,‘Motion sensor light — only reacts when triggered!’,‘A slow clock’,‘A silent alarm’],ans:1,expl:‘Motion sensor! Only activates when triggered. Efficient and reactive!’},{q:‘Adding a NEW reaction to an existing event…?’,opts:[‘Changes everything’,‘Is impossible’,‘Just add a new subscriber — old code unchanged!’,‘Crashes system’],ans:2,expl:‘Easy to extend! Add a new subscriber and it automatically reacts. Old code untouched!’}]}
]},
{id:7,emoji:‘🤖’,name:‘Team Robot Town’,sub:‘Microservices & Distributed Systems’,cls:‘wc7’,col:’#74b9ff’,lcol:’#eef6ff’,bdcol:’#2980b9’,badge:‘🤖’,bname:‘Robot Captain’,desc:‘One giant robot vs a whole team! Learn how big systems stay alive when things break!’,say:‘I used to do EVERYTHING myself. Now I have a team! If I fall, they keep going! 🤝’,
lessons:[
{id:‘7.1’,emoji:‘🏗️’,title:‘One Giant vs Robot Team’,sub:‘Monolith vs Microservices’,game:‘robot’,story:{scene:‘🤖’,parts:[‘🏗️’,‘🤖’,‘🧩’,‘✅’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘MONOLITH: One giant robot does EVERYTHING — cooking, cleaning, driving! If its leg breaks, EVERYTHING stops! 😱 MICROSERVICES: A team — one cooks, one cleans, one drives! If the cook breaks, the driver still works! Much more resilient!’,kids:‘Monolith: all code in one app. Simple to start! But one bug can crash everything, hard to scale just one part. Microservices: many small independent services. Deploy, scale, update each independently! Netflix has 1000+ microservices. But it adds complexity!’},fact:‘🏗️ Netflix broke their monolith into 1000+ microservices. Now one failing service doesn't crash the whole platform!’},
diag:{title:‘Monolith vs Microservices!’,nodes:[{icon:‘🏗️’,text:‘Monolith: One big app’,tip:‘Everything together. Simple to start. But one bug = everything down!’},{icon:‘🧩’,text:‘Microservices: Many small services’,tip:‘Each does one thing well. One fails? Others keep working!’},{icon:‘⚖️’,text:‘Trade-offs!’,tip:‘Monolith = simple. Microservices = resilient & scalable but complex!’}]},
quiz:[{q:‘MONOLITH means…?’,opts:[‘Many small services’,‘One big app that does everything!’,‘A robot type’,‘A database’],ans:1,expl:‘Monolith = one big app! Simple but fragile — one bug can crash everything!’},{q:‘MICROSERVICES means…?’,opts:[‘One big service’,‘Many small independent services!’,‘Tiny servers’,‘A database type’],ans:1,expl:‘Microservices = many small services! Deploy and scale each independently!’},{q:‘Payment service crashes. With microservices…?’,opts:[‘Everything crashes’,‘Only payment is down — others keep working!’,‘Nothing happens’,‘All crash’],ans:1,expl:‘Isolated failures! Payment down, but search, catalog, login keep working perfectly!’}]},
{id:‘7.2’,emoji:‘🗒️’,title:‘The Magic Robot Directory’,sub:‘Service Discovery’,game:‘robot’,story:{scene:‘📋’,parts:[‘📋’,‘🔍’,‘📍’,‘🔄’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘Robot Town has 100 robots! How does Cook Robot find Delivery Robot? There's a MAGIC DIRECTORY that updates itself! Every robot registers when it starts and removes itself when it stops. Need a Delivery Robot? Check the directory!’,kids:‘Service discovery solves: in microservices, services start/stop dynamically. IPs change! How does Service A find Service B? Client-Side: ask registry, get list, choose one. Server-Side: ask load balancer, it asks registry. Consul, Eureka, Kubernetes DNS are popular!’},fact:‘☸️ Kubernetes has built-in service discovery! Services find each other by name — Kubernetes handles the IPs!’},
diag:{title:‘Service Discovery!’,nodes:[{icon:‘🆕’,text:‘New Service Starts → Registers!’,tip:‘When a service starts, it tells the registry: “I'm here at this address!”’},{icon:‘📋’,text:‘Service Registry (Living Phone Book)’,tip:‘Always up-to-date list of all available services and their current addresses!’},{icon:‘🔍’,text:‘Service A asks: “Where is B?”’,tip:‘Ask the registry! Get current address. Service A connects directly!’}]},
quiz:[{q:‘Why is service discovery needed?’,opts:[‘For fun’,‘Services are dynamic — can't hardcode changing addresses!’,‘To slow things’,‘For decoration’],ans:1,expl:‘Microservices are dynamic! Services start and stop, IPs change. Discovery keeps track!’},{q:‘A service registry is like…?’,opts:[‘A database’,‘A phone book that updates itself automatically!’,‘A load balancer’,‘A cache’],ans:1,expl:‘Living phone book! Always has the current address of every service!’},{q:‘When a service SHUTS DOWN, it should…?’,opts:[‘Stay in registry’,‘Unregister from the registry!’,‘Do nothing’,‘Alert everything’],ans:1,expl:‘Always unregister! Otherwise other services will try to reach a dead address!’}]},
{id:‘7.3’,emoji:‘🚪’,title:‘The Grand Front Door’,sub:‘API Gateway’,game:‘robot’,story:{scene:‘🚪’,parts:[‘🚪’,‘🔀’,‘🛡️’,‘📋’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘Robot Town has 100 robots but ONE grand front door! 🚪 Every visitor comes to the FRONT DOOR first. The doorman checks your ID and sends you to the right robot! You only need to know ONE address! That's an API Gateway!’,kids:‘API Gateway = single entry point for all clients. Handles: authentication (once for all!), rate limiting, routing to right microservice, request transformation. Mobile app talks to ONE gateway — behind it could be 50+ microservices! Kong, AWS API Gateway, Nginx Plus are popular!’},fact:‘🌐 Your app talks to ONE API Gateway address. Behind it could be 50 microservices — you only need to know one!’},
diag:{title:‘API Gateway!’,nodes:[{icon:‘👥’,text:‘Many Clients’,tip:‘Mobile app, web app, partners — all talk to the SAME single gateway address!’},{icon:‘🚪’,text:‘API Gateway (front door!)’,tip:‘Checks auth, rate limits, routes to right service. One place, many responsibilities!’},{icon:‘🤖’,text:‘Microservices behind it’,tip:‘Many services hidden behind gateway. Clients don't need to know the complexity!’}]},
quiz:[{q:‘What is an API GATEWAY?’,opts:[‘A database’,‘Single entry point routing requests to microservices!’,‘A network cable’,‘A robot type’],ans:1,expl:‘API Gateway = smart front door! All requests come here, gets routed to the right service!’},{q:‘Authentication should be handled…?’,opts:[‘In every service (hard!)’,‘Once at the gateway (smart!)’,‘Never’,‘In the database’],ans:1,expl:‘Handle auth ONCE at the gateway! Centralized, efficient, easy to maintain!’},{q:‘Without API Gateway, apps need to know…?’,opts:[‘Nothing’,‘Just one address’,‘Address of EVERY microservice!’,‘Only DB address’],ans:2,expl:‘Without gateway, apps must track every service address! With gateway, just one!’}]},
{id:‘7.4’,emoji:‘⚡’,title:‘The Magic Power Switch’,sub:‘Circuit Breaker’,game:‘robot’,story:{scene:‘⚡’,parts:[‘⚡’,‘🔌’,‘🛡️’,‘✅’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘The Payment Robot is SICK! 🤒 Every request waits 30 seconds just to fail! All those waiting requests make OTHER robots sick too! 😱 Solution: a CIRCUIT BREAKER cuts off the sick robot! Now everyone instantly hears “Payment is down, sorry” and moves on!’,kids:‘Circuit breaker prevents cascading failures. States: CLOSED (normal, all pass), OPEN (too many failures, instantly fail — fast failure!), HALF-OPEN (test if recovered). Like electrical circuit breakers in your house! Netflix Hystrix implements this!’},fact:‘🔌 Your house has circuit breakers! If one appliance shorts, only that circuit trips — not the whole house. Same idea!’},
diag:{title:‘Circuit Breaker States!’,nodes:[{icon:‘✅’,text:‘CLOSED: Normal! Requests flow.’,tip:‘All good! Requests pass through. Breaker monitors for failures!’},{icon:‘🔴’,text:‘OPEN: Too many failures! Blocked!’,tip:‘Tripped! Requests instantly fail — no waiting for broken service. Fail fast!’},{icon:‘🟡’,text:‘HALF-OPEN: Testing recovery!’,tip:‘Let a few requests through. Succeed → close circuit. Fail → reopen!’}]},
quiz:[{q:‘Circuit breaker PREVENTS…?’,opts:[‘Fast responses’,‘Cascading failures spreading through the system!’,‘Too many users’,‘Database crashes’],ans:1,expl:‘Circuit breakers stop failure spreading! Service A fails → prevents it from crashing B, C, D!’},{q:‘OPEN circuit means…?’,opts:[‘All working fine’,‘Service failing — requests blocked INSTANTLY!’,‘Service healthy’,‘Requests slow’],ans:1,expl:‘Open = tripped! Instead of waiting 30s for failure, instantly returns an error. Fail fast!’},{q:‘Circuit breaker is named after…?’,opts:[‘A board game’,‘Real electrical circuit breakers in your home!’,‘A type of dance’,‘A robot’],ans:1,expl:‘Real electrical circuit breakers protect homes. Software ones protect microservices!’}]},
{id:‘7.5’,emoji:‘📡’,title:‘GPS for Your Request’,sub:‘Distributed Tracing’,game:‘robot’,story:{scene:‘📡’,parts:[‘📡’,‘🗺️’,‘🔍’,‘📦’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘You ordered a package! The tracking number lets you see: picked up → sorting center → local hub → out for delivery! You know EXACTLY where it is! Distributed tracing does that for internet requests — track them as they travel through 10 different robots!’,kids:‘In microservices, one request touches many services. Something is slow — WHERE? Distributed tracing tracks the whole journey! Each service adds a “span” with timing. View: A took 2ms, B took 500ms, C took 1ms. AHA! B is the bottleneck! Jaeger, Zipkin, Datadog do this!’},fact:‘🔍 When Netflix is slow, engineers use distributed tracing to find which of their 1000+ services is the culprit — in minutes!’},
diag:{title:‘Trace the Journey!’,nodes:[{icon:‘📦’,text:‘Request starts! (Trace ID created)’,tip:‘Every request gets a unique ID. This ID travels with it everywhere it goes!’},{icon:‘🔀’,text:‘Travels through 5 services’,tip:‘Each service logs when request arrived and left. Building a map of the journey!’},{icon:‘🗺️’,text:‘Full picture — find the slow part!’,tip:‘View the complete journey! Instantly see which service added the most delay!’}]},
quiz:[{q:‘What is DISTRIBUTED TRACING?’,opts:[‘A database type’,‘Tracking a request through multiple services to find slow parts!’,‘A robot type’,‘Cable management’],ans:1,expl:‘Distributed tracing tracks requests! See everywhere it went and how long each step took!’},{q:‘System is slow. Tracing helps you…?’,opts:[‘Make it faster automatically’,‘Find WHICH service is slow!’,‘Delete the request’,‘Restart everything’],ans:1,expl:‘Tracing shows the full journey! Instantly see which specific service is causing slowness!’},{q:‘A TRACE ID does what?’,opts:[‘Encrypts the request’,‘Links all logs across services for one request!’,‘Makes requests faster’,‘Stores data’],ans:1,expl:‘Trace ID links everything! Same ID travels everywhere — collect all logs with it for full picture!’}]},
{id:‘7.6’,emoji:‘🗣️’,title:‘Playground Rumors!’,sub:‘Gossip Protocol’,game:‘robot’,story:{scene:‘🗣️’,parts:[‘🗣️’,‘👥’,‘📢’,‘🌐’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘One robot learns something important! It tells 2 friends. Those 2 each tell 2 MORE friends. Those 4 each tell 2 more. In just 10 rounds, ALL 1000 robots know! 🌐 Just like playground rumors! That's the GOSSIP PROTOCOL!’,kids:‘Gossip protocol: each node periodically shares info with random neighbors. Information spreads exponentially! 1000 nodes? Spreads to everyone in log(1000) ≈ 10 rounds! Used for: cluster membership, failure detection, data propagation. Cassandra and Redis Cluster use gossip!’},fact:‘🌐 Cassandra (used by Instagram, Netflix) uses gossip so every node knows full cluster state — with zero central coordinator!’},
diag:{title:‘Gossip Spreads!’,nodes:[{icon:‘🤖’,text:‘Robot 1 learns news!’,tip:‘One node gets information. Immediately tells 2 random neighbors!’},{icon:‘🗣️’,text:‘Tells 2 → they tell 2 each…’,tip:‘Each robot tells more. Information spreads exponentially fast!’},{icon:‘🌐’,text:‘Everyone knows in ~10 rounds!’,tip:‘log(N) rounds to reach everyone. Fast, robust, no single point of failure!’}]},
quiz:[{q:‘Gossip protocol is like…?’,opts:[‘A secret vault’,‘Playground rumors spreading person to person!’,‘A direct message’,‘A loudspeaker’],ans:1,expl:‘Gossip = rumors! Each node tells neighbors, they tell others. Everyone knows quickly!’},{q:‘How fast does gossip reach 1000 nodes?’,opts:[‘Slowly — 1000 rounds’,‘Instantly’,‘Quickly — about 10 rounds!’,‘Never reaches all’],ans:2,expl:‘Exponential spread! 2→4→8→16… Just 10 rounds reaches 1000 nodes!’},{q:‘Why is gossip RESILIENT?’,opts:[‘It's very simple’,‘No central coordinator — anyone can spread news!’,‘It's centralized’,‘Requires fast servers’],ans:1,expl:‘No boss needed! Any node can spread info. Even if some fail, message routes around them!’}]},
{id:‘7.7’,emoji:‘🗳️’,title:‘Vote for Team Captain!’,sub:‘Consensus & Leader Election’,game:‘robot’,story:{scene:‘🗳️’,parts:[‘🗳️’,‘👑’,‘🤝’,‘✅’],mascot:‘Robbie the Robot 🤖’,text:{toddler:‘Robot Town needs a LEADER! But which robot leads? They VOTE! 🗳️ Most votes = LEADER! When the leader gets tired, they vote AGAIN! There's always a leader and everyone agrees. That's CONSENSUS — everyone agreeing on one truth!’,kids:‘Consensus = all nodes agree on a value. Leader election = choose one leader. In distributed systems, need ONE source of truth for decisions. Raft algorithm: nodes vote, leader wins majority, handles all writes. Leader fails → new election! Raft powers etcd which powers Kubernetes!’},fact:‘☸️ Kubernetes uses etcd + Raft consensus to decide which server runs each container!’},
diag:{title:‘Leader Election!’,nodes:[{icon:‘🗳️’,text:‘Election time!’,tip:‘All nodes vote for a candidate. Each can vote for themselves!’},{icon:‘👑’,text:‘Majority wins → Leader!’,tip:‘Node with majority votes becomes leader. Must get more than half!’},{icon:‘⚡’,text:‘Leader handles all decisions!’,tip:‘All important operations go through the leader. Ensures consistency!’}]},
quiz:[{q:‘Why do distributed systems need CONSENSUS?’,opts:[‘For fun’,‘Multiple nodes must agree — need one source of truth!’,‘To go faster’,‘Save memory’],ans:1,expl:‘Consensus ensures all nodes agree! Conflicting decisions in distributed systems cause chaos!’},{q:‘LEADER ELECTION means…?’,opts:[‘Political election’,‘Choosing one node as primary decision maker!’,‘A voting game’,‘Picking a database’],ans:1,expl:‘Leader election picks ONE leader! All important decisions go through the leader!’},{q:‘Current leader CRASHES. What happens?’,opts:[‘System stops forever’,‘Data is lost’,‘New election! New leader chosen automatically!’,‘Random node takes over’],ans:2,expl:‘New election! Remaining nodes vote for a new leader. System keeps running!’}]}
]},
{id:8,emoji:‘🏗️’,name:‘The Build-It Workshop’,sub:‘Real System Case Studies’,cls:‘wc8’,col:’#fd79a8’,lcol:’#fff0f6’,bdcol:’#c0306a’,badge:‘🏗️’,bname:‘Master Architect’,desc:‘Use EVERYTHING you learned to understand how real apps like YouTube and WhatsApp work!’,say:‘You've learned SO much! Now let's see how real apps put it all together! 🏗️’,
lessons:[
{id:‘8.1’,emoji:‘💬’,title:‘Walkie-Talkies for Everyone!’,sub:‘WebSockets’,game:‘taco’,story:{scene:‘💬’,parts:[‘💬’,‘🔄’,‘⚡’,‘📡’],mascot:‘Builder Bob 👷’,text:{toddler:‘Normal internet is like LETTERS — you send one, wait for a reply, send another. Slow! 📮 Walkie-talkies are DIFFERENT — both people talk any time! 📡 WebSockets are internet walkie-talkies! Used for: live chat 💬, online games 🎮, real-time sports scores ⚽!’,kids:‘HTTP: client asks → server answers → connection closes. Repeat. WebSockets: one connection opens and STAYS OPEN! Both sides send messages anytime. Server can PUSH to client without being asked. Used by: WhatsApp, Slack, Discord, multiplayer games, live feeds, Google Docs!’},fact:‘💬 WhatsApp, Slack, Discord ALL use WebSockets. That's why messages appear instantly without refreshing!’},
diag:{title:‘WebSockets!’,nodes:[{icon:‘📩’,text:‘HTTP: Ask → Answer → Close’,tip:‘Normal HTTP closes after each response. Every message needs a new connection!’},{icon:‘📡’,text:‘WebSocket: Always Connected!’,tip:‘One connection stays open! Both sides talk freely anytime. Like a phone call!’},{icon:‘⚡’,text:‘Real-time magic!’,tip:‘Server pushes data without being asked! Instant updates, no polling!’}]},
quiz:[{q:‘WebSockets are like…?’,opts:[‘Letters (ask and wait)’,‘Walkie-talkies (always connected)!’,‘A slow connection’,‘A database’],ans:1,expl:‘Walkie-talkies! Connection stays open, both sides talk freely anytime!’},{q:‘WebSocket is better than HTTP for…?’,opts:[‘Loading web pages’,‘Real-time chat, games, live updates!’,‘Downloading files’,‘Sending emails’],ans:1,expl:‘WebSocket shines for real-time! Chat, games, live scores — things needing instant updates!’},{q:‘Can WebSocket server PUSH data without being asked?’,opts:[‘No, client must ask first’,‘Yes! Server pushes anytime!’,‘Only once’,‘Never’],ans:1,expl:‘Yes! Server can push freely. No polling needed. That's the magic of WebSockets!’}]},
{id:‘8.2’,emoji:‘🔐’,title:‘The Secret Treehouse Key’,sub:‘Security & Auth’,game:‘taco’,story:{scene:‘🔐’,parts:[‘🔑’,‘🛡️’,‘🔒’,‘✅’],mascot:‘Builder Bob 👷’,text:{toddler:‘Your treehouse has a SPECIAL LOCK! Only your KEY opens it! 🔑 When you show the key, you get inside. This is AUTHENTICATION — proving you are WHO you say you are! Passwords are keys. Your fingerprint is a key!’,kids:‘Authentication = prove who you are. Authorization = what are you allowed to do? OAuth: “Login with Google” — Google verifies identity for you. JWT tokens = signed proof of who you are. HTTPS encrypts everything. NEVER store plain-text passwords — always hash!’},fact:‘🛡️ Modern apps use “Login with Google/GitHub” because those companies have massive security teams!’},
diag:{title:‘Security Layers!’,nodes:[{icon:‘🔑’,text:‘Authentication: Who are you?’,tip:‘Password, fingerprint, magic link — prove your identity first!’},{icon:‘🛡️’,text:‘Authorization: What can you do?’,tip:‘After ID confirmed — what's allowed? Admins can delete. Users can only view their data!’},{icon:‘🔒’,text:‘HTTPS: Encrypt everything!’,tip:‘All data encrypted in transit. Nobody can intercept your password on the wire!’}]},
quiz:[{q:‘AUTHENTICATION means…?’,opts:[‘Making things faster’,‘Proving who you are!’,‘Storing data’,‘Sending emails’],ans:1,expl:‘Authentication = prove identity! Password, fingerprint, Google login — all authenticate you!’},{q:‘AUTHORIZATION means…?’,opts:[‘Proving who you are’,‘What you're ALLOWED to do after authentication!’,‘Encrypting data’,‘A type of server’],ans:1,expl:‘Authorization = permissions! After proving identity, what can you access or modify?’},{q:‘Why hash passwords instead of storing plain text?’,opts:[‘No reason’,‘If DB breached, hashed passwords are unreadable — plain text = disaster!’,‘Takes less space’,‘Passwords are short’],ans:1,expl:‘Always hash! If hackers steal the database, hashed passwords are useless to them!’}]},
{id:‘8.3’,emoji:‘📏’,title:‘How Much Pizza Do We Need?’,sub:‘Estimation’,game:‘taco’,story:{scene:‘📏’,parts:[‘📏’,‘🧮’,‘💡’,‘📊’],mascot:‘Builder Bob 👷’,text:{toddler:‘100 friends come to your party! 🎉 Each eats 3 pizza slices. One pizza has 8 slices. How many? 100 × 3 ÷ 8 = 37.5 → 38 pizzas! Engineers do the SAME for computer systems! Quick math tells you if your plan makes sense BEFORE you build it!’,kids:‘Back-of-envelope estimation = quick rough math. 1B users × 10 requests/day = 10B/day ÷ 86,400 sec ≈ 115,000 req/sec. Need to handle that? Load balancers + many servers! Know: 1M seconds ≈ 11 days, KB/MB/GB/TB each 1000x bigger!’},fact:‘🔢 Powers of 2 are key: 2^10=1024≈1K, 2^20≈1M, 2^30≈1B. Makes big calculations fast!’},
diag:{title:‘Estimate Fast!’,nodes:[{icon:‘👥’,text:‘100M users daily’,tip:‘100M × 10 requests = 1B/day ÷ 86400 = ~11,500 requests/second!’},{icon:‘⚡’,text:‘Requests per second’,tip:‘Know your RPS! This tells you how many servers you need!’},{icon:‘💰’,text:‘Cost estimate’,tip:‘Servers + storage + bandwidth. Quick math prevents impossibly expensive designs!’}]},
quiz:[{q:‘1 billion daily users, 1 request each. Requests per second?’,opts:[‘~1,000/sec’,‘~12,000/sec!’,‘~1 million/sec’,‘~100/sec’],ans:1,expl:‘1B ÷ 86,400 ≈ 11,574 ≈ ~12,000/sec! Quick math for engineering estimation!’},{q:‘Why estimate BEFORE building?’,opts:[‘For fun’,‘Know size needed and if design is feasible before spending money!’,‘To confuse people’,‘No reason’],ans:1,expl:‘Estimate first! Building then discovering you need 100x more capacity is extremely costly!’},{q:‘1 TB = how many GB?’,opts:[‘1’,‘100’,‘1,000!’,‘1,000,000’],ans:2,expl:‘1 TB = 1,000 GB = 1,000,000 MB. Knowing storage units helps estimate requirements!’}]},
{id:‘8.4’,emoji:‘🔗’,title:‘The Nickname Machine’,sub:‘URL Shortener Design’,game:‘taco’,story:{scene:‘🔗’,parts:[‘🔗’,‘🔑’,‘🗄️’,‘⚡’],mascot:‘Builder Bob 👷’,text:{toddler:‘bit.ly/abc is a NICKNAME for a really long address! 🔗 When you click it, the nickname machine looks up the real address and sends you there! Let's BUILD this! We need: a database to store nicknames + a cache for speed + a load balancer for scale!’,kids:‘URL Shortener: 1) Submit long URL 2) Generate short code (hash or base62 counter) 3) Store in DB (short→long mapping) 4) Return short URL. On click: 1) Check cache (fast!) 2) Cache miss → DB 3) Redirect. Scale: 1B URLs ≈ 500GB storage. Need sharding!’},fact:‘🔗 Bit.ly handles 2+ billion redirects per MONTH! Heavy caching means most popular links are served from memory!’},
diag:{title:‘URL Shortener!’,nodes:[{icon:‘📥’,text:‘Receive long URL’,tip:‘User submits amazon.com/very-long-product-url-nobody-wants-to-type’},{icon:‘🔑’,text:‘Generate short code’,tip:‘Hash or counter: “abc123”. Store long→short mapping in database!’},{icon:‘⚡’,text:‘Redirect on click!’,tip:‘Visit bit.ly/abc123 → check cache → check DB → 301 redirect to original URL!’}]},
quiz:[{q:‘URL shortener needs a ___ to store mappings?’,opts:[‘Load balancer’,‘Database!’,‘CDN’,‘Circuit breaker’],ans:1,expl:‘Database stores the mappings! Short code → original long URL. Needs sharding at scale!’},{q:‘Popular short URLs should use ___ to be fast?’,opts:[‘Always database’,‘Cache! (most hits served from memory)’,‘Ignore them’,‘Delete them’],ans:1,expl:‘Cache popular redirects! Top links hit billions of times — serve from memory!’},{q:‘URL shortener reads (redirects) are ___ writes (creating URLs)?’,opts:[‘Same amount’,‘Much MORE frequent than writes!’,‘Less frequent’,‘Equal’],ans:1,expl:‘Way more reads than writes! People click links millions of times. Optimize for reads!’}]},
{id:‘8.5’,emoji:‘🐦’,title:‘The Magic Bulletin Board’,sub:‘Twitter Feed Design’,game:‘taco’,story:{scene:‘🐦’,parts:[‘🐦’,‘📋’,‘📢’,‘👥’],mascot:‘Builder Bob 👷’,text:{toddler:‘Taylor Swift posts a tweet — 150 MILLION followers see it! 😱 How? Special helper robots (fan-out workers) COPY the tweet to everyone's personal board the moment she posts! That's how Twitter feeds work — copy once, deliver everywhere!’,kids:‘Twitter Feed: tweet posted → stored + fan-out to followers. 150M followers = 150M write operations! Pre-compute feeds at write time. Store in cache. But celebrities: too expensive to fan-out 100M followers at write time — so merge celebrities at read time! Hybrid approach!’},fact:‘🐦 Twitter handles 500 MILLION tweets per day! Fan-out at scale is one of the hardest engineering problems!’},
diag:{title:‘Twitter Feed!’,nodes:[{icon:‘✍️’,text:‘Tweet posted!’,tip:‘Stored in their timeline database!’},{icon:‘🔀’,text:‘Fan-out workers!’,tip:‘Copy tweet to every follower's feed. 150M followers = 150M copies!’},{icon:‘📋’,text:‘Pre-computed feed (cached!)’,tip:‘Your feed is ready before you open the app! Instant loading from cache!’}]},
quiz:[{q:‘FAN-OUT means…?’,opts:[‘Shorter tweets’,‘Copying one tweet to all followers' feeds!’,‘Deleting tweets’,‘A cooling system’],ans:1,expl:‘Fan-out = multiply! One tweet fans out to millions of follower feeds!’},{q:‘Why pre-compute feeds before users open the app?’,opts:[‘Wasted effort’,‘Feeds load INSTANTLY when opened!’,‘Security’,‘To save tweets’],ans:1,expl:‘Pre-computed = instant! Computing feed when you open app = slow. Background = instant!’},{q:‘Celebrity with 100M followers fan-out on WRITE means…?’,opts:[‘1 write’,‘100M writes per tweet — too expensive!’,‘10 writes’,‘No writes’],ans:1,expl:‘100M copies per tweet! Too expensive. So celebrities are merged at READ time instead!’}]},
{id:‘8.6’,emoji:‘📺’,title:‘Your Own TV Channel!’,sub:‘YouTube Architecture’,game:‘taco’,story:{scene:‘📺’,parts:[‘📺’,‘🎬’,‘🌍’,‘⚡’],mascot:‘Builder Bob 👷’,text:{toddler:‘Someone uploads a video — 50 MILLION people watch it! 🤩 The video is HUGE (10GB!). How does everyone watch from everywhere? The video is COPIED to hundreds of mini-kitchens (CDN!) near every city! Everyone watches from their NEAREST copy! No buffering!’,kids:‘YouTube: Upload → transcode to multiple qualities (360p, 720p, 1080p, 4K) in PARALLEL on many servers → store in distributed storage → push to CDN worldwide. When watching: nearest CDN serves you. Adaptive bitrate switches quality based on your connection speed!’},fact:‘📺 YouTube processes 500 HOURS of video every MINUTE! Transcoding runs in parallel across thousands of servers!’},
diag:{title:‘YouTube Architecture!’,nodes:[{icon:‘📤’,text:‘Upload video!’,tip:‘Raw video uploaded to YouTube's origin servers.’},{icon:‘🎬’,text:‘Transcode to many qualities!’,tip:‘360p, 720p, 1080p, 4K all created simultaneously in parallel. Takes minutes!’},{icon:‘🌍’,text:‘CDN distributes worldwide!’,tip:‘All versions pushed to CDN. Tokyo user served from Tokyo server. Fast!’}]},
quiz:[{q:‘Why does YouTube convert to MULTIPLE qualities?’,opts:[‘Waste storage’,‘Best quality for each user's internet speed!’,‘For fun’,‘Bigger files’],ans:1,expl:‘Adaptive bitrate! Slow internet? 360p. Fast fiber? 4K. Always smooth!’},{q:‘How does YouTube serve Japan users fast?’,opts:[‘From US servers only’,‘CDN edges in Asia cache the video!’,‘Users download first’,‘Magic’],ans:1,expl:‘CDN! Popular videos cached at CDN edges near Japan. No round-trip to USA!’},{q:‘YouTube transcodes using…?’,opts:[‘One powerful server’,‘Many servers working in PARALLEL!’,‘Your computer’,‘Manually’],ans:1,expl:‘Parallel transcoding! Hundreds of servers simultaneously create all quality versions!’}]},
{id:‘8.7’,emoji:‘💬’,title:‘Walkie-Talkie for Billions!’,sub:‘WhatsApp Architecture’,game:‘taco’,story:{scene:‘💬’,parts:[‘💬’,‘🔒’,‘⚡’,‘🌍’],mascot:‘Builder Bob 👷’,text:{toddler:‘WhatsApp sends your message to the OTHER SIDE OF THE WORLD in 1 second! And NOBODY can read it (not even WhatsApp!) because it's in SECRET CODE! 🔒 How? 1) Walkie-talkie connection stays open ⚡ 2) Message gets secret-coded 🔒 3) Fast servers worldwide 4) Delivered instantly!’,kids:‘WhatsApp: Client connects via persistent WebSocket. End-to-End Encryption (E2EE): only sender and receiver can decrypt — not even WhatsApp! Recipient offline? Message queued! Delivered when they reconnect. Erlang language powers their servers. 2 billion users, just 50 engineers at $19B acquisition!’},fact:‘💬 WhatsApp had only 50 engineers when Facebook bought it for $19B — serving 450 million users. Incredible efficiency!’},
