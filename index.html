.nbl{font-size:9px;font-weight:900;color:var(--muted);font-family:'Nunito',sans-serif}
.nb.on .nbl{color:#6c63ff}.nb.on .nbi{transform:scale(1.18)}
.movl{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.movl.open{opacity:1;pointer-events:all}
.msh{background:white;border-radius:24px 24px 0 0;padding:17px 17px 36px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.movl.open .msh{transform:translateY(0)}
.mpill{width:38px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 15px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.cf{position:absolute;border-radius:3px;animation:cff 3s ease-in forwards}
@keyframes cff{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:white;border-radius:17px;padding:8px 17px;font-weight:800;font-size:13px;z-index:400;opacity:0;transition:all .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="v-map" class="view active">
    <div class="topbar">
      <div class="logo"><span>🚀</span>Galaxy!</div>
      <div class="pills">
        <div class="pill pr">🔥 <span id="st-streak">1</span></div>
        <div class="pill pg">⭐ <span id="st-xp">0</span></div>
      </div>
    </div>
    <div class="modebar">
      <button class="mc on" onclick="setMode('toddler')">🧸 Toddler</button>
      <button class="mc" onclick="setMode('kids')">🎒 Kids</button>
    </div>
    <div class="hero">
      <h1>System Design<br>Galaxy! 🌌</h1>
      <p>Learn how computers work — one adventure at a time!</p>
      <div class="hero-em">🚀</div>
    </div>
    <div class="xpw">
      <div class="xpt">
        <div class="xplv" id="level-name">🥚 Egg</div>
        <div class="xpn"><span id="xp-cur">0</span> / <span id="xp-nxt">100</span> XP</div>
      </div>
      <div class="xpbar"><div class="xpfill" id="xp-bar" style="width:0%"></div></div>
    </div>
    <button class="daily" onclick="openDaily()">
      <div style="font-size:34px">🧩</div>
      <div><h3>Today's Challenge!</h3><p>Tap to test your brain! +100 XP ⚡</p></div>
      <div style="font-size:19px;color:rgba(255,255,255,.7);margin-left:auto">›</div>
    </button>
    <div class="sec">🌍 Pick a World!</div>
    <div class="wgrid" id="worlds-grid"></div>
    <div style="height:14px"></div>
  </div>
  <div id="v-world" class="view">
    <div class="bakrow" onclick="nav('map')"><div class="bakc">←</div>Back to Map</div>
    <div class="whero" id="wh-card">
      <div style="font-size:60px" id="wh-emoji"></div>
      <h2 id="wh-title"></h2><p id="wh-desc"></p>
      <div class="msay" id="wh-mascot"></div>
    </div>
    <div class="sec" id="wh-ltitle">Lessons</div>
    <div class="llist" id="lessons-list"></div>
    <div style="height:14px"></div>
  </div>
  <div id="v-lesson" class="view">
    <div class="ltop">
      <div class="bakc" onclick="nav('world')">←</div>
      <div class="ltinf"><div class="ltit" id="ll-title"></div><div class="ltsb" id="ll-sub"></div></div>
    </div>
    <div class="strk" id="step-track"></div>
    <div class="lbody" id="lesson-body"></div>
  </div>
  <div id="v-wins" class="view">
    <div class="topbar"><div class="logo"><span>🏆</span>My Wins!</div></div>
    <div class="sgrd">
      <div class="stl"><div class="stn" id="ws-lessons" style="color:#6c63ff">0</div><div class="stt">Lessons Done</div></div>
      <div class="stl"><div class="stn" id="ws-stars" style="color:#fbbf24">0</div><div class="stt">Stars Earned</div></div>
      <div class="stl"><div class="stn" id="ws-streak" style="color:#f97316">1</div><div class="stt">Day Streak 🔥</div></div>
      <div class="stl"><div class="stn" id="ws-worlds" style="color:#10b981">0</div><div class="stt">Worlds Done</div></div>
    </div>
    <div class="sec">🏅 Badges</div>
    <div class="bgrd" id="badges-grid"></div>
  </div>
  <div id="v-profile" class="view">
    <div class="topbar"><div class="logo"><span>👤</span>My Space!</div></div>
    <div class="para">
      <div class="aring" id="prof-av">🚀</div>
      <div class="pnm">Space Learner</div>
      <div class="plv" id="prof-lvl">🥚 Egg · Level 1</div>
    </div>
    <div class="pcrds" id="prof-cards"></div>
    <div style="height:14px"></div>
  </div>
</div>
<nav class="bnav">
  <button class="nb on" id="nb-map" onclick="nav('map')"><span class="nbi">🗺️</span><span class="nbl">Map</span></button>
  <button class="nb" id="nb-wins" onclick="nav('wins')"><span class="nbi">🏆</span><span class="nbl">Wins</span></button>
  <button class="nb" id="nb-profile" onclick="nav('profile')"><span class="nbi">👤</span><span class="nbl">Me</span></button>
</nav>
<div class="movl" id="daily-modal"><div class="msh"><div class="mpill"></div><div id="daily-body"></div></div></div>
<div id="confetti"></div>
<div id="toast"></div>
<script>
// ── State ──
const S={mode:'toddler',xp:+localStorage.getItem('sdg_xp')||0,streak:+localStorage.getItem('sdg_str')||1,done:JSON.parse(localStorage.getItem('sdg_done')||'[]'),bdgs:JSON.parse(localStorage.getItem('sdg_bdgs')||'[]'),curWorld:null,curLesson:null,step:0,qScore:0,qIdx:0};
const save=()=>{localStorage.setItem('sdg_xp',S.xp);localStorage.setItem('sdg_str',S.streak);localStorage.setItem('sdg_done',JSON.stringify(S.done));localStorage.setItem('sdg_bdgs',JSON.stringify(S.bdgs))};
const FOODS=['🌮','🍕','🍔','🌯','🍣','🥗','🍜','🥪'];
const CITEMS=['🍪','🍕','🌮','🍔','🍣','🥗'];
const MAILS=[{e:'📧',l:'Order'},{e:'🔔',l:'Notif'},{e:'📦',l:'Ship'},{e:'💳',l:'Pay'},{e:'📊',l:'Stats'}];
const ROBOTS=[{e:'👨‍🍳',r:'Chef'},{e:'📬',r:'Mailer'},{e:'🛡️',r:'Guard'},{e:'💾',r:'Storage'},{e:'🔍',r:'Search'},{e:'📊',r:'Stats'}];
const LVLS=[{n:'🥚 Egg',x:0},{n:'🐣 Hatchling',x:100},{n:'🐥 Chick',x:250},{n:'🐦 Bird',x:500},{n:'🦅 Eagle',x:900},{n:'🚀 Astronaut',x:1500},{n:'⭐ Star',x:2500},{n:'🌌 Galaxy Brain',x:4000}];
const getLevel=x=>{let l=LVLS[0];for(const v of LVLS)if(x>=v.x)l=v;return l};
const getNext=x=>{for(const v of LVLS)if(x<v.x)return v;return{n:'👑 Legend',x:99999}};
let tipOpen=-1,GS={},dragIdx=null;

// ── Mode ──
function setMode(m){S.mode=m;document.querySelectorAll(’.mc’).forEach(b=>b.classList.remove(‘on’));document.querySelector(`.mc[onclick="setMode('${m}')"]`).classList.add(‘on’)}

// ── Nav ──
function nav(v){
if(v===‘wins’)renderWins();if(v===‘profile’)renderProfile();if(v===‘map’)renderMap();
document.querySelectorAll(’.view’).forEach(e=>e.classList.remove(‘active’));
document.querySelectorAll(’.nb’).forEach(e=>e.classList.remove(‘on’));
document.getElementById(‘v-’+v).classList.add(‘active’);
const nb=document.getElementById(‘nb-’+v);if(nb)nb.classList.add(‘on’);
window.scrollTo(0,0);
}

// ── XP ──
function updateXP(){
const x=S.xp,l=getLevel(x),nl=getNext(x);
const pct=Math.min(100,((x-l.x)/(nl.x-l.x))*100);
document.getElementById(‘st-xp’).textContent=x;
document.getElementById(‘st-streak’).textContent=S.streak;
document.getElementById(‘xp-cur’).textContent=x;
document.getElementById(‘xp-nxt’).textContent=nl.x;
document.getElementById(‘level-name’).textContent=l.n;
document.getElementById(‘xp-bar’).style.width=pct+’%’;
}
function addXP(n){S.xp+=n;updateXP();save();showToast(’+’+n+’ XP ⭐’)}

// ── Map ──
function renderMap(){
const g=document.getElementById(‘worlds-grid’);g.innerHTML=’’;
W.forEach(w=>{
const done=w.lessons.filter(l=>S.done.includes(l.id)).length,total=w.lessons.length,full=done===total;
const dots=w.lessons.map(l=>`<div class="wdot ${S.done.includes(l.id)?'done':''}"></div>`).join(’’);
const c=document.createElement(‘div’);c.className=`wcard ${w.cls}`;
c.innerHTML=`<span class="wpl">${w.emoji}</span><div class="wnm">${w.name}</div><div class="wsb">${w.sub}</div><div class="wpr"><div class="wdts">${dots}</div><span class="wct">${done}/${total}</span></div>${full?'<div class="wbg">✅</div>':''}`;
c.onclick=()=>openWorld(w);g.appendChild(c);
});
updateXP();
}

// ── World ──
function openWorld(w){
S.curWorld=w;
const card=document.getElementById(‘wh-card’);
card.className=`whero ${w.cls}`;card.style.borderColor=w.col;card.style.background=w.lcol;
document.getElementById(‘wh-emoji’).textContent=w.emoji;
document.getElementById(‘wh-title’).textContent=w.name;
document.getElementById(‘wh-desc’).textContent=w.desc;
document.getElementById(‘wh-mascot’).textContent=‘💬 ‘+w.say;
document.getElementById(‘wh-ltitle’).textContent=w.emoji+’ Lessons’;
const list=document.getElementById(‘lessons-list’);list.innerHTML=’’;
w.lessons.forEach(l=>{
const done=S.done.includes(l.id);
const row=document.createElement(‘div’);row.className=`lrow ${done?'done':''}`;
row.innerHTML=`<div class="lic" style="background:${w.lcol};border-color:${w.col}">${done?'✅':l.emoji}</div><div class="ltt"><div class="ltl">${l.title}</div><div class="lts">${l.sub}</div></div><div class="lri">${done?'⭐⭐⭐':'▶️'}</div>`;
row.onclick=()=>openLesson(l,w);list.appendChild(row);
});
nav(‘world’);
}

// ── Lesson ──
function openLesson(l,w){S.curLesson=l;S.curWorld=w;S.step=0;S.qScore=0;S.qIdx=0;document.getElementById(‘ll-title’).textContent=l.title;document.getElementById(‘ll-sub’).textContent=w.name+’ · ’+l.sub;renderStep();nav(‘lesson’)}

function renderStep(){
const l=S.curLesson,s=S.step;tipOpen=-1;
document.getElementById(‘step-track’).innerHTML=[‘📖’,‘🎨’,‘🎮’,‘❓’].map((_,i)=>`<div class="spip ${i<s?'dn':i===s?'act':''}"></div>`).join(’’);
const body=document.getElementById(‘lesson-body’);
if(s===0)body.innerHTML=buildStory(l);
else if(s===1)body.innerHTML=buildDiagram(l);
else if(s===2){body.innerHTML=buildGame(l);initGame(l)}
else body.innerHTML=buildQuiz(l,0);
}

// ── Story ──
function buildStory(l){
const s=l.story,txt=s.text[S.mode]||s.text.toddler,w=S.curWorld;
const fl=s.parts.map((p,i)=>`<span class="flt" style="top:${15+i*20}%;left:${8+i*22}%;animation-delay:${i*.6}s">${p}</span>`).join(’’);
return `<div class="scard"><div class="sscene" style="background:linear-gradient(135deg,${w.col}33,${w.col}11)">${fl}<div class="smain">${s.scene}</div></div><div class="sbdy"><div class="mrow"><div class="mav">${s.mascot.split(' ').pop()}</div><div class="mnm">${s.mascot} says:</div></div><div class="stxt">${txt}</div><div class="sfct">💡 <span>${s.fact}</span></div></div></div><button class="bbtn pur" onclick="S.step=1;renderStep()">Explore the Diagram! 🎨 →</button>`;
}

// ── Diagram ──
function buildDiagram(l){
const d=l.diag;
const nodes=d.nodes.map((n,i)=>`<div class="dnd" id="dn${i}" onclick="showTip(${i},${d.nodes.length})"><div class="dico">${n.icon}</div><div class="dtxt">${n.text}</div></div><div class="dtip" id="dt${i}">${n.tip}</div>${i<d.nodes.length-1?'<div class="darr">↓</div>':''}`).join(’’);
return `<div class="dcard"><div class="dtit">${d.title}</div>${nodes}<div class="dhnt">👆 Tap each box to learn more!</div></div><button class="bbtn pur" onclick="S.step=2;renderStep()">Play the Game! 🎮 →</button>`;
}
function showTip(i,total){if(tipOpen===i){document.getElementById(‘dt’+i)?.classList.remove(‘show’);document.getElementById(‘dn’+i)?.classList.remove(‘lit’);tipOpen=-1;}else{if(tipOpen>=0){document.getElementById(‘dt’+tipOpen)?.classList.remove(‘show’);document.getElementById(‘dn’+tipOpen)?.classList.remove(‘lit’)}document.getElementById(‘dt’+i)?.classList.add(‘show’);document.getElementById(‘dn’+i)?.classList.add(‘lit’);tipOpen=i}}

// ── Games ──
function buildGame(l){const g=l.game,w=S.curWorld;if(g===‘bee’)return buildBee(w);if(g===‘cache’)return buildCache(w);if(g===‘mail’)return buildMail(w);if(g===‘robot’)return buildRobot(w);return buildTaco(w)}
function initGame(l){const g=l.game;if(g===‘bee’)initBee();else if(g===‘cache’)initCache();else if(g===‘mail’)initMail();else if(g===‘robot’)initRobot();else initTaco()}
function unlockNext(){const nb=document.getElementById(‘game-next’);if(nb)nb.classList.remove(‘dis’)}

// Taco
function buildTaco(w){return `<div class="gcard"><div class="gtit">${S.curLesson.emoji} Send the Requests!</div><div class="gsb">Tap SEND to deliver orders to the server! Fill the bar!</div><div class="scrow"><div class="scbx"><div class="scn" id="tg-sc" style="color:${w.col}">0</div><div class="scl">Sent ✅</div></div><div class="scbx"><div class="scn" style="color:var(--green)">5</div><div class="scl">Goal 🎯</div></div></div><div class="olist" id="olist"></div><div class="ptrk"><div class="pfl" id="tg-pg" style="width:0%"></div></div></div><button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>`}
function initTaco(){GS={s:0,t:5};spawnO();spawnO();spawnO()}
function spawnO(){const l=document.getElementById(‘olist’);if(!l||l.children.length>=3)return;const f=FOODS[Math.floor(Math.random()*FOODS.length)],w=S.curWorld;const d=document.createElement(‘div’);d.className=‘orow’;d.innerHTML=`<span style="font-size:24px">${f}</span><span>Order for ${f}!</span><button class="sbtn" style="background:${w.col};box-shadow:0 3px 0 ${w.bdcol}" onclick="sendO(this)">SEND ⚡</button>`;l.appendChild(d)}
function sendO(btn){const row=btn.closest(’.orow’);row.style.cssText=‘opacity:.4;transform:translateX(28px);transition:all .3s’;btn.disabled=true;btn.textContent=‘✅’;GS.s++;const pct=Math.min(100,(GS.s/GS.t)*100);document.getElementById(‘tg-sc’).textContent=GS.s;document.getElementById(‘tg-pg’).style.width=pct+’%’;setTimeout(()=>{row.remove();spawnO()},500);if(GS.s>=GS.t){unlockNext();showToast(‘🎉 Great job! Quiz time!’)}}

// Bee
function buildBee(w){const lanes=[0,1,2].map(i=>`<div class="bln" onclick="dirBee(${i})"><div class="blnm">🌺 Server ${i+1}</div><div class="blc" style="color:${w.col}" id="bc${i}">0</div><div class="blf" id="bf${i}">😊</div><div class="blb"><div class="blbf" id="bh${i}" style="width:100%"></div></div></div>`).join(’’);return `<div class="gcard"><div class="gtit">🐝 Buzz Balancer!</div><div class="gsb">Tap servers to redirect incoming bees!</div><div class="scrow"><div class="scbx"><div class="scn" id="bg-sc" style="color:${w.col}">0</div><div class="scl">Balanced 🐝</div></div><div class="scbx"><div class="scn" id="bg-ov" style="color:var(--red)">0</div><div class="scl">Overflow 😱</div></div></div><div class="blns">${lanes}</div><div style="text-align:center;font-weight:800;font-size:12px;color:var(--muted)">Keep each server under 5 bees!</div></div><button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>`}
function initBee(){GS={lanes:[0,0,0],s:0,ov:0,t:10,iv:null};GS.iv=setInterval(()=>{if(!document.getElementById(‘bc0’)){clearInterval(GS.iv);return}const mx=Math.max(…GS.lanes);if(mx>=5){GS.ov++;GS.lanes[GS.lanes.indexOf(mx)]=Math.max(0,GS.lanes[GS.lanes.indexOf(mx)]-1);updBees();const e=document.getElementById(‘bg-ov’);if(e)e.textContent=GS.ov}},1800)}
function dirBee(i){GS.lanes[i]++;GS.s++;const e=document.getElementById(‘bg-sc’);if(e)e.textContent=GS.s;updBees();setTimeout(()=>{GS.lanes[i]=Math.max(0,GS.lanes[i]-1);updBees()},1100);if(GS.s>=GS.t){clearInterval(GS.iv);unlockNext();showToast(‘🐝 Great balancing!’)}}
function updBees(){for(let i=0;i<3;i++){const c=GS.lanes[i];const bc=document.getElementById(‘bc’+i),bh=document.getElementById(‘bh’+i),bf=document.getElementById(‘bf’+i);if(bc)bc.textContent=c;if(bh){const p=Math.max(0,100-c*20);bh.style.width=p+’%’;bh.style.background=p<40?‘var(–red)’:‘var(–green)’}if(bf)bf.textContent=c>=5?‘😫’:c>=3?‘😅’:‘😊’}}

// Cache
function buildCache(w){const slots=Array(6).fill(0).map((_,i)=>`<div class="cslt" id="cs${i}" onclick="fillSlot(${i})"><div class="csic">📭</div><div>Empty</div></div>`).join(’’);return `<div class="gcard"><div class="gtit">🍪 Cookie Cache!</div><div class="gsb">Tap slots to fill your cache — more hits = faster!</div><div class="scrow"><div class="scbx"><div class="scn" id="ch-ht" style="color:var(--green)">0</div><div class="scl">Hits ⚡</div></div><div class="scbx"><div class="scn" id="ch-ms" style="color:var(--red)">0</div><div class="scl">Miss 🐌</div></div></div><div style="font-weight:900;font-size:13px;margin-bottom:7px">Your Cache Counter (tap to fill!):</div><div class="cslts">${slots}</div><div class="rqbx" id="cache-req">Waiting for a customer... 👀</div></div><button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>`}
function initCache(){GS={cache:Array(6).fill(null),hits:0,miss:0,total:0,t:8,iv:null};GS.iv=setInterval(makeReq,2200);setTimeout(makeReq,400)}
function fillSlot(i){const item=CITEMS[Math.floor(Math.random()*CITEMS.length)];GS.cache[i]=item;const el=document.getElementById(‘cs’+i);if(el){el.className=‘cslt full’;el.innerHTML=`<div class="csic">${item}</div><div>Cached!</div>`}}
function makeReq(){if(!document.getElementById(‘cache-req’)){clearInterval(GS.iv);return}const want=CITEMS[Math.floor(Math.random()*CITEMS.length)];document.getElementById(‘cache-req’).textContent=`🤔 Customer wants: ${want}`;setTimeout(()=>{if(!document.getElementById(‘cache-req’)){clearInterval(GS.iv);return}const hit=GS.cache.includes(want);GS.total++;if(hit){GS.hits++;const e=document.getElementById(‘ch-ht’);if(e)e.textContent=GS.hits;showToast(‘⚡ Cache HIT!’)}else{GS.miss++;const e=document.getElementById(‘ch-ms’);if(e)e.textContent=GS.miss;showToast(‘🐌 Cache MISS!’)}if(GS.total>=GS.t){clearInterval(GS.iv);unlockNext()}},700)}

// Mail
function buildMail(w){const chips=MAILS.map((m,i)=>`<div class="mchp" draggable="true" id="mc${i}" ondragstart="dragIdx=${i}">${m.e} ${m.l}</div>`).join(’’);return `<div class="gcard"><div class="gtit">📬 Queue Manager!</div><div class="gsb">Drag mail to the queue, then process it!</div><div class="scrow"><div class="scbx"><div class="scn" id="mg-pr" style="color:var(--green)">0</div><div class="scl">Processed ✅</div></div><div class="scbx"><div class="scn" id="mg-q" style="color:${w.col}">0</div><div class="scl">In Queue 📥</div></div></div><div class="minc">${chips}</div><div class="dropz" id="dropz" ondragover="event.preventDefault();this.classList.add('over')" ondrop="dropMail(event)"><span style="color:var(--muted);font-size:12px;font-weight:800;margin:auto">📥 Drop mail here!</span></div><button class="pbtn" onclick="processQ()">⚡ Process Queue!</button></div><button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>`}
function initMail(){GS={q:0,proc:0,t:3}}
function dropMail(e){e.preventDefault();const dz=document.getElementById(‘dropz’);if(!dz)return;dz.classList.remove(‘over’);if(dragIdx===null)return;const m=MAILS[dragIdx];const orig=document.getElementById(‘mc’+dragIdx);if(orig)orig.style.opacity=’.3’;const chip=document.createElement(‘div’);chip.className=‘mchp’;chip.textContent=m.e+’ ‘+m.l;dz.appendChild(chip);GS.q=(GS.q||0)+1;const el=document.getElementById(‘mg-q’);if(el)el.textContent=GS.q;dragIdx=null}
function processQ(){const dz=document.getElementById(‘dropz’);if(!dz)return;const chips=[…dz.querySelectorAll(’.mchp’)];if(!chips.length){showToast(‘Add mail to the queue first!’);return}chips.forEach((c,i)=>{setTimeout(()=>{c.style.background=’#d1fae5’;c.style.borderColor=‘var(–green)’;c.textContent=’✅ ’+c.textContent;setTimeout(()=>c.remove(),700)},i*300)});GS.proc=(GS.proc||0)+chips.length;const el=document.getElementById(‘mg-pr’);if(el)el.textContent=GS.proc;showToast(`⚡ Processed ${chips.length} messages!`);if(GS.proc>=GS.t)unlockNext()}

// Robot
function buildRobot(w){const tiles=ROBOTS.map((r,i)=>`<div class="rtl" id="rt${i}" onclick="togRobot(${i})"><span class="rem">${r.e}</span><div class="rrl">${r.r}</div><div class="rst" id="rs${i}" style="color:var(--muted)">OFFLINE</div></div>`).join(’’);return `<div class="gcard"><div class="gtit">🤖 Build Robot Town!</div><div class="gsb">Tap robots to activate them! Get at least 4 online!</div><div class="scrow"><div class="scbx"><div class="scn" id="rg-on" style="color:var(--green)">0</div><div class="scl">Online 🟢</div></div><div class="scbx"><div class="scn" id="rg-hp" style="color:${w.col}">0%</div><div class="scl">Health 💪</div></div></div><div class="rgrd">${tiles}</div><div style="text-align:center;font-size:12px;font-weight:800;color:var(--muted)" id="rg-msg">Tap robots to activate! 🤖</div></div><button class="bbtn pur dis" id="game-next" onclick="S.step=3;renderStep()">Take the Quiz! ❓ →</button>`}
function initRobot(){GS={on:0,t:4,done:false}}
function togRobot(i){const tile=document.getElementById(‘rt’+i),st=document.getElementById(‘rs’+i);if(!tile||!st)return;if(tile.classList.contains(‘on’)){tile.classList.remove(‘on’);tile.classList.add(‘brk’);st.textContent=‘🔴 DOWN’;st.style.color=‘var(–red)’;GS.on=Math.max(0,GS.on-1)}else if(tile.classList.contains(‘brk’)){tile.classList.remove(‘brk’);st.textContent=‘OFFLINE’;st.style.color=‘var(–muted)’}else{tile.classList.add(‘on’);st.textContent=‘🟢 ONLINE’;st.style.color=‘var(–green)’;GS.on++}document.getElementById(‘rg-on’).textContent=GS.on;document.getElementById(‘rg-hp’).textContent=Math.round((GS.on/6)*100)+’%’;if(GS.on>=GS.t&&!GS.done){GS.done=true;const m=document.getElementById(‘rg-msg’);if(m){m.textContent=‘🤖 Robot Town running!’;m.style.color=‘var(–green)’}unlockNext();showToast(‘🤖 Robot Town is alive!’)}}

// ── Quiz ──
function buildQuiz(l,qi){
const q=l.quiz[qi],total=l.quiz.length,letters=[‘A’,‘B’,‘C’,‘D’];
const opts=q.opts.map((o,i)=>`<div class="qopt" id="qo${i}" onclick="pickAns(${i},${q.ans},${qi})"><div class="qltr">${letters[i]}</div>${o}</div>`).join(’’);
return `<div class="qcard"><div class="qqn">Question ${qi+1} of ${total}</div><div class="qq">${q.q}</div><div class="qopts">${opts}</div><div class="qfb" id="qfb"></div></div><button class="bbtn pur" id="qnext" onclick="nextQ(${qi},${total})" style="display:none">${qi<total-1?'Next Question →':'🎉 Finish Lesson!'}</button>`;
}
function pickAns(chosen,correct,qi){
if(document.getElementById(‘qo’+chosen)?.classList.contains(‘off’))return;
const expl=S.curLesson.quiz[qi].expl;
document.querySelectorAll(’.qopt’).forEach((o,i)=>{o.classList.add(‘off’);if(i===correct)o.classList.add(‘right’);else if(i===chosen&&chosen!==correct)o.classList.add(‘wrong’)});
const fb=document.getElementById(‘qfb’);
if(chosen===correct){fb.className=‘qfb right’;fb.textContent=‘🎉 ‘+expl;S.qScore++;addXP(10)}
else{fb.className=‘qfb wrong’;fb.textContent=‘💡 ‘+expl}
document.getElementById(‘qnext’).style.display=‘flex’;
}
function nextQ(cur,total){if(cur<total-1)document.getElementById(‘lesson-body’).innerHTML=buildQuiz(S.curLesson,cur+1);else completeLesson()}
function completeLesson(){
const l=S.curLesson;
if(!S.done.includes(l.id)){S.done.push(l.id);addXP(50);checkBadges();save()}
const stars=S.qScore>=3?‘⭐⭐⭐’:S.qScore>=2?‘⭐⭐’:‘⭐’;
document.getElementById(‘lesson-body’).innerHTML=`<div class="comp"><div class="cstars">${stars}</div><div class="ctit">Amazing! 🎉</div><div class="csub">You finished "${l.title}"!</div><div class="cxp">+50 XP ⭐</div><button class="bbtn grn" onclick="openWorld(S.curWorld)">Back to Lessons 🏡</button><button class="bbtn gho" onclick="nav('map')" style="margin-top:8px">🗺️ Galaxy Map</button></div>`;
document.getElementById(‘step-track’).innerHTML=[‘📖’,‘🎨’,‘🎮’,‘❓’].map(()=>’<div class="spip dn"></div>’).join(’’);
confetti();save();
}

function confetti(){const el=document.getElementById(‘confetti’),cols=[’#ff6b6b’,’#4ecdc4’,’#ffd93d’,’#6bcb77’,’#ff9f43’,’#a29bfe’,’#74b9ff’,’#fd79a8’];for(let i=0;i<42;i++){const p=document.createElement(‘div’);p.className=‘cf’;p.style.cssText=`left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};width:${6+Math.random()*9}px;height:${6+Math.random()*9}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-delay:${Math.random()}s;animation-duration:${2+Math.random()*2}s`;el.appendChild(p);setTimeout(()=>p.remove(),4000)}}
