<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚀 System Design Galaxy</title>
<style>
html,body{margin:0;padding:0;background:#fff8f0;color:#1a1a2e;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding-bottom:80px}

/* ── VIEWS ── */
.view{display:none}
.view.active{display:block}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;background:#fff8f0;position:sticky;top:0;z-index:90;border-bottom:2px solid #f0e8d8}
.logo{font-size:20px;font-weight:900;color:#1a1a2e}
.pills{display:flex;gap:8px}
.pill{border:2px solid;border-radius:30px;padding:5px 12px;font-weight:900;font-size:13px}
.pg{background:#fffbeb;border-color:#f59e0b;color:#92400e}
.pr{background:#fff1f2;border-color:#f87171;color:#b91c1c}

/* ── MODE BAR ── */
.modebar{display:flex;gap:8px;padding:10px 18px}
.mc{flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:16px;background:#fff;font-size:14px;font-weight:800;cursor:pointer;color:#6b7280;box-shadow:0 3px 0 #e5e7eb;transition:all .2s}
.mc.on{background:#22c55e;border-color:#16a34a;color:#fff;box-shadow:0 3px 0 #15803d}

/* ── HERO BANNER ── */
.hero{margin:0 18px 16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:22px;padding:22px 20px;position:relative;overflow:hidden;box-shadow:0 6px 0 #4338ca}
.hero h1{font-size:24px;font-weight:900;color:#fff;line-height:1.2;margin:0}
.hero p{color:rgba(255,255,255,.85);font-size:13px;font-weight:700;margin:5px 0 0}
.hero-rocket{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:52px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 8px))}}

/* ── XP BAR ── */
.xpw{margin:0 18px 14px;background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 #e5e7eb}
.xpt{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:13px;font-weight:800}
.xplv{color:#1a1a2e}
.xpn{color:#6b7280}
.xpbar{height:14px;background:#f3f4f6;border-radius:14px;overflow:hidden;border:2px solid #e5e7eb}
.xpfill{height:100%;border-radius:14px;background:linear-gradient(90deg,#f59e0b,#ef4444);transition:width .7s ease}

/* ── DAILY CARD ── */
.daily{margin:0 18px 18px;background:linear-gradient(135deg,#f97316,#fbbf24);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:none;width:100%;text-align:left;box-shadow:0 5px 0 #c2410c;transition:transform .1s,box-shadow .1s}
.daily:active{transform:translateY(3px);box-shadow:0 2px 0 #c2410c}
.daily h3{font-size:16px;font-weight:900;color:#fff;margin:0}
.daily p{font-size:12px;color:rgba(255,255,255,.9);margin:2px 0 0;font-weight:700}

/* ── SECTION TITLE ── */
.sec{font-size:18px;font-weight:900;padding:0 18px 10px;color:#1a1a2e}

/* ── WORLDS GRID ── */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px}
.wcard{border-radius:20px;padding:16px 14px 14px;cursor:pointer;border:3px solid;display:flex;flex-direction:column;gap:6px;min-height:160px;position:relative;transition:transform .15s,box-shadow .15s}
.wcard:hover{transform:translateY(-3px)}
.wcard:active{transform:scale(.97)}

/* World colour themes */
.wc1{background:#fff0f0;border-color:#ff6b6b;box-shadow:0 5px 0 #cc4444}.wc1:hover{box-shadow:0 9px 0 #cc4444}
.wc2{background:#e8fffe;border-color:#4ecdc4;box-shadow:0 5px 0 #2ba89f}.wc2:hover{box-shadow:0 9px 0 #2ba89f}
.wc3{background:#fffce8;border-color:#ffd93d;box-shadow:0 5px 0 #c9a800}.wc3:hover{box-shadow:0 9px 0 #c9a800}
.wc4{background:#edfff0;border-color:#6bcb77;box-shadow:0 5px 0 #3d9b4a}.wc4:hover{box-shadow:0 9px 0 #3d9b4a}
.wc5{background:#fff4e8;border-color:#ff9f43;box-shadow:0 5px 0 #cc6f00}.wc5:hover{box-shadow:0 9px 0 #cc6f00}
.wc6{background:#f3f0ff;border-color:#a29bfe;box-shadow:0 5px 0 #6c5ce7}.wc6:hover{box-shadow:0 9px 0 #6c5ce7}
.wc7{background:#eef6ff;border-color:#74b9ff;box-shadow:0 5px 0 #2980b9}.wc7:hover{box-shadow:0 9px 0 #2980b9}
.wc8{background:#fff0f6;border-color:#fd79a8;box-shadow:0 5px 0 #c0306a}.wc8:hover{box-shadow:0 9px 0 #c0306a}

.wpl{font-size:42px;display:block;animation:wobble 4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.wnm{font-size:14px;font-weight:900;line-height:1.2;color:#1a1a2e}
.wsb{font-size:10px;font-weight:800;color:#6b7280}
.wpr{display:flex;align-items:center;gap:6px;margin-top:4px}
.wdts{display:flex;gap:3px;flex-wrap:wrap}
.wdot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.15)}
.wdot.done{background:#22c55e}
.wct{font-size:10px;font-weight:900;color:#6b7280}
.wbg{position:absolute;top:10px;right:10px;font-size:16px}

/* ── BACK BUTTON ── */
.bakrow{display:flex;align-items:center;gap:8px;padding:12px 18px 6px;cursor:pointer;font-weight:800;font-size:14px;color:#6b7280}
.bakrow:hover{color:#1a1a2e}
.bakc{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 0 #e5e7eb;flex-shrink:0}

/* ── WORLD HERO ── */
.whero{margin:0 18px 14px;border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:3px solid}
.whero h2{font-size:22px;font-weight:900;margin:0}
.whero p{font-size:13px;font-weight:700;color:#6b7280;margin:0;max-width:260px}
.msay{background:rgba(255,255,255,.8);border:2px solid rgba(0,0,0,.08);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700}

/* ── LESSON LIST ── */
.llist{display:flex;flex-direction:column;gap:10px;padding:0 18px}
.lrow{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 3px 0 #e5e7eb;transition:transform .15s,box-shadow .15s}
.lrow:hover{transform:translateY(-2px);box-shadow:0 5px 0 #e5e7eb}
.lrow:active{transform:translateY(1px);box-shadow:0 1px 0 #e5e7eb}
.lrow.done{border-color:#86efac;background:#f0fdf4}
.lic{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(0,0,0,.08)}
.ltt{flex:1}
.ltl{font-weight:900;font-size:14px;line-height:1.2;color:#1a1a2e}
.lts{font-size:11px;font-weight:700;color:#6b7280;margin-top:2px}
.lri{font-size:16px;flex-shrink:0}

/* ── LESSON VIEWER ── */
.ltop{display:flex;align-items:center;gap:10px;padding:12px 18px 4px}
.ltit{font-size:15px;font-weight:900;color:#1a1a2e}
.ltsb{font-size:11px;font-weight:700;color:#6b7280}
.strk{display:flex;gap:5px;padding:8px 18px 12px}
.spip{flex:1;height:8px;border-radius:8px;background:#e5e7eb;transition:background .3s}
.spip.act{background:#8b5cf6}
.spip.dn{background:#22c55e}
.lbody{padding:0 18px}

/* ── STORY CARD ── */
.scard{background:#fff;border:3px solid #e5e7eb;border-radius:24px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.sscene{min-height:180px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.smain{font-size:80px;position:relative;z-index:2;animation:scenebounce 2.5s ease-in-out infinite}
@keyframes scenebounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}
.flt{position:absolute;font-size:20px;animation:fltmove 3s ease-in-out infinite}
@keyframes fltmove{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(12deg)}}
.sbdy{padding:16px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #e5e7eb;background:#f9fafb;flex-shrink:0}
.mnm{font-size:12px;font-weight:800;color:#6b7280}
.stxt{font-size:15px;font-weight:700;line-height:1.7;color:#1a1a2e}
.sfct{margin-top:12px;background:#fffbeb;border:2px solid #fde68a;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;color:#92400e;display:flex;gap:8px}

/* ── DIAGRAM CARD ── */
.dcard{background:#fff;border:3px solid #e5e7eb;border-radius:24px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.dtit{font-size:17px;font-weight:900;text-align:center;margin-bottom:12px;color:#1a1a2e}
.dnd{background:#f9fafb;border:2px solid #e5e7eb;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;margin-bottom:4px}
.dnd:hover,.dnd.lit{border-color:#8b5cf6;background:#f3f0ff;transform:scale(1.02)}
.dico{font-size:26px;flex-shrink:0}
.dtxt{font-size:13px;font-weight:800;color:#1a1a2e}
.darr{text-align:center;font-size:20px;color:#8b5cf6;margin:2px 0;animation:dab 1.2s ease-in-out infinite}
@keyframes dab{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.dtip{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;line-height:1.5;margin-bottom:4px;display:none}
.dtip.show{display:block}
.dhnt{text-align:center;color:#6b7280;font-size:12px;font-weight:800;margin-top:8px}

/* ── GAME CARD ── */
.gcard{background:#fff;border:3px solid #e5e7eb;border-radius:24px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.gtit{font-size:17px;font-weight:900;text-align:center;color:#1a1a2e}
.gsb{text-align:center;color:#6b7280;font-size:12px;font-weight:800;margin-bottom:12px}
.scrow{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
.scbx{background:#f9fafb;border:2px solid #e5e7eb;border-radius:12px;padding:8px 16px;text-align:center}
.scn{font-size:22px;font-weight:900}
.scl{font-size:10px;font-weight:800;color:#6b7280}
.olist{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.orow{background:#f9fafb;border:2px solid #e5e7eb;border-radius:11px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#1a1a2e;transition:all .3s}
.sbtn{margin-left:auto;padding:7px 14px;border:none;border-radius:9px;font-size:13px;font-weight:900;cursor:pointer;color:#fff;transition:transform .1s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sbtn:active{transform:translateY(2px);box-shadow:none}
.ptrk{height:12px;background:#f3f4f6;border-radius:12px;overflow:hidden;border:2px solid #e5e7eb}
.pfl{height:100%;border-radius:12px;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .5s}
.blns{display:flex;gap:8px;margin-bottom:10px}
.bln{flex:1;background:#f9fafb;border:2px solid #e5e7eb;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:130px;justify-content:space-between;transition:all .2s}
.bln:active{transform:scale(.95)}
.blnm{font-size:10px;font-weight:900;color:#6b7280}
.blc{font-size:26px;font-weight:900}
.blf{font-size:22px}
.blb{width:100%;height:7px;background:#e5e7eb;border-radius:7px;overflow:hidden}
.blbf{height:100%;border-radius:7px;background:#22c55e;transition:all .3s}
.cslts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.cslt{background:#f9fafb;border:2px solid #e5e7eb;border-radius:12px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:10px;font-weight:800;color:#6b7280;transition:all .2s}
.cslt.full{border-color:#06b6d4;background:#e8fffe}
.cslt:active{transform:scale(.95)}
.csic{font-size:24px}
.rqbx{background:#fffbeb;border:2px solid #fde68a;border-radius:12px;padding:9px 12px;text-align:center;font-size:13px;font-weight:800;color:#92400e;min-height:40px;display:flex;align-items:center;justify-content:center}
.minc{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.mchp{background:#f9fafb;border:2px solid #e5e7eb;border-radius:10px;padding:6px 11px;font-size:12px;font-weight:800;cursor:grab;user-select:none}
.mchp:active{cursor:grabbing;transform:scale(1.05)}
.dropz{min-height:90px;background:#f8fafc;border:3px dashed #e5e7eb;border-radius:14px;padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin-bottom:8px;transition:all .2s}
.dropz.over{border-color:#8b5cf6;background:#f3f0ff}
.pbtn{width:100%;padding:12px;border:none;border-radius:12px;background:#22c55e;color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #15803d;transition:transform .1s}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #15803d}
.rgrd{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.rtl{background:#f9fafb;border:2px solid #e5e7eb;border-radius:14px;padding:11px 6px;text-align:center;cursor:pointer;transition:all .2s}
.rtl:active{transform:scale(.95)}
.rtl.on{border-color:#22c55e;background:#f0fdf4}
.rtl.brk{border-color:#ef4444;background:#fff1f2;opacity:.7}
.rem{font-size:26px;display:block;margin-bottom:4px}
.rrl{font-size:9px;font-weight:900;color:#6b7280}
.rst{font-size:9px;font-weight:900;margin-top:2px}

/* ── QUIZ CARD ── */
.qcard{background:#fff;border:3px solid #e5e7eb;border-radius:24px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.qqn{font-size:11px;font-weight:900;color:#6b7280;margin-bottom:5px}
.qq{font-size:19px;font-weight:900;line-height:1.3;margin-bottom:16px;color:#1a1a2e}
.qopts{display:flex;flex-direction:column;gap:9px}
.qopt{background:#f9fafb;border:2.5px solid #e5e7eb;border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;font-size:13px;font-weight:800;color:#1a1a2e;transition:all .2s;box-shadow:0 3px 0 #e5e7eb}
.qopt:hover{border-color:#8b5cf6;background:#f3f0ff;transform:translateY(-1px)}
.qopt.right{border-color:#22c55e;background:#f0fdf4;box-shadow:0 3px 0 #86efac}
.qopt.wrong{border-color:#ef4444;background:#fff1f2;box-shadow:0 3px 0 #fca5a5}
.qopt.off{pointer-events:none}
.qltr{width:30px;height:30px;border-radius:9px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.qfb{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:800;line-height:1.5;display:none;border:2px solid}
.qfb.right{background:#f0fdf4;border-color:#86efac;color:#166534;display:block}
.qfb.wrong{background:#fff1f2;border-color:#fca5a5;color:#991b1b;display:block}

/* ── COMPLETION ── */
.comp{text-align:center;padding:28px 10px}
.cstars{font-size:46px;letter-spacing:4px;margin-bottom:12px;animation:starpop .5s ease}
@keyframes starpop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.ctit{font-size:28px;font-weight:900;margin-bottom:6px;color:#1a1a2e}
.csub{font-size:14px;font-weight:700;color:#6b7280;margin-bottom:18px}
.cxp{display:inline-flex;align-items:center;gap:7px;background:#fffbeb;border:3px solid #fde68a;border-radius:16px;padding:10px 22px;margin-bottom:20px;font-size:24px;font-weight:900;color:#92400e}

/* ── BIG BUTTON ── */
.bbtn{width:100%;padding:14px;border:none;border-radius:16px;font-size:16px;font-weight:900;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;transition:transform .15s,box-shadow .15s}
.bbtn:active{transform:translateY(3px)!important}
.pur{background:#6366f1;box-shadow:0 5px 0 #4338ca}.pur:hover{transform:translateY(-2px);box-shadow:0 8px 0 #4338ca}
.grn{background:#22c55e;box-shadow:0 5px 0 #15803d}.grn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #15803d}
.gho{background:#f9fafb;color:#6b7280;border:2px solid #e5e7eb;box-shadow:0 4px 0 #e5e7eb}
.dis{opacity:.5;pointer-events:none}

/* ── STATS / WINS ── */
.sgrd{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 18px}
.stl{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:14px;text-align:center;box-shadow:0 3px 0 #e5e7eb}
.stn{font-size:30px;font-weight:900}
.stt{font-size:10px;font-weight:800;color:#6b7280;margin-top:2px}
.bgrd{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 18px 18px}
.btl{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 3px 0 #e5e7eb;transition:transform .2s}
.btl.earn{border-color:#fde68a;background:#fffbeb;box-shadow:0 3px 0 #fcd34d}
.btl.earn:hover{transform:scale(1.05)}
.btl.lock{opacity:.35;filter:grayscale(1)}
.bic{font-size:28px;display:block;margin-bottom:5px}
.bnm{font-size:10px;font-weight:900;color:#6b7280}
.btl.earn .bnm{color:#92400e}

/* ── PROFILE ── */
.para{text-align:center;padding:20px 0}
.aring{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:46px;margin:0 auto 10px;border:4px solid #fff;box-shadow:0 6px 0 #e5e7eb}
.pnm{font-size:22px;font-weight:900;color:#1a1a2e}
.plv{font-size:12px;font-weight:800;color:#6b7280}
.pcrds{display:flex;flex-direction:column;gap:9px;padding:0 18px}
.pcrd{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 0 #e5e7eb}
.pcl{display:flex;align-items:center;gap:11px}
.pci{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #e5e7eb;background:#f9fafb}
.pct{font-weight:900;font-size:14px;color:#1a1a2e}
.pcs{font-size:11px;font-weight:700;color:#6b7280}
.pcv{font-size:20px;font-weight:900;color:#92400e}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:2.5px solid #e5e7eb;display:flex;padding:8px 0 18px;z-index:200}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer;border:none;background:transparent}
.nb:active{transform:scale(.9)}
.nbi{font-size:24px;transition:transform .2s}
.nbl{font-size:9px;font-weight:900;color:#6b7280}
.nb.on .nbl{color:#6366f1}
.nb.on .nbi{transform:scale(1.2)}

/* ── MODAL ── */
.movl{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.movl.open{opacity:1;pointer-events:all}
.msh{background:#fff;border-radius:24px 24px 0 0;padding:18px 18px 38px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.movl.open .msh{transform:translateY(0)}
.mpill{width:40px;height:4px;background:#e5e7eb;border-radius:4px;margin:0 auto 16px}

/* ── FX ── */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.cf{position:absolute;border-radius:3px;animation:cff 3s ease-in forwards}
@keyframes cff{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%) translateY(14px);background:#1a1a2e;color:#fff;border-radius:16px;padding:9px 18px;font-size:13px;font-weight:800;z-index:400;opacity:0;transition:all .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
