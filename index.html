<script>
// ─── DATA ───────────────────────────────────────────────
var W = [
  {id:1,emoji:'🌮',name:'Taco Town',sub:'How the Internet Works',cls:'wc1',col:'#ff6b6b',lcol:'#fff0f0',bdcol:'#cc4444',badge:'🌮',bname:'Taco Master',desc:'Learn how computers talk to each other!',say:'Every website visit is like ordering a taco — you ask, they make it, you get it! 🌮',
   lessons:[
    {id:'1.1',emoji:'🌮',title:'Your First Taco Order',sub:'Client & Server',game:'taco',story:{scene:'🌮',parts:['🍅','🧀','🌶️','🥑'],mascot:'Taco Tommy 👨‍🍳',text:{toddler:'YOU are the CLIENT! You walk up to Tommy\'s restaurant (the SERVER) and say "One taco please!" Tommy makes it and brings it to you! That\'s how websites work — your computer asks, the website answers!',kids:'Your device = "client" (sends requests). Website computer = "server" (sends back responses). Every click, every page load is a client asking a server. Google answers billions of requests every day!'},fact:'🤯 Your message travels to Google\'s servers and comes back in under 200ms — faster than a blink!'},
     diag:{title:'The Taco Flow!',nodes:[{icon:'👦',text:'YOU — The Client',tip:'Your phone or computer! It asks for things from servers.'},{icon:'📡',text:'The Internet Highway',tip:'The magical road carrying your request at the speed of light!'},{icon:'🏪',text:'The Server (Restaurant)',tip:'A powerful computer that holds websites and sends them to you!'}]},
     quiz:[{q:'What do we call YOUR computer when visiting a website?',opts:['Server','Client!','Internet','Taco'],ans:1,expl:'Client = YOUR computer! You ask, the server answers.'},{q:'What does a SERVER do?',opts:['Makes pizza','Sleeps all day','Answers your requests!','Plays games'],ans:2,expl:'Servers answer! They send back the webpage you asked for.'},{q:'How fast does internet send messages?',opts:['10 minutes','1 minute','Under 1 second!','5 minutes'],ans:2,expl:'Lightning fast! Messages travel the whole world in under 1 second!'}]},
    {id:'1.2',emoji:'🔒',title:'The Secret Envelope',sub:'HTTPS & Security',game:'taco',story:{scene:'🔒',parts:['🔑','✉️','🛡️','💌'],mascot:'Taco Tommy 👨‍🍳',text:{toddler:'When you send your taco order you put it in a MAGIC SEALED ENVELOPE that only Tommy can open! Nobody sneaky can peek! That\'s HTTPS — a magic lock on all your internet messages!',kids:'HTTP = open postcard anyone can read. HTTPS = sealed envelope with a secret code. The S stands for Secure! When you see 🔒 in your browser, your data is encrypted and safe.'},fact:'🔒 Over 95% of web traffic now uses HTTPS to keep everyone safe!'},
     diag:{title:'Safe vs Unsafe!',nodes:[{icon:'📮',text:'HTTP — Open Postcard',tip:'Anyone can read it! Never use for passwords!'},{icon:'🔒',text:'HTTPS — Sealed Envelope',tip:'Encrypted! Only you and the server can read it. Look for the 🔒!'}]},
     quiz:[{q:'What does 🔒 in your browser mean?',opts:['Loading...','Your message is safe!','Game mode','Food coming'],ans:1,expl:'Padlock = HTTPS! Your connection is encrypted and safe!'},{q:'HTTP is like a...?',opts:['Secret safe','Open postcard!','A house','A car'],ans:1,expl:'Open postcard — anyone can read it! HTTPS is the sealed envelope.'},{q:'S in HTTPS stands for...?',opts:['Salsa','Speed','Secure!','Sleep'],ans:2,expl:'Secure! Your connection is protected with encryption!'}]},
    {id:'1.3',emoji:'⚡',title:'Fast vs Slow Restaurant',sub:'Latency',game:'taco',story:{scene:'🏃',parts:['⚡','🐌','⏱️','🏆'],mascot:'Taco Tommy 👨‍🍳',text:{toddler:'Restaurant A gives your taco in 1 SECOND! Restaurant B takes 10 MINUTES! Which do you like? FAST is always better! The waiting time is called LATENCY. Small latency = FAST!',kids:'Latency = time from request to response. Like ping in gaming! 10ms = amazing. 500ms = OK. 3000ms = rage quit. Google loads in ~200ms. Amazon found every 100ms of latency costs 1% in sales!'},fact:'⚡ Amazon found every extra 100ms of latency cost them 1% in sales. Speed = real money!'},
     diag:{title:'Speed Matters!',nodes:[{icon:'🚀',text:'Low Latency — Instant!',tip:'Under 100ms. Like flipping a light switch. Users love this!'},{icon:'🐌',text:'High Latency — Painful',tip:'Over 3 seconds. Users leave. Nobody waits for slow websites!'}]},
     quiz:[{q:'LATENCY means...?',opts:['A topping','The waiting time!','A game mode','A lock'],ans:1,expl:'Latency = waiting time! How long from click to getting the answer?'},{q:'Which latency is BEST?',opts:['5000ms','1000ms','100ms','10ms!'],ans:3,expl:'10ms! Lower is always better — 10ms feels completely instant!'},{q:'A fast website loads in...?',opts:['10 minutes','5 minutes','30 seconds','Under 2 seconds!'],ans:3,expl:'Under 2 seconds! Anything slower and people start leaving!'}]},
    {id:'1.4',emoji:'🏗️',title:'Bigger Kitchen Please!',sub:'Scalability',game:'taco',story:{scene:'🏗️',parts:['👥','🏠','🏢','📈'],mascot:'Taco Tommy 👨‍🍳',text:{toddler:'Tommy\'s tiny stand has room for 5 customers. 1000 kids show up! He needs a BIGGER kitchen or MORE helpers! That\'s SCALING! When apps get popular, they need more computers!',kids:'Scalability = handle MORE users without slowing down. Instagram grew to 2 BILLION users! Scale UP = one stronger server. Scale OUT = more servers (usually better!). Cloud platforms let you add servers with one click!'},fact:'📈 WhatsApp served 450 million users with just 50 engineers! Smart scalable design!'},
     diag:{title:'Growing Up!',nodes:[{icon:'🏠',text:'1 User — Tiny Stand',tip:'One little server. Easy to manage!'},{icon:'🏢',text:'1,000 Users — Restaurant',tip:'Need bigger or more servers!'},{icon:'🌆',text:'1 Million — Scale OUT!',tip:'MANY servers working together!'}]},
     quiz:[{q:'SCALABILITY means...?',opts:['Making food','Handling more users!','Security','Speed'],ans:1,expl:'Scalability = grow without breaking!'},{q:'1 million users hit your site! You should...?',opts:['Sleep','Run away','Add more servers!','Delete it'],ans:2,expl:'Add more servers! That\'s horizontal scaling!'},{q:'Scale OUT means...?',opts:['One stronger server','Add MORE servers!','Remove servers','Turn off computers'],ans:1,expl:'Scale OUT = add more servers! Can grow almost forever!'}]},
    {id:'1.5',emoji:'⚖️',title:'The Big Trade-Off',sub:'Design Decisions',game:'taco',story:{scene:'⚖️',parts:['⚡','🔒','💰','🏗️'],mascot:'Taco Tommy 👨‍🍳',text:{toddler:'Tommy must choose: FAST tacos or PERFECT tacos? Fast means sometimes wrong toppings. Perfect means longer wait. In computers EVERY choice has a good side AND a tricky side! No perfect answer — only smart choices!',kids:'System design is ALL about trade-offs! Faster = less safe. Cheaper = breaks more. Simpler = less capable. Great engineers find the RIGHT balance for their specific situation!'},fact:'⚖️ Netflix pays much more for reliability. 1 minute of downtime = millions lost. Worth the trade-off!'},
     diag:{title:'Trade-offs!',nodes:[{icon:'⚡',text:'Speed vs Safety',tip:'Faster = slightly less secure. Banks choose safety. Games choose speed!'},{icon:'💰',text:'Cost vs Power',tip:'Cheap servers break more. Expensive = reliable.'},{icon:'🏗️',text:'Simple vs Flexible',tip:'Simple = easy to fix. Complex = does more things.'}]},
     quiz:[{q:'A bank needs max security. They trade...?',opts:['Security','Money','A tiny bit of speed!','Tacos'],ans:2,expl:'Banks trade a tiny bit of speed for maximum security!'},{q:'What IS a trade-off?',opts:['A fancy recipe','Giving up one thing to get another!','A fast computer','A database'],ans:1,expl:'Trade-off = giving up X to gain Y! Every design decision works this way!'},{q:'Is there a PERFECT design?',opts:['Yes always!','Only sometimes','Never! Everything has trade-offs!','Only for tacos'],ans:2,expl:'No perfect answer! Every design has trade-offs. Great engineers find the RIGHT balance!'}]}
  ]},
  {id:2,emoji:'📮',name:'Post Office Planet',sub:'DNS & Networking',cls:'wc2',col:'#4ecdc4',lcol:'#e8fffe',bdcol:'#2ba89f',badge:'📮',bname:'DNS Wizard',desc:'How do computers find each other?',say:'Every computer has a secret number address! I help find them so messages get delivered! 📬',
   lessons:[
    {id:'2.1',emoji:'🏠',title:'Every Computer Has an Address',sub:'IP Addresses',game:'taco',story:{scene:'🏠',parts:['1️⃣','2️⃣','📍','🏡'],mascot:'Postie the Penguin 🐧',text:{toddler:'You know how your house has a number? Every computer on the internet has its OWN special number too! Called an IP address! Like 142.250.80.46! With this, computers know exactly where to find you!',kids:'IP = Internet Protocol. Every device gets a unique IP address. IPv4 looks like 192.168.1.1. Google\'s IP = 142.250.80.46. We\'re running out of IPv4 so IPv6 was invented with trillions more!'},fact:'🌍 There are 4.3 billion IPv4 addresses and we\'ve almost used them all!'},
     diag:{title:'Internet Addresses!',nodes:[{icon:'📱',text:'Your Phone: 192.168.1.5',tip:'Your device\'s address on your home network.'},{icon:'🌐',text:'Google: 142.250.80.46',tip:'Google\'s actual IP! Your computer uses this to find Google.'},{icon:'🎮',text:'Game Server: 104.18.2.161',tip:'Games connect to servers with IPs too!'}]},
     quiz:[{q:'What is an IP Address?',opts:['A pizza type','A computer\'s unique number!','A password','A game'],ans:1,expl:'Every device gets a unique IP — like a house number for computers!'},{q:'IP stands for...?',opts:['Ice Pop','Internet Protocol!','Invisible Penguin','Icy Planet'],ans:1,expl:'Internet Protocol! The rules computers use to communicate!'},{q:'Why do computers need IP addresses?',opts:['They look cool','So they can find each other!','For decoration','To go faster'],ans:1,expl:'Without IPs, computers couldn\'t know where to send messages!'}]},
    {id:'2.2',emoji:'📖',title:'The Magic Phone Book',sub:'DNS',game:'taco',story:{scene:'📖',parts:['📖','🔍','✉️','💡'],mascot:'Postie the Penguin 🐧',text:{toddler:'You type "google.com" but computers only understand NUMBERS! So there\'s a MAGIC PHONE BOOK called DNS! You say "google.com" and DNS says "That\'s 142.250.80.46!" Your computer knows where to go!',kids:'DNS = Domain Name System, the internet\'s phone book. Type "youtube.com" → DNS instantly finds the IP → browser connects. Results are cached for faster repeat lookups!'},fact:'📖 DNS was invented in 1983. Before it, ONE file on ONE computer listed every website!'},
     diag:{title:'DNS Magic!',nodes:[{icon:'👦',text:'You type: google.com',tip:'A friendly name humans remember. Computers prefer numbers!'},{icon:'📖',text:'DNS looks it up!',tip:'Like a phone book! Finds the IP for the name. Takes under 1ms!'},{icon:'✅',text:'Gets: 142.250.80.46',tip:'Now browser knows the IP and connects to Google\'s servers!'}]},
     quiz:[{q:'What does DNS do?',opts:['Makes sites pretty','Turns names into numbers!','Stores pictures','Plays music'],ans:1,expl:'DNS translates names into IP numbers — the internet\'s phone book!'},{q:'DNS stands for...?',opts:['Daily Nap System','Domain Name System!','Dinosaur Server','Data Number Store'],ans:1,expl:'Domain Name System! The giant phone book everyone uses!'},{q:'Without DNS you\'d need to type...?',opts:['google.com','A password','142.250.80.46!','Nothing'],ans:2,expl:'Without DNS you\'d memorize long numbers! DNS lets us use friendly names!'}]},
    {id:'2.3',emoji:'✉️',title:'Certified Mail vs Shouting',sub:'TCP vs UDP',game:'taco',story:{scene:'📡',parts:['✉️','📡','✅','❌'],mascot:'Postie the Penguin 🐧',text:{toddler:'TCP is like certified mail — every letter arrives and gets a signature! Takes a bit longer but ALWAYS works! UDP is like shouting across the playground — SUPER FAST but maybe nobody hears! Games use UDP (speed!), downloads use TCP (safe!).',kids:'TCP = reliable. Every packet checked and resent if lost. For websites, email, file downloads. UDP = fast but no guarantee. Used for games, video calls, live streams where speed beats perfection.'},fact:'🎮 Video games use UDP! A few lost packets in a game is fine. Missing bytes in a file = corrupted file!'},
     diag:{title:'TCP vs UDP!',nodes:[{icon:'✉️',text:'TCP — Certified Mail',tip:'Guaranteed delivery! Every byte in order. For websites, files!'},{icon:'📣',text:'UDP — Shouting Fast!',tip:'Super fast but no guarantee! For games, video calls!'}]},
     quiz:[{q:'Video games usually use...?',opts:['TCP (slow)','UDP (fast!)','Neither','Both'],ans:1,expl:'Games use UDP for speed! A tiny lost packet is fine!'},{q:'Downloading a file should use...?',opts:['UDP (might lose bits!)','TCP (every byte counts!)','Neither','Shouting'],ans:1,expl:'Files need TCP! Every single byte must arrive correctly!'},{q:'TCP is like...?',opts:['Shouting across a field','A loudspeaker','Certified mail!','A whisper'],ans:2,expl:'Certified mail! Confirmation that every packet arrived safely!'}]},
    {id:'2.4',emoji:'🕵️',title:'The Helper in the Middle',sub:'Proxy Servers',game:'taco',story:{scene:'🤝',parts:['🕵️','🔄','🛡️','🌐'],mascot:'Postie the Penguin 🐧',text:{toddler:'Imagine asking your friend to order pizza for you! The pizza shop only knows your friend\'s address — not yours! A PROXY is a helper computer that goes to websites FOR you! The website only sees the proxy, not you!',kids:'Forward proxy sits in front of you. Requests go: you → proxy → internet. Website sees proxy\'s IP, not yours! Companies block sites via proxies. VPNs work like this!'},fact:'🌍 VPNs are proxies! When using a VPN, websites think you\'re in a different country!'},
     diag:{title:'Proxy Helper!',nodes:[{icon:'👦',text:'You — want privacy!',tip:'You want to visit a site but stay anonymous!'},{icon:'🕵️',text:'Proxy — goes for you!',tip:'Visits the website FOR you. Site only sees proxy!'},{icon:'🌐',text:'Website — sees proxy only!',tip:'Site answers the proxy, which brings content back to you!'}]},
     quiz:[{q:'What does a PROXY do?',opts:['Makes websites','Goes to internet on your behalf!','Stores passwords','Sends emails'],ans:1,expl:'Proxy is your helper! Visits websites FOR you, keeping you private!'},{q:'VPNs are a type of...?',opts:['Database','Game','Proxy!','Taco'],ans:2,expl:'VPNs route your traffic through another server — just like a proxy!'},{q:'Why use a proxy?',opts:['For privacy!','Slower internet','Use more data','No reason'],ans:0,expl:'Privacy! The website sees the proxy, not YOU!'}]},
    {id:'2.5',emoji:'🏢',title:'The Building Front Desk',sub:'Reverse Proxy',game:'taco',story:{scene:'🏢',parts:['🏢','👔','📋','🔀'],mascot:'Postie the Penguin 🐧',text:{toddler:'A big office has MANY workers! The FRONT DESK asks "Who are you here to see?" and sends you to the right department! A REVERSE PROXY is the internet\'s front desk — it stands in front of many servers and routes each visitor to the right one!',kids:'Reverse proxy sits in front of your SERVERS. All visitors talk to the proxy, which routes to the right server. Benefits: hides real servers, adds security, load balancing, caching. Nginx and Cloudflare work this way!'},fact:'☁️ When you visit Netflix, you\'re talking to a reverse proxy first. It protects their actual servers!'},
     diag:{title:'Reverse Proxy!',nodes:[{icon:'👥',text:'Millions of Visitors',tip:'All users want to visit the same website!'},{icon:'🏢',text:'Reverse Proxy (Front Desk)',tip:'Routes each visitor to the right server. Protects the real servers!'},{icon:'🖥️',text:'Servers 1, 2, 3...',tip:'Actual servers safely hidden behind the proxy!'}]},
     quiz:[{q:'Reverse proxy sits in front of...?',opts:['Users','Your servers!','The internet','Your phone'],ans:1,expl:'Reverse proxy protects your servers!'},{q:'A great use of reverse proxy?',opts:['Playing games','Hiding and protecting servers!','Storing files','Sending emails'],ans:1,expl:'Reverse proxies protect servers — users never directly access them!'},{q:'Forward proxy protects the ___, reverse proxy protects the ___?',opts:['Server / Client','Client / Server!','Both same','Neither'],ans:1,expl:'Forward = protects the CLIENT. Reverse = protects the SERVERS!'}]}
  ]},
  {id:3,emoji:'🐝',name:'Busy Bee Boulevard',sub:'Load Balancing & Scaling',cls:'wc3',col:'#ffd93d',lcol:'#fffce8',bdcol:'#c9a800',badge:'🐝',bname:'Load Master',desc:'When TONS of bees visit at once, Bella knows how to handle it!',say:'When too many bees try one flower, we need MORE flowers — or a crossing guard! 🚦',
   lessons:[
    {id:'3.1',emoji:'🚦',title:'The Crossing Guard',sub:'Load Balancing',game:'bee',story:{scene:'🚦',parts:['🐝','🌺','⚖️','🔀'],mascot:'Bella the Bee 🐝',text:{toddler:'1000 bees want to use ONE flower! WAY TOO MANY! So Bella becomes the CROSSING GUARD — she sends some bees to Flower 1, some to Flower 2, some to Flower 3! Nobody waits too long! That\'s LOAD BALANCING!',kids:'A load balancer sits in front of multiple servers, distributing requests evenly. Algorithms: Round Robin, Least Connections, IP Hash. If one server crashes, load balancer stops sending to it automatically!'},fact:'⚖️ Google handles 8.5 BILLION searches per day. Without load balancers, one computer would melt!'},
     diag:{title:'Spread the Load!',nodes:[{icon:'📥',text:'Requests flood in!',tip:'Millions of users clicking at once. One server would collapse!'},{icon:'⚖️',text:'Load Balancer',tip:'The crossing guard! Spreads visitors evenly so no server is overwhelmed!'},{icon:'🖥️',text:'Servers 1, 2, 3',tip:'Each server gets some visitors. Everyone gets served quickly!'}]},
     quiz:[{q:'What does a load balancer do?',opts:['Makes sites pretty','Spreads requests across servers!','Stores data','Sends emails'],ans:1,expl:'Spreads the work! Many servers share the load instead of one collapsing!'},{q:'Load balancing is like a...?',opts:['Sleeping guard','Crossing guard sending people to different doors!','A locked door','An empty room'],ans:1,expl:'Crossing guard sends each visitor to a different server!'},{q:'Server 2 crashes. Load balancer...?',opts:['Crashes too','Stops working','Routes traffic to Servers 1 and 3!','Calls for help'],ans:2,expl:'Smart! Load balancers detect failures and route around them automatically!'}]},
    {id:'3.2',emoji:'💪',title:'Stronger vs More Bees',sub:'Vertical vs Horizontal Scaling',game:'bee',story:{scene:'💪',parts:['💪','🐝','⬆️','➡️'],mascot:'Bella the Bee 🐝',text:{toddler:'Bella can GROW into a SUPER BIG bee — Vertical Scaling! OR she can call ALL HER FRIENDS — Horizontal Scaling (more bees!). Getting more friends is usually BETTER because there\'s a limit to how big one bee can grow!',kids:'Vertical scaling (Scale Up) = give ONE server more power. Has limits! Horizontal scaling (Scale Out) = add MORE servers. Can grow almost infinitely! Netflix, Instagram all use horizontal scaling!'},fact:'🏗️ Netflix runs on thousands of servers. Adding more servers is always the answer for massive scale!'},
     diag:{title:'Scale Up vs Scale Out!',nodes:[{icon:'⬆️',text:'Scale UP — Bigger Server',tip:'Make ONE computer more powerful. Has a physical limit!'},{icon:'➡️',text:'Scale OUT — More Servers',tip:'Add MORE computers! Can keep adding almost forever!'}]},
     quiz:[{q:'Scale UP means...?',opts:['Add more servers','Make one server MORE powerful!','Remove servers','Do nothing'],ans:1,expl:'Scale UP = one stronger server!'},{q:'Scale OUT means...?',opts:['Make one server bigger','Add MORE servers!','Turn servers off','Smaller servers'],ans:1,expl:'Scale OUT = add more servers! Usually better for massive growth!'},{q:'Which is better for HUGE growth?',opts:['Scale UP (limited)','Scale OUT (endless!)','Neither','Delete everything'],ans:1,expl:'Scale OUT wins! You can always add more servers!'}]},
    {id:'3.3',emoji:'😴',title:'The Backup Bee',sub:'Failover',game:'bee',story:{scene:'😴',parts:['😴','🔄','❤️','✅'],mascot:'Bella the Bee 🐝',text:{toddler:'Bella works SO hard she sometimes needs a rest! But flowers still need tending! So there\'s always a BACKUP BEE waiting. The MOMENT Bella rests, the backup wakes up INSTANTLY and keeps working! Nobody notices! That\'s FAILOVER!',kids:'Failover = automatically switching to a backup when the main system fails. Active-Passive: one main, one sleeping backup. Main fails → passive wakes up instantly! Banks have multiple failover layers!'},fact:'🏦 Banks have multiple failover systems. If a data center burns down, another takes over in seconds!'},
     diag:{title:'Failover Safety Net!',nodes:[{icon:'🐝',text:'Active Server (Working!)',tip:'The main server handling all requests!'},{icon:'😴',text:'Passive Backup (Sleeping...)',tip:'Always ready to wake up instantly if main server fails!'},{icon:'⚡',text:'Failover happens!',tip:'Main dies → backup wakes up → users never notice!'}]},
     quiz:[{q:'What is FAILOVER?',opts:['A type of food','Switching to backup when something fails!','A dance','Making servers faster'],ans:1,expl:'Failover = automatic backup activation!'},{q:'Active-Passive means...?',opts:['Both work all time','One works, one sleeps as backup!','Both sleep','Both fail'],ans:1,expl:'Active = working. Passive = sleeping backup. Active fails → passive wakes up!'},{q:'Why is failover important?',opts:['For fun','So systems NEVER go down!','Save electricity','Save money'],ans:1,expl:'No downtime = happy users!'}]},
    {id:'3.4',emoji:'🛑',title:'Only 10 Bees at Once!',sub:'Rate Limiting',game:'bee',story:{scene:'🌺',parts:['🛑','10️⃣','⏱️','🚫'],mascot:'Bella the Bee 🐝',text:{toddler:'The flower garden is fragile! If 1000 bees all land at once, they\'d squish everything! So there\'s a rule: only 10 bees per minute! More than that? Wait your turn! That\'s RATE LIMITING — protecting the system from being overwhelmed!',kids:'Rate limiting controls requests per time window. Exceed it → "429 Too Many Requests" error. Protects from: infinite loops, bots, DDoS attacks. Twitter, GitHub, all APIs use rate limiting!'},fact:'🔒 Twitter limits API calls to 300 per 15 minutes. Without limits, one bad actor could crash everything!'},
     diag:{title:'Rate Limiting!',nodes:[{icon:'🌊',text:'Flood of Requests!',tip:'Could be real users OR a hacker attack!'},{icon:'🛑',text:'Rate Limiter',tip:'Only X requests allowed per second. Extras declined politely!'},{icon:'✅',text:'Server stays healthy!',tip:'Controlled flow means the server is never overwhelmed!'}]},
     quiz:[{q:'What is RATE LIMITING?',opts:['Making things faster','Controlling how many requests are allowed!','A database type','A password'],ans:1,expl:'Rate limiting controls the flow!'},{q:'"429 Too Many Requests" means...?',opts:['Server broke','Sending too fast! Rate limited!','Wrong password','Bad internet'],ans:1,expl:'429 = rate limited! Slow down!'},{q:'Why is rate limiting important?',opts:['To be mean','Protect servers from being overwhelmed!','Confuse people','No reason'],ans:1,expl:'Protects servers! One bad actor can\'t crash everything for everyone!'}]},
    {id:'3.5',emoji:'🗺️',title:'The Magic Locker Room',sub:'Consistent Hashing',game:'bee',story:{scene:'🗺️',parts:['🗺️','🔑','🎯','💡'],mascot:'Bella the Bee 🐝',text:{toddler:'100 kids, 100 lockers! Each kid ALWAYS goes to THEIR locker — they never mix up! Even if we ADD more lockers, each kid still knows where to go! That\'s consistent hashing — a magic formula that always sends data to the same server!',kids:'Consistent hashing: imagine a circle (ring). Each server and data item gets a position on the ring. Data goes to the nearest server clockwise. Add a server? Only nearby data moves! Normal hashing → add one server → ALL data must move!'},fact:'🌐 Discord uses consistent hashing to route 850 million messages per day!'},
     diag:{title:'Consistent Hashing!',nodes:[{icon:'🔵',text:'Normal Hashing',tip:'Add one new server → ALL data must relocate. Expensive!'},{icon:'⭕',text:'Consistent Hashing Ring',tip:'Add server → only NEARBY data moves. Much smarter!'},{icon:'✅',text:'Only tiny bit moves!',tip:'Much more efficient for distributed systems!'}]},
     quiz:[{q:'What is consistent hashing?',opts:['A recipe','Smart way to assign data to servers with minimal shuffling!','A password','A game'],ans:1,expl:'Data goes to the right server and barely moves when servers change!'},{q:'Add a server with consistent hashing...?',opts:['All data moves','Only nearby data moves!','Nothing changes','System breaks'],ans:1,expl:'Only the data closest to the new server on the ring moves!'},{q:'Normal hashing adds a server. What happens?',opts:['Nothing changes','Nearby moves','ALL data must move!','Server explodes'],ans:2,expl:'Normal hashing is costly! Consistent hashing is much smarter!'}]}
  ]},
  {id:4,emoji:'📚',name:'The Great Library',sub:'Databases',cls:'wc4',col:'#6bcb77',lcol:'#edfff0',bdcol:'#3d9b4a',badge:'📚',bname:'Data Keeper',desc:'How do computers remember EVERYTHING? Libby knows all the secrets!',say:'Every piece of information needs the perfect home! I find it in milliseconds! 🔍',
   lessons:[
    {id:'4.1',emoji:'🗂️',title:'The Perfect Filing Cabinet',sub:'SQL Databases',game:'taco',story:{scene:'🗂️',parts:['📁','🗂️','📋','✅'],mascot:'Libby the Owl 🦉',text:{toddler:'Libby has the MOST organized filing cabinet! Every drawer labeled. Every paper in exactly the RIGHT spot! Ask "Find all red books from 2020" — she finds them instantly! That\'s what SQL databases do!',kids:'SQL databases store data in tables like spreadsheets! Rows and columns. JOIN tables. "SELECT * FROM users WHERE age > 18" finds all adult users. ACID transactions keep data safe. Examples: MySQL, PostgreSQL!'},fact:'🗂️ SQL was invented in 1974 and is STILL one of the most used technologies 50 years later!'},
     diag:{title:'SQL = Organized!',nodes:[{icon:'📊',text:'Tables (like spreadsheets!)',tip:'Data in rows and columns. Name, Age, Email — each in its own column!'},{icon:'🔗',text:'Tables link together!',tip:'Users → Orders → Products! All related data linked!'},{icon:'🔍',text:'SQL finds anything!',tip:'Tell the database exactly what you want. Gets it in milliseconds!'}]},
     quiz:[{q:'SQL databases store data in...?',opts:['Random places','Tables (rows and columns)!','Sticky notes','Boxes'],ans:1,expl:'SQL = organized tables! Like a spreadsheet!'},{q:'SQL is great for...?',opts:['Random data','Organized data with relationships!','Huge unstructured data','Videos'],ans:1,expl:'SQL shines for structured relational data!'},{q:'"SELECT * FROM users" means...?',opts:['Delete all users','Update users','Get ALL users!','Count users'],ans:2,expl:'SELECT * = get everything from the users table!'}]},
    {id:'4.2',emoji:'🗒️',title:'Sticky Notes Everywhere!',sub:'NoSQL Databases',game:'taco',story:{scene:'🗒️',parts:['🗒️','🔄','⚡','🎨'],mascot:'Libby the Owl 🦉',text:{toddler:'Libby\'s friend NOODLE uses STICKY NOTES on a giant wall! Each note can look COMPLETELY different! Super flexible and SUPER fast! That\'s NoSQL!',kids:'NoSQL = Not Only SQL. Types: Key-Value (Redis), Document (MongoDB), Wide Column (Cassandra), Graph (Neo4j). Great for massive, fast-changing, flexible data!'},fact:'💾 MongoDB, Cassandra, Redis power some of the biggest apps you use daily!'},
     diag:{title:'4 Types of NoSQL!',nodes:[{icon:'🔑',text:'Key-Value: "key" → data',tip:'Like a dictionary! Super fast lookups. Redis!'},{icon:'📄',text:'Document: JSON objects',tip:'Flexible documents. MongoDB!'},{icon:'📊',text:'Wide Column: huge tables',tip:'Cassandra handles billions of rows!'},{icon:'🕸️',text:'Graph: connected things',tip:'Shows relationships. Social networks!'}]},
     quiz:[{q:'NoSQL is great for...?',opts:['Only organized data','Flexible fast huge datasets!','Tiny data only','Never'],ans:1,expl:'NoSQL shines for huge flexible fast-changing data!'},{q:'Which NoSQL uses "key → value"?',opts:['Graph','Document','Key-Value!','Wide Column'],ans:2,expl:'Key-Value stores are like dictionaries!'},{q:'Social networks use ___ to show who follows who?',opts:['SQL tables','Key-Value','Graph!','Wide Column'],ans:2,expl:'Graph databases show CONNECTIONS between things!'}]},
    {id:'4.3',emoji:'🤔',title:'Cabinet or Wall?',sub:'SQL vs NoSQL',game:'taco',story:{scene:'⚖️',parts:['🗂️','🗒️','⚖️','🤔'],mascot:'Libby the Owl 🦉',text:{toddler:'SQL (the cabinet) is PERFECT for perfect organization — like a bank tracking every penny! NoSQL (the sticky-note wall) is PERFECT when things change a lot — like social media posts!',kids:'Use SQL when: clear structure, need complex queries, need ACID transactions (banking!). Use NoSQL when: massive scale, data structure varies, need super fast lookups. Many big apps use BOTH!'},fact:'🏦 Banks use SQL. Instagram uses both — SQL for accounts, Cassandra for posts!'},
     diag:{title:'Choose Wisely!',nodes:[{icon:'🏦',text:'Bank → SQL!',tip:'Money needs ACID transactions!'},{icon:'📸',text:'Instagram posts → NoSQL!',tip:'Billions of flexible posts!'},{icon:'🛒',text:'Amazon → BOTH!',tip:'Right tool for each job!'}]},
     quiz:[{q:'A bank should use...?',opts:['NoSQL only','SQL! (ACID transactions!)','Neither','Sticky notes'],ans:1,expl:'Banks need SQL! ACID guarantees every transaction is perfect!'},{q:'Billions of social media posts — use...?',opts:['SQL only','NoSQL! (flexible and huge!)','Paper','Nothing'],ans:1,expl:'NoSQL for huge flexible data!'},{q:'Can you use BOTH?',opts:['Never!','If confused','Yes! Most big apps do!','Pick one forever'],ans:2,expl:'Yes! Right tool for each job!'}]},
    {id:'4.4',emoji:'📷',title:'Making Backup Copies!',sub:'Replication',game:'taco',story:{scene:'📷',parts:['📷','📄','🔄','🛡️'],mascot:'Libby the Owl 🦉',text:{toddler:'Libby has ONE super important book! She\'s scared it might get lost! So she makes BACKUP COPIES in different buildings! If one burns down, the copies are safe! That\'s REPLICATION!',kids:'Replication = copies of your database on multiple servers. Primary handles writes. Replicas copy everything and handle reads. No data loss if primary dies!'},fact:'🛡️ Netflix stores data in multiple data centers. If one disappears, your watch history is safe!'},
     diag:{title:'Always Have Copies!',nodes:[{icon:'👑',text:'Primary (Master)',tip:'The main database! All writes go here first!'},{icon:'📄',text:'Replicas 1, 2, 3...',tip:'Copies! Stay updated automatically!'},{icon:'⚡',text:'Primary fails → Replica promoted!',tip:'Zero data loss!'}]},
     quiz:[{q:'What is REPLICATION?',opts:['Deleting data','Copies on multiple servers!','Searching','Making tables'],ans:1,expl:'Replication = copies! Multiple servers store the same data!'},{q:'WRITES go to...?',opts:['Any replica','The primary!','All simultaneously','None'],ans:1,expl:'Writes go to primary! Then primary copies to all replicas!'},{q:'Primary crashes. What happens?',opts:['Data lost!','A replica becomes primary!','Nothing','Start over'],ans:1,expl:'A replica gets promoted! Data safe, system keeps running!'}]},
    {id:'4.5',emoji:'🏛️',title:'Split the Library!',sub:'Sharding',game:'taco',story:{scene:'🏛️',parts:['🏛️','✂️','🅰️','🅱️'],mascot:'Libby the Owl 🦉',text:{toddler:'Libby\'s library has SO many books it takes forever! So she SPLITS into two buildings: A has books A-M, B has books N-Z! Now each is smaller and FASTER! That\'s SHARDING!',kids:'Sharding = split data across multiple databases. Users 1-1M in Shard 1, 1M-2M in Shard 2. Each shard is a separate database! Infinite storage potential. Facebook shards MySQL across thousands!'},fact:'📊 Facebook shards MySQL across THOUSANDS of databases!'},
     diag:{title:'Sharding!',nodes:[{icon:'😫',text:'One HUGE database',tip:'Too big! Slow queries, hard to manage!'},{icon:'✂️',text:'Shard it!',tip:'Split into smaller pieces!'},{icon:'⚡',text:'Many fast shards!',tip:'Each shard is smaller and faster!'}]},
     quiz:[{q:'What is SHARDING?',opts:['Making backups','Splitting into smaller databases!','Combining','Deleting'],ans:1,expl:'Sharding splits one huge database into smaller shards!'},{q:'Users 1-1M in Shard 1. Where is user 500K?',opts:['Shard 2','Random','Shard 1!','Not stored'],ans:2,expl:'500K is between 1 and 1M — Shard 1!'},{q:'Why is sharding needed?',opts:['For fun','One database has limits! Sharding enables infinite scaling!','Delete data','Security'],ans:1,expl:'Sharding = infinite growth!'}]},
    {id:'4.6',emoji:'🔖',title:'The Book Index!',sub:'Database Indexing',game:'taco',story:{scene:'🔖',parts:['🔖','📖','🔍','⚡'],mascot:'Libby the Owl 🦉',text:{toddler:'Finding "elephant" without an index = READ EVERY PAGE! Finding "elephant" WITH an index = go straight to page 47! Database indexes work the same — instead of checking EVERY row, the index points straight to the answer!',kids:'Without index: full table scan (read every row). With index: jump directly to matching rows. B-tree indexes are most common. Trade-off: reads faster but writes slightly slower.'},fact:'⚡ The right index can make a query go from 30 seconds to 0.001 seconds — a 30,000x speedup!'},
     diag:{title:'Indexes = Speed!',nodes:[{icon:'🐌',text:'No Index: Check every row!',tip:'Without index, reads EVERY ROW. Like checking every page!'},{icon:'🔖',text:'WITH Index: Jump directly!',tip:'Index points straight to matching rows!'},{icon:'⚡',text:'1000x Faster!',tip:'The right index makes queries thousands of times faster!'}]},
     quiz:[{q:'A database index makes...?',opts:['Writes faster','Reads MUCH faster!','Deletes easier','DB bigger only'],ans:1,expl:'Indexes speed up reads enormously!'},{q:'Trade-off of adding an index?',opts:['No trade-offs!','Reads faster, writes slightly slower!','Everything slows','Uses no space'],ans:1,expl:'Tiny cost in write speed and storage — but read gains are massive!'},{q:'Without an index in a billion rows...?',opts:['Instant!','Check ALL billion rows!','Check 10 rows','Not possible'],ans:1,expl:'Full table scan = potentially every single row!'}]},
    {id:'4.7',emoji:'✅',title:'All or Nothing!',sub:'ACID Transactions',game:'taco',story:{scene:'💰',parts:['💰','✅','❌','🔄'],mascot:'Libby the Owl 🦉',text:{toddler:'You\'re trading stickers with your friend! You give a dinosaur sticker. They give a rainbow sticker. What if you give yours but the game CRASHES before they give theirs? ACID means either BOTH trades happen OR NEITHER does! Your sticker never disappears!',kids:'ACID = Atomicity (all or nothing), Consistency (data always follows rules), Isolation (transactions don\'t interfere), Durability (saved forever even if server crashes). Banks NEED ACID!'},fact:'🏦 ACID was invented in 1983 specifically for banking. No more money disappearing due to crashes!'},
     diag:{title:'ACID = Safe!',nodes:[{icon:'⚛️',text:'Atomic: All or Nothing!',tip:'ALL steps complete or ALL roll back!'},{icon:'✅',text:'Consistent: Rules always apply!',tip:'Can\'t have negative balance!'},{icon:'🔒',text:'Isolated: No interference!',tip:'Two buying the last item? Only one succeeds!'},{icon:'💾',text:'Durable: Saved forever!',tip:'Once committed, survives even a crash!'}]},
     quiz:[{q:'ATOMIC means...?',opts:['About atoms','All or nothing!','Very fast','Stored forever'],ans:1,expl:'Atomic = all or nothing! Every step succeeds or all roll back!'},{q:'ACID most important for...?',opts:['Social media','Banking!','Profile pictures','Game scores'],ans:1,expl:'Banks NEED ACID! Money can\'t disappear due to crashes!'},{q:'DURABLE means...?',opts:['Fast queries','Saved permanently even after crashes!','Flexible','Fast writes'],ans:1,expl:'Durable = permanent! Committed data survives crashes, power cuts!'}]}
  ]},
  {id:5,emoji:'⚡',name:"Speedy Squirrel's Kitchen",sub:'Caching',cls:'wc5',col:'#ff9f43',lcol:'#fff4e8',bdcol:'#cc6f00',badge:'⚡',bname:'Cache Champion',desc:'Why fetch from far away every time? Speedy keeps the best stuff close by!',say:'Going to the database every time is SLOW! Keep popular stuff on the counter — instant! 🍪',
   lessons:[
    {id:'5.1',emoji:'🍪',title:'Snacks on the Counter!',sub:'What is Caching?',game:'cache',story:{scene:'🍪',parts:['🍪','⚡','🏪','⏱️'],mascot:'Speedy the Squirrel ⚡',text:{toddler:'Every time you want a cookie, do you go to the SUPERMARKET? No! You keep cookies on your COUNTER! Counter = FAST. Supermarket = SLOW. Caching = keeping things you use a lot in a FAST place!',kids:'Caching stores frequently-used data in fast storage. Database = slow (10-100ms). Cache (Redis) = lightning fast (microseconds!). 100x to 10,000x faster! Cache HIT = found in cache. Cache MISS = must fetch from database.'},fact:'⚡ Redis handles 1 MILLION operations per second. A database handles ~10,000. Cache is 100x faster!'},
     diag:{title:'Counter vs Supermarket!',nodes:[{icon:'🍪',text:'Counter (Cache) — Instant!',tip:'Just reach and grab. Super fast!'},{icon:'🧊',text:'Fridge (Server Memory)',tip:'A bit slower. Still fast!'},{icon:'🏪',text:'Supermarket (Database) — Slow',tip:'Much slower but stores everything!'}]},
     quiz:[{q:'What is a CACHE?',opts:['A type of money','Fast storage for frequently-used data!','A slow database','A network'],ans:1,expl:'Cache = FAST storage!'},{q:'Cache HIT means...?',opts:['Cache crashed','Found in cache — super fast!','Not in cache','Cache is full'],ans:1,expl:'Cache hit = found in cache!'},{q:'Cache MISS means...?',opts:['Cache is perfect','NOT in cache — must check database!','Cache is fast','Cache exploded'],ans:1,expl:'Cache miss = not found, must go to the slower database!'}]},
    {id:'5.2',emoji:'📍',title:'Counter, Fridge, or Store?',sub:'Cache Layers',game:'cache',story:{scene:'🏠',parts:['📱','💻','🌐','🏪'],mascot:'Speedy the Squirrel ⚡',text:{toddler:'There are DIFFERENT levels of caching! Your PHONE stores some things (browser cache). A helper near you stores more (CDN). The main server stores even more (server cache). The database is the big store with EVERYTHING.',kids:'Cache layers: Browser (your device — fastest!), CDN edge (near you — very fast), Server cache (fast), Database. Each layer tries to serve before hitting the next.'},fact:'🌍 Cloudflare has 310+ edge locations. Any user on Earth is within 20ms of a Cloudflare server!'},
     diag:{title:'Cache Layers!',nodes:[{icon:'📱',text:'Browser Cache (Your device!)',tip:'Fastest! Already on your device!'},{icon:'🌐',text:'CDN Edge (Near you!)',tip:'Very fast! Cached in a nearby city!'},{icon:'💾',text:'Server/App Cache',tip:'Fast. Redis, Memcached!'},{icon:'🗄️',text:'Database (Slowest source)',tip:'Has everything. Only hit when all caches miss!'}]},
     quiz:[{q:'Which cache is FASTEST?',opts:['Database','CDN','Server cache','Browser cache!'],ans:3,expl:'Browser cache is fastest! Already on your device!'},{q:'CDN caches content...?',opts:['Only at origin','Far from users','Near users!','On your device'],ans:2,expl:'CDN caches near you geographically!'},{q:'On total cache miss, request goes to...?',opts:['Error!','The original database!','Nothing','Ignored'],ans:1,expl:'All caches missed → hits the database!'}]},
    {id:'5.3',emoji:'🔄',title:'When Do We Refill?',sub:'Cache Strategies',game:'cache',story:{scene:'🔄',parts:['👀','🏃','🔄','✅'],mascot:'Speedy the Squirrel ⚡',text:{toddler:'Speedy has rules for refilling the counter! Check first — empty? Go get more and put them there! (Cache-Aside). Or bake new cookies and put on counter AND save in jar AT THE SAME TIME! (Write-Through). Or put on counter NOW, save in jar LATER! (Write-Behind).',kids:'Cache-Aside: Check cache → miss → load from DB → save to cache → return. Most popular! Write-Through: Write to cache AND database simultaneously. Always consistent. Write-Behind: Write to cache instantly, DB updated async. Fastest writes!'},fact:'💡 Cache-Aside is the most popular strategy! Simple and effective!'},
     diag:{title:'3 Cache Strategies!',nodes:[{icon:'👀',text:'Cache-Aside: Check first!',tip:'Miss? Load from DB, save to cache, return. Most popular!'},{icon:'✅',text:'Write-Through: Update both!',tip:'Write to cache AND database at same time!'},{icon:'⚡',text:'Write-Behind: Cache now, DB later!',tip:'Write to cache instantly. DB updated in background!'}]},
     quiz:[{q:'Cache-Aside means...?',opts:['Always use cache','Check cache first, load from DB on miss!','Ignore cache','Only write to DB'],ans:1,expl:'Cache-Aside = lazy loading!'},{q:'Write-Through writes to...?',opts:['Only cache','Only database','Cache AND database!','Neither'],ans:2,expl:'Write-Through keeps both in sync!'},{q:'Write-Behind is fastest for...?',opts:['Reads','Writes! (cache first, DB later)','Both','Neither'],ans:1,expl:'Write-Behind = instant cache writes, DB updated in background!'}]},
    {id:'5.4',emoji:'🗑️',title:'Throw Out Old Snacks!',sub:'Cache Eviction',game:'cache',story:{scene:'🗑️',parts:['🗑️','🔄','📊','⚖️'],mascot:'Speedy the Squirrel ⚡',text:{toddler:'The counter only holds 10 cookies! New one arrives and it\'s FULL — throw one out! Which one? The one not touched longest (LRU)? The least popular (LFU)? The very first one (FIFO)?',kids:'Cache eviction = what to remove when full. LRU (Least Recently Used): remove oldest unused — most popular! LFU: remove least-accessed. FIFO: remove oldest added. LRU works best for most web apps!'},fact:'🧠 Your own brain works like LRU! Old unused memories get evicted to make room!'},
     diag:{title:'Eviction Policies!',nodes:[{icon:'🕐',text:'LRU: Oldest unused goes!',tip:'Least Recently Used. Most popular policy!'},{icon:'📊',text:'LFU: Least popular goes!',tip:'Least Frequently Used!'},{icon:'1️⃣',text:'FIFO: First in, first out!',tip:'First added gets evicted first!'}]},
     quiz:[{q:'LRU stands for...?',opts:['Last Remaining Unit','Least Recently Used!','Largest Recent Upload','Long Running Update'],ans:1,expl:'Least Recently Used! Not accessed longest gets evicted first!'},{q:'Cache is full, new item arrives. What happens?',opts:['New item rejected','Something gets evicted!','Cache crashes','Nothing'],ans:1,expl:'Eviction policy kicks out an item to make room!'},{q:'Most popular eviction policy?',opts:['FIFO','Random','LFU','LRU!'],ans:3,expl:'LRU is most popular!'}]},
    {id:'5.5',emoji:'🌍',title:'Mini Kitchens Everywhere!',sub:'CDN',game:'cache',story:{scene:'🌍',parts:['🌍','🏪','⚡','📍'],mascot:'Speedy the Squirrel ⚡',text:{toddler:'The cookie factory is in New York! A kid in Japan wants cookies — that\'s 7,000 miles away! So Speedy opens MINI KITCHENS all over the world — one in Tokyo, London, Sydney! Everyone gets cookies from their NEAREST kitchen!',kids:'CDN = Content Delivery Network. A global network of servers. Your content (images, videos, CSS) copied to hundreds of locations. User in Japan gets served from Japan server — not USA! Cloudflare, Fastly, AWS CloudFront!'},fact:'🌐 Cloudflare has 310 data centers in 100+ countries. Any user is within 20ms of a Cloudflare server!'},
     diag:{title:'CDN = Global Speed!',nodes:[{icon:'🏭',text:'Origin Server (one place)',tip:'Serving everyone from one place = slow for far-away users!'},{icon:'🌍',text:'CDN Edge Servers (everywhere!)',tip:'Copies of your content around the world!'},{icon:'⚡',text:'Near you = Fast!',tip:'Tokyo user gets Tokyo server. Everyone wins!'}]},
     quiz:[{q:'What is a CDN?',opts:['A database','Network of servers caching content near users!','A language','A VPN'],ans:1,expl:'CDN = Content Delivery Network! Servers worldwide!'},{q:'CDN is most useful for...?',opts:['Database queries','Static content — images, videos, CSS!','Real-time chat','Passwords'],ans:1,expl:'CDN is perfect for static content!'},{q:'Australia user visits US website WITH CDN. Served from...?',opts:['From USA (slow!)','Nearest CDN edge!','The moon','Random'],ans:1,expl:'CDN serves from nearest edge — not USA!'}]}
  ]},
  {id:6,emoji:'📬',name:'The Busy Mailroom',sub:'Async, Queues & Events',cls:'wc6',col:'#a29bfe',lcol:'#f3f0ff',bdcol:'#6c5ce7',badge:'📬',bname:'Queue Queen',desc:'Nobody likes waiting on hold! Learn the smarter async way!',say:'Leave a voicemail and go play! No more waiting on hold! 📞',
   lessons:[
    {id:'6.1',emoji:'📞',title:'Waiting vs Voicemail',sub:'Sync vs Async',game:'mail',story:{scene:'📞',parts:['📞','💤','🎮','✅'],mascot:'Queenie the Bee 👸',text:{toddler:'SYNC: You call Tommy, wait on hold for 20 minutes! ASYNC: You leave a voicemail, GO PLAY, Tommy calls back when ready! Websites work the same way — send a request, keep doing other things, get the answer when done!',kids:'Synchronous: wait for each step to finish before moving on. Blocks everything! Asynchronous: send request, continue other work, get notified when done. Node.js, Python async are built async!'},fact:'⚡ Node.js handles THOUSANDS of connections simultaneously with just ONE thread using async!'},
     diag:{title:'Sync vs Async!',nodes:[{icon:'📞',text:'Sync: Wait on hold!',tip:'Stuck waiting. Simple but blocks everything!'},{icon:'📬',text:'Async: Leave a voicemail!',tip:'Send request, keep working! Get notified when done!'}]},
     quiz:[{q:'SYNCHRONOUS means...?',opts:['Very fast','Wait for each step!','Do many things at once','No waiting'],ans:1,expl:'Synchronous = wait! Like being on hold!'},{q:'ASYNCHRONOUS means...?',opts:['Very slow','Wait for everything','Send request, keep going!','Only for games'],ans:2,expl:'Async = keep going! Get the response later!'},{q:'A slow database query should be...?',opts:['Sync (block!)','Async! (keep app running!)','Ignored','Deleted'],ans:1,expl:'Slow operations should be async!'}]},
    {id:'6.2',emoji:'📥',title:'The Magic To-Do Tray',sub:'Message Queues',game:'mail',story:{scene:'📥',parts:['📥','📋','👷','✅'],mascot:'Queenie the Bee 👸',text:{toddler:'Queenie\'s mailroom has a magic TO-DO TRAY! Letters arrive in the tray. Workers pick them up one by one. Even if 1000 letters arrive — nobody panics! The tray holds them all. Workers go at their own pace!',kids:'Message queues decouple producers from consumers. Producer adds to queue (instant!). Consumer processes at its own speed. Benefits: no message loss, add more consumers to scale. RabbitMQ, AWS SQS, Kafka!'},fact:'📧 When you send Gmail, Google puts it in a QUEUE. That\'s why clicking Send is instant!'},
     diag:{title:'Message Queue!',nodes:[{icon:'📤',text:'Producer (sends messages)',tip:'Adds to queue instantly!'},{icon:'📥',text:'Queue (stores messages)',tip:'Messages wait safely!'},{icon:'👷',text:'Consumer (processes them)',tip:'Workers pick from queue at their own pace!'}]},
     quiz:[{q:'What does a message QUEUE do?',opts:['Deletes messages','Stores messages between producer and consumer!','Makes faster','Encrypts'],ans:1,expl:'Queue stores messages safely!'},{q:'Why use a message queue?',opts:['No reason','Decouple systems!','Delete messages','For complexity'],ans:1,expl:'Queues decouple! Producer sends, consumer processes when ready!'},{q:'1000 messages arrive, worker is slow. WITH queue...?',opts:['Messages lost!','System crashes','Messages wait safely!','Worker speeds up'],ans:2,expl:'Queue saves everything!'}]},
    {id:'6.3',emoji:'📰',title:'Subscribe to the Newsletter!',sub:'Pub/Sub',game:'mail',story:{scene:'📰',parts:['📰','📧','👥','🔔'],mascot:'Queenie the Bee 👸',text:{toddler:'When the teacher posts a newsletter, ALL subscribed parents get it! The teacher doesn\'t know who reads it — she just PUBLISHES and everyone subscribed AUTOMATICALLY gets it! That\'s PUB/SUB!',kids:'Pub/Sub = Publisher/Subscriber. Publishers send to a "topic" without knowing who receives. Subscribers listen to topics they care about. Publisher sends → ALL subscribers get it! Completely decoupled! Kafka!'},fact:'🔔 When you post on Instagram, ALL followers get notified via Pub/Sub!'},
     diag:{title:'Pub/Sub!',nodes:[{icon:'📢',text:'Publisher (one sender)',tip:'Sends to a topic. Doesn\'t know who receives!'},{icon:'📋',text:'Topic (like a channel)',tip:'Named channel!'},{icon:'👥',text:'Subscribers (many receivers!)',tip:'Everyone subscribed gets the message!'}]},
     quiz:[{q:'PUBLISHER is...?',opts:['One receiving','One SENDING to a topic!','The storage','A subscriber'],ans:1,expl:'Publisher sends messages to topics!'},{q:'Can ONE message reach MANY subscribers?',opts:['No, only one','Only two','Yes! All subscribers!','Only if they ask'],ans:2,expl:'Yes! One message fans out to every subscriber!'},{q:'Pub/Sub is like...?',opts:['A phone call','A newsletter — publish once, all get it!','A private message','A voicemail'],ans:1,expl:'Newsletter! Publish once → every subscriber gets it!'}]},
    {id:'6.4',emoji:'🌊',title:'The Mailbox is Full!',sub:'Back Pressure',game:'mail',story:{scene:'🌊',parts:['🌊','🛑','📬','⚡'],mascot:'Queenie the Bee 👸',text:{toddler:'Queenie\'s mailbox has 100 slots. Someone keeps stuffing letters faster than workers can empty it! Soon it\'s TOTALLY FULL! Smart solution: put a "FULL — STOP SENDING!" sign! The sender slows down until workers catch up! That\'s BACK PRESSURE!',kids:'Back pressure = flow control. When consumers can\'t keep up with producers, they push back — signal to slow down. Like a highway on-ramp traffic light. Prevents queue overflow and crashes!'},fact:'🚦 Highway on-ramp traffic lights ARE physical back pressure!'},
     diag:{title:'Back Pressure!',nodes:[{icon:'🏭',text:'Producer (too fast!)',tip:'Sending too many messages!'},{icon:'📬',text:'Queue (filling up!)',tip:'Queue getting full — danger!'},{icon:'🛑',text:'Back Pressure: Slow Down!',tip:'Consumer signals: slow down! Queue stabilizes!'}]},
     quiz:[{q:'What is BACK PRESSURE?',opts:['A massage type','Signal to producers to slow down!','A database trick','Making things faster'],ans:1,expl:'Back pressure says SLOW DOWN!'},{q:'Without back pressure, full queue means...?',opts:['Gets faster','Messages LOST or system crashes!','Fixes itself','Nothing bad'],ans:1,expl:'Full queue = messages lost or crash!'},{q:'Back pressure is like...?',opts:['A gas pedal','A highway on-ramp traffic light!','Broken brakes','Turbo boost'],ans:1,expl:'Traffic lights control car flow! Back pressure controls data flow!'}]},
    {id:'6.5',emoji:'💡',title:'Motion Sensor Magic!',sub:'Event-Driven Design',game:'mail',story:{scene:'💡',parts:['💡','🚶','⚡','🔔'],mascot:'Queenie the Bee 👸',text:{toddler:'The hallway light only turns ON when someone WALKS IN! It doesn\'t run all day wasting electricity. It WAITS for an EVENT and then REACTS! That\'s event-driven! Apps work the same way — wait for something to happen, then react!',kids:'Event-Driven Architecture: components communicate through events. Event = something happened (user ordered). Event published → multiple services react (send email, update inventory, charge card). Loosely coupled! Easy to extend!'},fact:'📦 One Amazon order triggers dozens of events: warehouse alert, inventory update, shipping, email — all from one event!'},
     diag:{title:'Event-Driven!',nodes:[{icon:'🚶',text:'Event happens! (user orders)',tip:'Something occurs — the trigger event!'},{icon:'📢',text:'Event published!',tip:'Multiple services listen and react!'},{icon:'⚡',text:'Many reactions! (email, ship, charge)',tip:'Each service reacts independently!'}]},
     quiz:[{q:'What triggers things in Event-Driven Design?',opts:['A timer only','An EVENT!','A random signal','Nothing'],ans:1,expl:'Events trigger everything!'},{q:'Event-driven is like a...?',opts:['Always-on engine','Motion sensor light!','A slow clock','A silent alarm'],ans:1,expl:'Motion sensor! Only activates when triggered!'},{q:'Adding a NEW reaction to an existing event...?',opts:['Changes everything','Impossible','Just add a new subscriber!','Crashes'],ans:2,expl:'Easy to extend! Old code untouched!'}]}
  ]},
  {id:7,emoji:'🤖',name:'Team Robot Town',sub:'Microservices & Distributed Systems',cls:'wc7',col:'#74b9ff',lcol:'#eef6ff',bdcol:'#2980b9',badge:'🤖',bname:'Robot Captain',desc:'One giant robot vs a whole team! How big systems stay alive!',say:'I used to do EVERYTHING myself. Now I have a team! If I fall, they keep going! 🤝',
   lessons:[
    {id:'7.1',emoji:'🏗️',title:'One Giant vs Robot Team',sub:'Monolith vs Microservices',game:'robot',story:{scene:'🤖',parts:['🏗️','🤖','🧩','✅'],mascot:'Robbie the Robot 🤖',text:{toddler:'MONOLITH: One giant robot does EVERYTHING! If its leg breaks, EVERYTHING stops! MICROSERVICES: A team — one cooks, one cleans, one drives! If the cook breaks, the driver still works! Much more resilient!',kids:'Monolith: all code in one app. Simple to start! But one bug can crash everything. Microservices: many small independent services. Deploy, scale, update each independently! Netflix has 1000+ microservices!'},fact:'🏗️ Netflix broke their monolith into 1000+ microservices. One failing service no longer crashes everything!'},
     diag:{title:'Monolith vs Microservices!',nodes:[{icon:'🏗️',text:'Monolith: One big app',tip:'Simple to start. But one bug = everything down!'},{icon:'🧩',text:'Microservices: Many small services',tip:'Each does one thing. One fails? Others keep working!'},{icon:'⚖️',text:'Trade-offs!',tip:'Monolith = simple. Microservices = resilient but complex!'}]},
     quiz:[{q:'MONOLITH means...?',opts:['Many small services','One big app!','A robot type','A database'],ans:1,expl:'Monolith = one big app! Simple but fragile!'},{q:'MICROSERVICES means...?',opts:['One big service','Many small independent services!','Tiny servers','A database'],ans:1,expl:'Microservices = many small services!'},{q:'Payment service crashes. With microservices...?',opts:['Everything crashes','Only payment is down!','Nothing happens','All crash'],ans:1,expl:'Isolated failures! Other services keep working!'}]},
    {id:'7.2',emoji:'🗒️',title:'The Magic Robot Directory',sub:'Service Discovery',game:'robot',story:{scene:'📋',parts:['📋','🔍','📍','🔄'],mascot:'Robbie the Robot 🤖',text:{toddler:'Robot Town has 100 robots! How does Cook Robot find Delivery Robot? There\'s a MAGIC DIRECTORY that updates itself! Every robot registers when it starts and removes itself when it stops. Need Delivery Robot? Check the directory!',kids:'Service discovery solves: in microservices, services start/stop dynamically. IPs change! Service A needs to find Service B. Client-Side or Server-Side discovery. Consul, Eureka, Kubernetes DNS!'},fact:'☸️ Kubernetes has built-in service discovery! Services find each other by name!'},
     diag:{title:'Service Discovery!',nodes:[{icon:'🆕',text:'New Service Starts → Registers!',tip:'Tells the registry: I\'m here at this address!'},{icon:'📋',text:'Service Registry',tip:'Always up-to-date list of all services!'},{icon:'🔍',text:'Service A asks: Where is B?',tip:'Ask registry! Get address. Connect directly!'}]},
     quiz:[{q:'Why is service discovery needed?',opts:['For fun','Services are dynamic — addresses change!','To slow things','Decoration'],ans:1,expl:'Microservices are dynamic! Discovery keeps track!'},{q:'A service registry is like...?',opts:['A database','A phone book that updates itself!','A load balancer','A cache'],ans:1,expl:'Living phone book! Always has current addresses!'},{q:'When a service SHUTS DOWN, it should...?',opts:['Stay in registry','Unregister!','Do nothing','Alert everything'],ans:1,expl:'Always unregister!'}]},
    {id:'7.3',emoji:'🚪',title:'The Grand Front Door',sub:'API Gateway',game:'robot',story:{scene:'🚪',parts:['🚪','🔀','🛡️','📋'],mascot:'Robbie the Robot 🤖',text:{toddler:'Robot Town has 100 robots but ONE grand front door! Every visitor comes to the FRONT DOOR first. The doorman checks your ID and sends you to the right robot! You only need to know ONE address!',kids:'API Gateway = single entry point. Handles: authentication, rate limiting, routing to right microservice. Mobile app talks to ONE gateway — behind it could be 50+ microservices! Kong, AWS API Gateway, Nginx!'},fact:'🌐 Your app talks to ONE API Gateway. Behind it could be 50 microservices!'},
     diag:{title:'API Gateway!',nodes:[{icon:'👥',text:'Many Clients',tip:'All talk to the SAME single gateway!'},{icon:'🚪',text:'API Gateway (front door!)',tip:'Checks auth, rate limits, routes to right service!'},{icon:'🤖',text:'Microservices behind it',tip:'Many services hidden behind gateway!'}]},
     quiz:[{q:'What is an API GATEWAY?',opts:['A database','Single entry point routing requests to microservices!','A cable','A robot'],ans:1,expl:'API Gateway = smart front door!'},{q:'Authentication should be handled...?',opts:['In every service','Once at the gateway!','Never','In the database'],ans:1,expl:'Handle auth ONCE at the gateway!'},{q:'Without API Gateway, apps need to know...?',opts:['Nothing','One address','Address of EVERY microservice!','Only DB address'],ans:2,expl:'Without gateway, apps must track every service!'}]},
    {id:'7.4',emoji:'⚡',title:'The Magic Power Switch',sub:'Circuit Breaker',game:'robot',story:{scene:'⚡',parts:['⚡','🔌','🛡️','✅'],mascot:'Robbie the Robot 🤖',text:{toddler:'The Payment Robot is SICK! Every request waits 30 seconds just to fail! All those waiting requests make OTHER robots sick too! Solution: a CIRCUIT BREAKER cuts off the sick robot! Now everyone instantly hears "Payment is down" and moves on!',kids:'Circuit breaker prevents cascading failures. States: CLOSED (normal), OPEN (too many failures, instantly fail), HALF-OPEN (test if recovered). Like electrical circuit breakers! Netflix Hystrix!'},fact:'🔌 Your house has circuit breakers! If one appliance shorts, only that circuit trips — not the whole house!'},
     diag:{title:'Circuit Breaker States!',nodes:[{icon:'✅',text:'CLOSED: Normal! Requests flow.',tip:'All good! Monitor for failures!'},{icon:'🔴',text:'OPEN: Failures! Blocked instantly!',tip:'Tripped! Requests instantly fail. Fail fast!'},{icon:'🟡',text:'HALF-OPEN: Testing recovery!',tip:'Let a few through. Succeed → close. Fail → reopen!'}]},
     quiz:[{q:'Circuit breaker PREVENTS...?',opts:['Fast responses','Cascading failures!','Too many users','DB crashes'],ans:1,expl:'Circuit breakers stop failure spreading!'},{q:'OPEN circuit means...?',opts:['All fine','Failing — requests blocked instantly!','Service healthy','Requests slow'],ans:1,expl:'Open = tripped! Instantly fails instead of waiting!'},{q:'Circuit breaker is named after...?',opts:['A board game','Real electrical circuit breakers!','A dance','A robot'],ans:1,expl:'Real circuit breakers protect homes. Software ones protect microservices!'}]},
    {id:'7.5',emoji:'📡',title:'GPS for Your Request',sub:'Distributed Tracing',game:'robot',story:{scene:'📡',parts:['📡','🗺️','🔍','📦'],mascot:'Robbie the Robot 🤖',text:{toddler:'You ordered a package! The tracking number lets you see: picked up → sorting center → local hub → out for delivery! Distributed tracing does that for internet requests — track them as they travel through 10 different robots!',kids:'In microservices, one request touches many services. Something is slow — WHERE? Distributed tracing tracks the whole journey! Each service adds a "span" with timing. Jaeger, Zipkin, Datadog!'},fact:'🔍 When Netflix is slow, engineers use distributed tracing to find which of 1000+ services is the culprit!'},
     diag:{title:'Trace the Journey!',nodes:[{icon:'📦',text:'Request starts! (Trace ID created)',tip:'Every request gets a unique ID that travels with it!'},{icon:'🔀',text:'Travels through 5 services',tip:'Each service logs timing!'},{icon:'🗺️',text:'Full picture — find the slow part!',tip:'See which service added the most delay!'}]},
     quiz:[{q:'What is DISTRIBUTED TRACING?',opts:['A database type','Tracking a request through multiple services!','A robot type','Cable management'],ans:1,expl:'Distributed tracing tracks requests through all services!'},{q:'System is slow. Tracing helps you...?',opts:['Auto-fix it','Find WHICH service is slow!','Delete the request','Restart everything'],ans:1,expl:'Tracing shows the full journey!'},{q:'A TRACE ID does what?',opts:['Encrypts','Links all logs across services for one request!','Makes faster','Stores data'],ans:1,expl:'Trace ID links everything together!'}]},
    {id:'7.6',emoji:'🗣️',title:'Playground Rumors!',sub:'Gossip Protocol',game:'robot',story:{scene:'🗣️',parts:['🗣️','👥','📢','🌐'],mascot:'Robbie the Robot 🤖',text:{toddler:'One robot learns something important! It tells 2 friends. Those 2 each tell 2 MORE. Those 4 tell 2 more. In just 10 rounds, ALL 1000 robots know! Just like playground rumors! That\'s the GOSSIP PROTOCOL!',kids:'Gossip protocol: each node periodically shares info with random neighbors. Information spreads exponentially! 1000 nodes → everyone knows in log(1000) ≈ 10 rounds! Used by Cassandra, Redis Cluster!'},fact:'🌐 Cassandra uses gossip so every node knows full cluster state with zero central coordinator!'},
     diag:{title:'Gossip Spreads!',nodes:[{icon:'🤖',text:'Robot 1 learns news!',tip:'One node gets info. Tells 2 random neighbors!'},{icon:'🗣️',text:'Tells 2 → they tell 2 each...',tip:'Information spreads exponentially!'},{icon:'🌐',text:'Everyone knows in ~10 rounds!',tip:'Fast, robust, no single point of failure!'}]},
     quiz:[{q:'Gossip protocol is like...?',opts:['A secret vault','Playground rumors spreading person to person!','A direct message','A loudspeaker'],ans:1,expl:'Gossip = rumors! Spreads exponentially fast!'},{q:'How fast does gossip reach 1000 nodes?',opts:['Slowly — 1000 rounds','Instantly','About 10 rounds!','Never reaches all'],ans:2,expl:'Exponential! 2→4→8→16... Just 10 rounds!'},{q:'Why is gossip RESILIENT?',opts:['Very simple','No central coordinator!','Centralized','Requires fast servers'],ans:1,expl:'No boss needed! Info routes around failures!'}]},
    {id:'7.7',emoji:'🗳️',title:'Vote for Team Captain!',sub:'Consensus & Leader Election',game:'robot',story:{scene:'🗳️',parts:['🗳️','👑','🤝','✅'],mascot:'Robbie the Robot 🤖',text:{toddler:'Robot Town needs a LEADER! But which robot? They VOTE! Most votes = LEADER! When the leader gets tired, they vote AGAIN! There\'s always a leader and everyone agrees. That\'s CONSENSUS!',kids:'Consensus = all nodes agree on a value. Leader election = choose one leader. Raft algorithm: nodes vote, leader wins majority, handles all writes. Leader fails → new election! Powers etcd which powers Kubernetes!'},fact:'☸️ Kubernetes uses etcd + Raft consensus to decide which server runs each container!'},
     diag:{title:'Leader Election!',nodes:[{icon:'🗳️',text:'Election time!',tip:'All nodes vote!'},{icon:'👑',text:'Majority wins → Leader!',tip:'Must get more than half!'},{icon:'⚡',text:'Leader handles all decisions!',tip:'Ensures consistency across the cluster!'}]},
     quiz:[{q:'Why do distributed systems need CONSENSUS?',opts:['For fun','All nodes must agree!','To go faster','Save memory'],ans:1,expl:'Consensus ensures all nodes agree!'},{q:'LEADER ELECTION means...?',opts:['Political election','Choosing one node as primary decision maker!','A voting game','Picking a database'],ans:1,expl:'Leader election picks ONE leader!'},{q:'Current leader CRASHES. What happens?',opts:['System stops forever','Data is lost','New election automatically!','Random takes over'],ans:2,expl:'New election! System keeps running!'}]}
  ]},
  {id:8,emoji:'🏗️',name:'The Build-It Workshop',sub:'Real System Case Studies',cls:'wc8',col:'#fd79a8',lcol:'#fff0f6',bdcol:'#c0306a',badge:'🏗️',bname:'Master Architect',desc:'Use EVERYTHING you learned to understand how YouTube and WhatsApp work!',say:'You\'ve learned SO much! Now let\'s see how real apps put it all together! 🏗️',
   lessons:[
    {id:'8.1',emoji:'💬',title:'Walkie-Talkies for Everyone!',sub:'WebSockets',game:'taco',story:{scene:'💬',parts:['💬','🔄','⚡','📡'],mascot:'Builder Bob 👷',text:{toddler:'Normal internet = LETTERS — send one, wait for a reply, send another. Slow! Walkie-talkies = DIFFERENT — both people talk any time! WebSockets are internet walkie-talkies! Used for: live chat, online games, real-time sports scores!',kids:'HTTP: client asks → server answers → connection closes. WebSockets: one connection stays OPEN! Both sides send messages anytime. Server can PUSH to client without being asked. Used by WhatsApp, Slack, Discord, multiplayer games!'},fact:'💬 WhatsApp, Slack, Discord ALL use WebSockets. That\'s why messages appear instantly!'},
     diag:{title:'WebSockets!',nodes:[{icon:'📩',text:'HTTP: Ask → Answer → Close',tip:'Normal HTTP closes after each response!'},{icon:'📡',text:'WebSocket: Always Connected!',tip:'One connection stays open! Both talk freely!'},{icon:'⚡',text:'Real-time magic!',tip:'Server pushes data without being asked!'}]},
     quiz:[{q:'WebSockets are like...?',opts:['Letters (ask and wait)','Walkie-talkies (always connected)!','A slow connection','A database'],ans:1,expl:'Walkie-talkies! Connection stays open!'},{q:'WebSocket is better for...?',opts:['Loading web pages','Real-time chat and games!','Downloading files','Sending emails'],ans:1,expl:'WebSocket shines for real-time!'},{q:'Can WebSocket server PUSH data?',opts:['No, client must ask first','Yes! Server pushes anytime!','Only once','Never'],ans:1,expl:'Yes! Server can push freely!'}]},
    {id:'8.2',emoji:'🔐',title:'The Secret Treehouse Key',sub:'Security & Auth',game:'taco',story:{scene:'🔐',parts:['🔑','🛡️','🔒','✅'],mascot:'Builder Bob 👷',text:{toddler:'Your treehouse has a SPECIAL LOCK! Only your KEY opens it! When you show the key, you get inside. This is AUTHENTICATION — proving you are WHO you say you are! Passwords are keys. Your fingerprint is a key!',kids:'Authentication = prove who you are. Authorization = what are you allowed to do? OAuth: "Login with Google". JWT tokens = signed proof of who you are. HTTPS encrypts everything. NEVER store plain-text passwords — always hash!'},fact:'🛡️ Modern apps use "Login with Google/GitHub" because those companies have massive security teams!'},
     diag:{title:'Security Layers!',nodes:[{icon:'🔑',text:'Authentication: Who are you?',tip:'Password, fingerprint, magic link!'},{icon:'🛡️',text:'Authorization: What can you do?',tip:'Admins can delete. Users can view!'},{icon:'🔒',text:'HTTPS: Encrypt everything!',tip:'All data encrypted in transit!'}]},
     quiz:[{q:'AUTHENTICATION means...?',opts:['Making faster','Proving who you are!','Storing data','Sending emails'],ans:1,expl:'Authentication = prove identity!'},{q:'AUTHORIZATION means...?',opts:['Proving who you are','What you\'re ALLOWED to do!','Encrypting','A server type'],ans:1,expl:'Authorization = permissions!'},{q:'Why hash passwords?',opts:['No reason','If DB breached, hashed passwords are useless to hackers!','Less space','Short passwords'],ans:1,expl:'Always hash! Plain text passwords = disaster!'}]},
    {id:'8.3',emoji:'📏',title:'How Much Pizza?',sub:'Estimation',game:'taco',story:{scene:'📏',parts:['📏','🧮','💡','📊'],mascot:'Builder Bob 👷',text:{toddler:'100 friends at your party! Each eats 3 slices. One pizza has 8 slices. How many pizzas? 100 × 3 ÷ 8 = 38 pizzas! Engineers do the SAME for computer systems! Quick math tells you if your plan makes sense BEFORE you build it!',kids:'Back-of-envelope estimation = quick rough math. 1B users × 10 requests/day = 10B/day ÷ 86,400 sec ≈ 115,000 req/sec. Need to handle that? Load balancers + many servers!'},fact:'🔢 Powers of 2: 2^10=1K, 2^20=1M, 2^30=1B. Makes big calculations fast!'},
     diag:{title:'Estimate Fast!',nodes:[{icon:'👥',text:'100M users daily',tip:'100M × 10 requests = 1B/day ÷ 86400 = ~11,500 req/sec!'},{icon:'⚡',text:'Requests per second',tip:'Know your RPS — tells you how many servers you need!'},{icon:'💰',text:'Cost estimate',tip:'Quick math prevents impossibly expensive designs!'}]},
     quiz:[{q:'1 billion daily users, 1 request each. Req/sec?',opts:['~1,000','~12,000!','~1 million','~100'],ans:1,expl:'1B ÷ 86,400 ≈ 12,000/sec!'},{q:'Why estimate BEFORE building?',opts:['For fun','Know size needed and feasibility!','Confuse people','No reason'],ans:1,expl:'Estimate first! Avoid expensive surprises!'},{q:'1 TB = how many GB?',opts:['1','100','1,000!','1,000,000'],ans:2,expl:'1 TB = 1,000 GB = 1,000,000 MB!'}]},
    {id:'8.4',emoji:'🔗',title:'The Nickname Machine',sub:'URL Shortener',game:'taco',story:{scene:'🔗',parts:['🔗','🔑','🗄️','⚡'],mascot:'Builder Bob 👷',text:{toddler:'bit.ly/abc is a NICKNAME for a really long address! When you click it, the nickname machine looks up the real address and sends you there! We need: a database + a cache for speed + a load balancer for scale!',kids:'URL Shortener: 1) Submit long URL 2) Generate short code 3) Store in DB 4) Return short URL. On click: 1) Check cache (fast!) 2) Cache miss → DB 3) Redirect. 1B URLs ≈ 500GB storage!'},fact:'🔗 Bit.ly handles 2+ billion redirects per MONTH! Heavy caching means most popular links are served from memory!'},
     diag:{title:'URL Shortener!',nodes:[{icon:'📥',text:'Receive long URL',tip:'User submits long URL...'},{icon:'🔑',text:'Generate short code',tip:'"abc123". Store in database!'},{icon:'⚡',text:'Redirect on click!',tip:'Check cache → check DB → 301 redirect!'}]},
     quiz:[{q:'URL shortener needs a ___ to store mappings?',opts:['Load balancer','Database!','CDN','Circuit breaker'],ans:1,expl:'Database stores the short→long mappings!'},{q:'Popular short URLs should use ___ to be fast?',opts:['Always database','Cache!','Ignore','Delete'],ans:1,expl:'Cache popular redirects!'},{q:'URL shortener reads vs writes?',opts:['Same','Much MORE reads than writes!','More writes','Equal'],ans:1,expl:'Way more reads! Optimize for reads!'}]},
    {id:'8.5',emoji:'🐦',title:'The Magic Bulletin Board',sub:'Twitter Feed',game:'taco',story:{scene:'🐦',parts:['🐦','📋','📢','👥'],mascot:'Builder Bob 👷',text:{toddler:'Taylor Swift posts a tweet — 150 MILLION followers see it! How? Special helper robots (fan-out workers) COPY the tweet to everyone\'s personal board the moment she posts! That\'s how Twitter feeds work!',kids:'Tweet posted → stored + fan-out to followers. 150M followers = 150M write operations! Pre-compute feeds at write time. Store in cache. But celebrities: too expensive! Merge at read time instead. Hybrid approach!'},fact:'🐦 Twitter handles 500 MILLION tweets per day!'},
     diag:{title:'Twitter Feed!',nodes:[{icon:'✍️',text:'Tweet posted!',tip:'Stored in timeline database!'},{icon:'🔀',text:'Fan-out workers!',tip:'Copy tweet to every follower\'s feed!'},{icon:'📋',text:'Pre-computed feed (cached!)',tip:'Your feed is ready before you open the app!'}]},
     quiz:[{q:'FAN-OUT means...?',opts:['Shorter tweets','Copying tweet to all followers\' feeds!','Deleting tweets','Cooling system'],ans:1,expl:'Fan-out = multiply! One tweet copies to millions of feeds!'},{q:'Why pre-compute feeds?',opts:['Wasted effort','Feeds load INSTANTLY!','Security','To save tweets'],ans:1,expl:'Pre-computed = instant loading!'},{q:'Celebrity with 100M followers fan-out on WRITE?',opts:['1 write','100M writes — too expensive!','10 writes','No writes'],ans:1,expl:'100M copies per tweet! So merge at read time instead!'}]},
    {id:'8.6',emoji:'📺',title:'Your Own TV Channel!',sub:'YouTube Architecture',game:'taco',story:{scene:'📺',parts:['📺','🎬','🌍','⚡'],mascot:'Builder Bob 👷',text:{toddler:'Someone uploads a video — 50 MILLION people watch it! The video is HUGE (10GB!). How does everyone watch from everywhere? The video is COPIED to hundreds of CDN servers near every city! Everyone watches from their NEAREST copy!',kids:'YouTube: Upload → transcode to multiple qualities (360p, 720p, 1080p, 4K) in PARALLEL → store → push to CDN worldwide. Adaptive bitrate switches quality based on your connection speed!'},fact:'📺 YouTube processes 500 HOURS of video every MINUTE in parallel across thousands of servers!'},
